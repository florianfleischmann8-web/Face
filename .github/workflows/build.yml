          package de.fernbedienung

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.View
          import android.widget.*
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.net.SocketTimeoutException
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger

          enum class Kind(val label: String) { SAMSUNG("Samsung"), LG("LG webOS"), ROKU("Roku"), OTHER("Sonstige") }

          data class Dev(val name: String, val ip: String?, val bt: BluetoothDevice?, val kind: Kind)

          /** Markenfilter: nur Geraete mit diesen Namen werden angezeigt. Liste einfach erweitern. */
          object Brands {
              private val exact = setOf("lg", "lge", "tv", "nec", "tcl")
              private val prefix = listOf(
                  "samsung", "sony", "bravia", "philips", "panasonic", "epson", "benq", "optoma", "viewsonic",
                  "hisense", "xiaomi", "roku", "vizio", "sharp", "toshiba", "acer", "chromecast", "webos",
                  "projector", "projektor", "beamer", "fire", "bose"
              )

              private fun tokens(t: String) = t.lowercase().split(Regex("[^a-z0-9]+")).filter { it.isNotEmpty() }

              fun matches(t: String) = tokens(t).any { w -> w in exact || prefix.any { w.startsWith(it) } }

              fun kind(t: String): Kind {
                  val l = t.lowercase()
                  val tk = tokens(t)
                  return when {
                      "samsung" in l -> Kind.SAMSUNG
                      "webos" in l || tk.any { it == "lg" || it == "lge" } -> Kind.LG
                      "roku" in l -> Kind.ROKU
                      else -> Kind.OTHER
                  }
              }
          }

          class MainActivity : Activity() {
              private val cBg = 0xFF101216.toInt()
              private val cBtn = 0xFF252A33.toInt()
              private val cAccent = 0xFF3D7BFF.toInt()
              private val cRed = 0xFFD93A3A.toInt()
              private val cText = 0xFFF2F4F8.toInt()
              private val cMuted = 0xFF9AA0AA.toInt()

              private lateinit var prefs: SharedPreferences
              private lateinit var listBox: LinearLayout
              private lateinit var status: TextView
              private val found = LinkedHashMap<String, Dev>()
              private var btHidden = 0
              private var inRemote = false
              private var netRemote: NetRemote? = null
              private var btHid: BtHid? = null
              private var rxRegistered = false

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences("fb", MODE_PRIVATE)
                  window.statusBarColor = cBg
                  window.navigationBarColor = cBg
                  window.decorView.setBackgroundColor(cBg)
                  val p = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION)
                  if (Build.VERSION.SDK_INT >= 31) {
                      p += Manifest.permission.BLUETOOTH_SCAN
                      p += Manifest.permission.BLUETOOTH_CONNECT
                  }
                  requestPermissions(p.toTypedArray(), 1)
                  showMain()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cleanupRemote()
                  if (rxRegistered) try { unregisterReceiver(btRx) } catch (_: Exception) {}
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (inRemote) showMain() else super.onBackPressed()
              }

              // ------------------------------------------------------------ UI helpers
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun shape(color: Int, r: Int = 18) = GradientDrawable().apply {
                  setColor(color); cornerRadius = dp(r).toFloat()
              }

              private fun lp(w: Int, h: Int, weight: Float = 0f) =
                  LinearLayout.LayoutParams(w, h, weight).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }

              private fun tv(text: String, size: Float = 14f, color: Int = cText, bold: Boolean = false) = TextView(this).apply {
                  this.text = text; textSize = size; setTextColor(color)
                  if (bold) setTypeface(typeface, Typeface.BOLD)
                  setPadding(dp(4), dp(6), dp(4), dp(6))
              }

              private fun btn(text: String, color: Int = cBtn, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  isAllCaps = false
                  textSize = 16f
                  setTextColor(cText)
                  setTypeface(typeface, Typeface.BOLD)
                  stateListAnimator = null
                  minHeight = 0; minimumHeight = 0
                  background = RippleDrawable(ColorStateList.valueOf(0x44FFFFFF), shape(color), null)
                  setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); onClick() }
              }

              private fun setStatus(s: String) = runOnUiThread { if (::status.isInitialized) status.text = s }

              // ------------------------------------------------------------ Hauptseite
              private fun showMain() {
                  cleanupRemote()
                  inRemote = false
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(cBg)
                      setPadding(dp(16), dp(48), dp(16), dp(16))
                  }
                  col.addView(tv("Fernbedienung", 30f, cText, true))
                  val row = LinearLayout(this)
                  row.addView(btn("WLAN scannen", cAccent) { scanWifi() }, lp(0, dp(56), 1f))
                  row.addView(btn("Bluetooth scannen") { scanBt() }, lp(0, dp(56), 1f))
                  col.addView(row)
                  status = tv("Starte einen Scan. Angezeigt werden nur bekannte Marken (LG, Samsung, Sony, Epson, ...).", 14f, cMuted)
                  col.addView(status)
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(ScrollView(this).apply { addView(listBox) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(col)
                  renderList()
              }

              private fun renderList() {
                  listBox.removeAllViews()
                  found.values.forEach { d ->
                      val addr = d.ip ?: d.bt?.address ?: ""
                      val type = if (d.bt != null) "Bluetooth" else d.kind.label
                      val b = btn("${d.name}\n$addr · $type") { showRemote(d) }
                      b.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                      b.setPadding(dp(18), dp(12), dp(18), dp(12))
                      listBox.addView(b, lp(-1, -2))
                  }
              }

              private fun addDev(key: String, d: Dev) = runOnUiThread { found[key] = d; if (::listBox.isInitialized) renderList() }

              // ------------------------------------------------------------ WLAN-Scan (SSDP/UPnP)
              private fun header(t: String, n: String) =
                  Regex("(?im)^$n:\\s*(.+)$").find(t)?.groupValues?.get(1)?.trim()

              private fun tag(x: String, n: String) =
                  Regex("<$n>(.*?)</$n>", RegexOption.DOT_MATCHES_ALL).find(x)?.groupValues?.get(1)?.trim()

              private fun scanWifi() {
                  setStatus("Suche im WLAN (ca. 10 s) ...")
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val lock = wm.createMulticastLock("ssdp").apply { setReferenceCounted(false); acquire() }
                  Thread {
                      val locs = ConcurrentHashMap<String, MutableSet<String>>()
                      val servers = ConcurrentHashMap<String, String>()
                      try {
                          DatagramSocket().use { sock ->
                              sock.soTimeout = 700
                              val msg = ("M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\n" +
                                  "MAN: \"ssdp:discover\"\r\nMX: 2\r\nST: ssdp:all\r\n\r\n").toByteArray()
                              val grp = InetAddress.getByName("239.255.255.250")
                              val end = System.currentTimeMillis() + 7000
                              var next = 0L
                              var sent = 0
                              val buf = ByteArray(8192)
                              while (System.currentTimeMillis() < end) {
                                  if (sent < 3 && System.currentTimeMillis() >= next) {
                                      sock.send(DatagramPacket(msg, msg.size, grp, 1900))
                                      sent++; next = System.currentTimeMillis() + 1500
                                  }
                                  try {
                                      val p = DatagramPacket(buf, buf.size)
                                      sock.receive(p)
                                      val txt = String(p.data, 0, p.length)
                                      val ip = p.address.hostAddress ?: continue
                                      header(txt, "LOCATION")?.let { locs.getOrPut(ip) { ConcurrentHashMap.newKeySet() }.add(it) }
                                      header(txt, "SERVER")?.let { servers[ip] = it }
                                  } catch (_: SocketTimeoutException) {}
                              }
                          }
                      } catch (e: Exception) {
                          setStatus("Fehler: ${e.message}")
                      }

                      val http = OkHttpClient.Builder().connectTimeout(2, TimeUnit.SECONDS).readTimeout(2, TimeUnit.SECONDS).build()
                      val shown = AtomicInteger()
                      val hidden = AtomicInteger()
                      val ips = (locs.keys + servers.keys).toSet()
                      ips.map { ip ->
                          Thread {
                              val sb = StringBuilder(servers[ip] ?: "")
                              var name: String? = null
                              for (u in locs[ip].orEmpty().take(3)) {
                                  try {
                                      http.newCall(Request.Builder().url(u).build()).execute().use { r ->
                                          val x = r.body?.string().orEmpty()
                                          if (name == null) name = tag(x, "friendlyName")
                                          sb.append(' ').append(tag(x, "manufacturer") ?: "")
                                              .append(' ').append(tag(x, "modelName") ?: "")
                                              .append(' ').append(name ?: "")
                                      }
                                  } catch (_: Exception) {}
                              }
                              val text = sb.toString()
                              if (Brands.matches(text)) {
                                  shown.incrementAndGet()
                                  addDev(ip, Dev(name ?: ip, ip, null, Brands.kind(text)))
                              } else hidden.incrementAndGet()
                          }.also { it.start() }
                      }.forEach { it.join() }
                      try { lock.release() } catch (_: Exception) {}
                      setStatus("WLAN fertig: ${shown.get()} Geraet(e) gefunden, ${hidden.get()} andere ausgeblendet.")
                  }.start()
              }

              // ------------------------------------------------------------ Bluetooth-Scan
              private val btRx = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      when (i.action) {
                          BluetoothDevice.ACTION_FOUND -> {
                              val d = btExtra(i) ?: return
                              handleBt(d, i.getStringExtra(BluetoothDevice.EXTRA_NAME))
                          }
                          BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                              val n = found.values.count { it.bt != null }
                              setStatus("Bluetooth fertig: $n gefunden, $btHidden andere ausgeblendet.")
                          }
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun btExtra(i: Intent): BluetoothDevice? =
                  if (Build.VERSION.SDK_INT >= 33) i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE, BluetoothDevice::class.java)
                  else i.getParcelableExtra(BluetoothDevice.EXTRA_DEVICE)

              @SuppressLint("MissingPermission")
              private fun handleBt(d: BluetoothDevice, hint: String? = null) {
                  val name = hint ?: d.name
                  if (name.isNullOrBlank() || !Brands.matches(name)) { btHidden++; return }
                  addDev(d.address, Dev(name, null, d, Kind.OTHER))
              }

              @SuppressLint("MissingPermission")
              private fun scanBt() {
                  val ad = (getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter
                  if (ad == null || !ad.isEnabled) { setStatus("Bluetooth ist ausgeschaltet."); return }
                  btHidden = 0
                  ad.bondedDevices.forEach { handleBt(it) }
                  if (rxRegistered) try { unregisterReceiver(btRx) } catch (_: Exception) {}
                  val f = IntentFilter(BluetoothDevice.ACTION_FOUND).apply { addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED) }
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(btRx, f, Context.RECEIVER_EXPORTED) else registerReceiver(btRx, f)
                  rxRegistered = true
                  ad.cancelDiscovery()
                  ad.startDiscovery()
                  setStatus("Bluetooth-Suche laeuft (ca. 12 s) ...")
              }

              // ------------------------------------------------------------ Fernbedienung
              private fun cleanupRemote() {
                  netRemote?.close(); netRemote = null
                  btHid?.stop(); btHid = null
              }

              private fun showRemote(d: Dev) {
                  cleanupRemote()
                  inRemote = true
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(cBg)
                      setPadding(dp(16), dp(40), dp(16), dp(24))
                  }
                  col.addView(btn("← Zurueck") { showMain() }, lp(-1, dp(52)))
                  col.addView(tv(d.name, 20f, cText, true))
                  val infoView = tv("", 14f, cMuted)
                  col.addView(infoView)
                  val setInfo: (String) -> Unit = { s -> runOnUiThread { infoView.text = s } }

                  var press: ((Key) -> Unit)? = null
                  if (d.bt != null) {
                      val h = BtHid(this, setInfo)
                      btHid = h
                      h.start(d.bt)
                      press = { k -> h.press(k) }
                  } else {
                      val ip = d.ip ?: ""
                      when (d.kind) {
                          Kind.SAMSUNG -> { val r = SamsungRemote(ip, prefs, setInfo); netRemote = r; press = { k -> r.send(k) }
                              setInfo("Samsung: verbinde ... (am TV ggf. 'Zulassen')") }
                          Kind.LG -> { val r = LgRemote(ip, prefs, setInfo); netRemote = r; press = { k -> r.send(k) }
                              setInfo("LG: verbinde ... (am TV ggf. bestaetigen)") }
                          Kind.ROKU -> { val r = RokuRemote(ip, setInfo); netRemote = r; press = { k -> r.send(k) } }
                          Kind.OTHER -> setInfo("Fuer diese Marke ist noch kein WLAN-Protokoll eingebaut. Versuche den Bluetooth-Scan.")
                      }
                  }
                  val p = press
                  if (p != null) col.addView(remotePad(p))

                  if (d.bt == null && d.ip != null && d.kind != Kind.OTHER) {
                      val mac = EditText(this).apply {
                          hint = "MAC-Adresse des TVs (zum Einschalten)"
                          setText(prefs.getString("mac_${d.ip}", ""))
                          setTextColor(cText)
                          setHintTextColor(cMuted)
                          background = shape(0xFF1C2028.toInt(), 14)
                          setPadding(dp(16), dp(14), dp(16), dp(14))
                      }
                      col.addView(mac, lp(-1, -2))
                      col.addView(btn("Einschalten (Wake-on-LAN)") {
                          prefs.edit().putString("mac_${d.ip}", mac.text.toString()).apply()
                          Thread {
                              val ok = try { wakeOnLan(mac.text.toString()) } catch (_: Exception) { false }
                              setInfo(if (ok) "Magic Packet gesendet" else "MAC-Adresse ungueltig")
                          }.start()
                      }, lp(-1, dp(56)))
                      if (d.kind == Kind.SAMSUNG && mac.text.isNullOrEmpty()) Thread {
                          try {
                              OkHttpClient.Builder().connectTimeout(2, TimeUnit.SECONDS).build()
                                  .newCall(Request.Builder().url("http://${d.ip}:8001/api/v2/").build()).execute().use { r ->
                                      val m = JSONObject(r.body?.string().orEmpty()).optJSONObject("device")?.optString("wifiMac")
                                      if (!m.isNullOrEmpty()) runOnUiThread { mac.setText(m) }
                                  }
                          } catch (_: Exception) {}
                      }.start()
                  }
                  setContentView(ScrollView(this).apply { setBackgroundColor(cBg); addView(col) })
              }

              private fun remotePad(p: (Key) -> Unit): LinearLayout {
                  val c = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  fun row(vararg items: Pair<String, Key?>) {
                      val r = LinearLayout(this)
                      items.forEach { (t, k) ->
                          val v: View = if (k == null) View(this) else {
                              val col = when (k) { Key.POWER -> cRed; Key.OK -> cAccent; else -> cBtn }
                              btn(t, col) { p(k) }
                          }
                          r.addView(v, lp(0, dp(60), 1f))
                      }
                      c.addView(r)
                  }
                  row("Power" to Key.POWER)
                  row("Vol +" to Key.VOL_UP, "Mute" to Key.MUTE, "CH +" to Key.CH_UP)
                  row("Vol −" to Key.VOL_DOWN, "" to null, "CH −" to Key.CH_DOWN)
                  row("" to null, "▲" to Key.UP, "" to null)
                  row("◀" to Key.LEFT, "OK" to Key.OK, "▶" to Key.RIGHT)
                  row("" to null, "▼" to Key.DOWN, "" to null)
                  row("Zurueck" to Key.BACK, "Home" to Key.HOME, "Menue" to Key.MENU)
                  row("⏯" to Key.PLAY)
                  return c
              }
          }
          EOF_7
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Fernbedienung-APK
          path: app/build/outputs/apk/debug/app-debug.apk
