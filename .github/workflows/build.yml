name: Build GlassVault

# Ablegen als: .github/workflows/build.yml  (Repo leer lassen, nur diese Datei!)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Projekt erzeugen (kompletter Code)
        run: |
          mkdir -p app/src/main/java/com/glassvault/app
          mkdir -p app/src/main/res/{values,drawable,layout,mipmap-anydpi,xml}

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GlassVault"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.glassvault.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.glassvault.app"
                  minSdk = 30
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.fragment:fragment-ktx:1.7.1")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.autofill:autofill:1.1.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:label="GlassVault"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.Glass"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".AuthActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar" />

                  <service
                      android:name=".GlassAutofill"
                      android:exported="true"
                      android:label="GlassVault"
                      android:permission="android.permission.BIND_AUTOFILL_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.autofill.AutofillService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.autofill"
                          android:resource="@xml/autofill_config" />
                  </service>

                  <service
                      android:name=".WalletTile"
                      android:exported="true"
                      android:label="Wallet"
                      android:icon="@drawable/ic_logo_fg"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/autofill_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <autofill-service xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Glass" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B1020</item>
                  <item name="android:statusBarColor">#0B1020</item>
                  <item name="android:navigationBarColor">#0B1020</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/af_item.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:padding="12dp">
              <TextView
                  android:id="@+id/t"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textSize="14sp" />
          </LinearLayout>
          EOF

          # ---------- Logo: Schild mit Schlüsselloch ----------
          cat > app/src/main/res/drawable/ic_logo_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,30 L72,37 L72,52 C72,63 64,72 54,76 C44,72 36,63 36,52 L36,37 Z" />
              <path
                  android:fillColor="#4F46E5"
                  android:pathData="M54,45 a4,4 0 1,1 0,8 a4,4 0 1,1 0,-8 Z M52.5,52 L55.5,52 L56.5,62 L51.5,62 Z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_logo_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="315" android:startColor="#6366F1" android:endColor="#8B5CF6" />
          </shape>
          EOF

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_logo_bg" />
              <foreground android:drawable="@drawable/ic_logo_fg" />
              <monochrome android:drawable="@drawable/ic_logo_fg" />
          </adaptive-icon>
          EOF

          # ---------- Verschlüsselung + Biometrie ----------
          cat > app/src/main/java/com/glassvault/app/Vault.kt <<'EOF'
          package com.glassvault.app

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.security.KeyStore
          import java.security.SecureRandom
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** type = "login" (title=Website/App, user, secret=Passwort) oder "card" (secret=Nummer, extra="MM/YY|CVV") */
          data class Entry(
              val id: String, val type: String, val title: String,
              val user: String, val secret: String, val extra: String
          )

          object Vault {
              private const val ALIAS = "glassvault_master_v1"

              // AES-256-GCM Schlüssel liegt im Android Keystore (hardwaregestützt, nicht exportierbar)
              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (ks.getKey(ALIAS, null) as? SecretKey)?.let { return it }
                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  kg.init(
                      KeyGenParameterSpec.Builder(
                          ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return kg.generateKey()
              }

              private fun file(c: Context) = File(c.filesDir, "vault.bin")

              fun load(c: Context): List<Entry> {
                  val f = file(c)
                  if (!f.exists()) return emptyList()
                  val raw = f.readBytes()
                  val iv = raw.copyOfRange(0, 12)
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, iv))
                  val json = String(cipher.doFinal(raw, 12, raw.size - 12), Charsets.UTF_8)
                  val arr = JSONArray(json)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Entry(
                          o.getString("id"), o.getString("type"), o.getString("title"),
                          o.getString("user"), o.getString("secret"), o.getString("extra")
                      )
                  }
              }

              fun save(c: Context, list: List<Entry>) {
                  val arr = JSONArray()
                  list.forEach {
                      arr.put(
                          JSONObject().put("id", it.id).put("type", it.type).put("title", it.title)
                              .put("user", it.user).put("secret", it.secret).put("extra", it.extra)
                      )
                  }
                  val cipher = Cipher.getInstance("AES/GCM/NoPadding")
                  cipher.init(Cipher.ENCRYPT_MODE, key()) // Keystore erzeugt zufälligen IV
                  val enc = cipher.doFinal(arr.toString().toByteArray(Charsets.UTF_8))
                  val tmp = File(c.filesDir, "vault.tmp")
                  tmp.writeBytes(cipher.iv + enc)
                  tmp.renameTo(file(c)) // atomar
              }

              /** Strikt: Web nur exakte Domain/Subdomain (Phishing-Schutz), Apps per Paketname. */
              fun match(l: List<Entry>, host: String, web: Boolean): List<Entry> = l.filter { e ->
                  e.type == "login" && run {
                      val t = e.title.lowercase().trim().removePrefix("https://").removePrefix("http://")
                          .removePrefix("www.").substringBefore("/")
                      val h = host.lowercase().removePrefix("www.")
                      if (t.isBlank()) false
                      else if (web) h == t || h.endsWith(".$t")
                      else t.substringBefore(".").filter { it.isLetterOrDigit() }.let { b -> b.length >= 3 && h.contains(b) }
                  }
              }

              /** auth.gmx.net -> gmx.net, shop.example.co.uk -> example.co.uk */
              fun baseDomain(host: String): String {
                  val parts = host.lowercase().removePrefix("www.").split(".")
                  return when {
                      parts.size <= 2 -> parts.joinToString(".")
                      parts[parts.size - 2].length <= 3 && parts.last().length == 2 -> parts.takeLast(3).joinToString(".")
                      else -> parts.takeLast(2).joinToString(".")
                  }
              }

              fun generate(n: Int = 20): String {
                  val cs = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#\$%&*-_=+?"
                  val r = SecureRandom()
                  return (1..n).map { cs[r.nextInt(cs.length)] }.joinToString("")
              }
          }

          fun FragmentActivity.authenticate(onFail: () -> Unit = {}, onOk: () -> Unit) {
              val info = BiometricPrompt.PromptInfo.Builder()
                  .setTitle("GlassVault")
                  .setSubtitle("Identität bestätigen")
                  .setAllowedAuthenticators(
                      BiometricManager.Authenticators.BIOMETRIC_STRONG or
                              BiometricManager.Authenticators.DEVICE_CREDENTIAL
                  )
                  .build()
              BiometricPrompt(this, ContextCompat.getMainExecutor(this),
                  object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) = onOk()
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) = onFail()
                  }).authenticate(info)
          }
          EOF

          # ---------- Autofill: erkennt Login-Felder in Apps & Browsern ----------
          cat > app/src/main/java/com/glassvault/app/Autofill.kt <<'EOF'
          package com.glassvault.app

          import android.app.PendingIntent
          import android.app.assist.AssistStructure
          import android.content.Intent
          import android.os.Bundle
          import android.os.CancellationSignal
          import android.service.autofill.*
          import android.text.InputType
          import android.view.View
          import android.view.autofill.AutofillId
          import android.view.autofill.AutofillManager
          import android.view.autofill.AutofillValue
          import android.widget.RemoteViews
          import android.widget.inline.InlinePresentationSpec
          import androidx.autofill.inline.UiVersions
          import androidx.autofill.inline.v1.InlineSuggestionUi
          import androidx.fragment.app.FragmentActivity
          import java.util.UUID

          private class Parsed(val pkg: String) {
              var user: AutofillId? = null
              var pw: AutofillId? = null
              var userTxt = ""
              var pwTxt = ""
              var web: String? = null
          }

          private fun txt(n: AssistStructure.ViewNode): String =
              n.autofillValue?.takeIf { it.isText }?.textValue?.toString().orEmpty()

          private fun isUserField(n: AssistStructure.ViewNode, hints: List<String>): Boolean {
              if (hints.any { it == "username" || it.contains("email") }) return true
              val v = n.inputType and InputType.TYPE_MASK_VARIATION
              if (v == InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS || v == InputType.TYPE_TEXT_VARIATION_WEB_EMAIL_ADDRESS) return true
              val rx = Regex("user|mail|login")
              return n.htmlInfo?.attributes?.any { (k, a) ->
                  (k == "type" && a == "email") ||
                      ((k == "name" || k == "id" || k == "autocomplete") && rx.containsMatchIn(a.lowercase()))
              } == true
          }

          /** Findet Benutzername- und Passwortfeld (auch bei 2-stufigen Logins wie GMX: erst nur E-Mail). */
          private fun parse(st: AssistStructure): Parsed {
              val p = Parsed(st.activityComponent.packageName)
              var prev: AssistStructure.ViewNode? = null
              fun walk(n: AssistStructure.ViewNode) {
                  if (p.web == null && !n.webDomain.isNullOrBlank()) p.web = n.webDomain
                  val id = n.autofillId
                  if (id != null && n.autofillType == View.AUTOFILL_TYPE_TEXT) {
                      val hints = n.autofillHints?.map { it.lowercase() }.orEmpty()
                      val isText = (n.inputType and InputType.TYPE_MASK_CLASS) == InputType.TYPE_CLASS_TEXT
                      val v = n.inputType and InputType.TYPE_MASK_VARIATION
                      val isPw = hints.any { it.contains("password") } || (isText && (
                          v == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                          v == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD ||
                          v == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD))
                      if (isPw) {
                          if (p.pw == null) { p.pw = id; p.pwTxt = txt(n) }
                      } else if (p.pw == null) {
                          if (p.user == null && isUserField(n, hints)) { p.user = id; p.userTxt = txt(n) }
                          prev = n
                      }
                  }
                  for (i in 0 until n.childCount) walk(n.getChildAt(i))
              }
              for (i in 0 until st.windowNodeCount) walk(st.getWindowNodeAt(i).rootViewNode)
              val pr = prev
              if (p.user == null && p.pw != null && pr != null) { p.user = pr.autofillId; p.userTxt = txt(pr) }
              return p
          }

          private fun inlinePres(spec: InlinePresentationSpec?, title: String, sub: String, attr: PendingIntent): InlinePresentation? {
              if (spec == null || !UiVersions.getVersions(spec.style).contains(UiVersions.INLINE_UI_VERSION_1)) return null
              val ui = InlineSuggestionUi.newContentBuilder(attr).setTitle(title).setSubtitle(sub).build()
              return InlinePresentation(ui.slice, spec, false)
          }

          class GlassAutofill : AutofillService() {

              @Suppress("DEPRECATION")
              override fun onFillRequest(request: FillRequest, signal: CancellationSignal, callback: FillCallback) {
                  val p = parse(request.fillContexts.last().structure)
                  if (p.pkg == packageName || (p.pw == null && p.user == null)) return callback.onSuccess(null)

                  val isWeb = p.web != null
                  val host = p.web ?: p.pkg
                  val matches = try { Vault.match(Vault.load(this), host, isWeb).take(5) } catch (e: Exception) { emptyList() }
                  val ids = listOfNotNull(p.user, p.pw)
                  val specs = request.inlineSuggestionsRequest?.inlinePresentationSpecs.orEmpty()
                  val attr = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val resp = FillResponse.Builder()

                  // Ein Vorschlag pro gespeichertem Zugang – Daten werden erst nach Biometrie herausgegeben
                  matches.forEachIndexed { i, e ->
                      val intent = Intent(this, AuthActivity::class.java)
                          .putExtra("eid", e.id).putExtra("user", p.user).putExtra("pw", p.pw)
                      val pi = PendingIntent.getActivity(
                          this, e.id.hashCode(), intent, PendingIntent.FLAG_CANCEL_CURRENT or PendingIntent.FLAG_MUTABLE
                      )
                      val label = if (e.user.isNotBlank()) e.user else e.title
                      val pres = RemoteViews(packageName, R.layout.af_item).apply {
                          setTextViewText(R.id.t, "GlassVault · $label")
                      }
                      val ds = Dataset.Builder(pres)
                      ids.forEach { ds.setValue(it, null) }
                      inlinePres(specs.getOrNull(i) ?: specs.lastOrNull(), label, "GlassVault", attr)?.let { ds.setInlinePresentation(it) }
                      ds.setAuthentication(pi.intentSender)
                      resp.addDataset(ds.build())
                  }

                  // Unbekannte Seite/App -> Android fragt nach dem Absenden "Speichern?"
                  val pwId = p.pw
                  if (pwId != null) {
                      val sb = SaveInfo.Builder(
                          SaveInfo.SAVE_DATA_TYPE_PASSWORD or SaveInfo.SAVE_DATA_TYPE_USERNAME, arrayOf(pwId)
                      )
                      p.user?.let { sb.setOptionalIds(arrayOf(it)) }
                      sb.setFlags(SaveInfo.FLAG_SAVE_ON_ALL_VIEWS_INVISIBLE)
                      resp.setSaveInfo(sb.build())
                  }
                  if (matches.isEmpty() && pwId == null) return callback.onSuccess(null)
                  callback.onSuccess(resp.build())
              }

              override fun onSaveRequest(request: SaveRequest, callback: SaveCallback) {
                  try {
                      val p = parse(request.fillContexts.last().structure)
                      if (p.pwTxt.isNotBlank()) {
                          val w = p.web
                          val isWeb = w != null
                          val parts = p.pkg.split(".")
                          val title = if (w != null) Vault.baseDomain(w) else if (parts.size >= 3) parts[1] else parts[0]
                          val list = Vault.load(this).toMutableList()
                          val idx = list.indexOfFirst {
                              it.type == "login" && it.user.equals(p.userTxt, true) &&
                                  Vault.match(listOf(it), w ?: p.pkg, isWeb).isNotEmpty()
                          }
                          if (idx >= 0) list[idx] = list[idx].copy(secret = p.pwTxt)
                          else list.add(0, Entry(UUID.randomUUID().toString(), "login", title, p.userTxt, p.pwTxt, ""))
                          Vault.save(this, list)
                      }
                  } catch (e: Exception) { }
                  callback.onSuccess()
              }
          }

          /** Biometrie-Abfrage bei JEDEM Ausfüllen – erst danach wird der Eintrag herausgegeben. */
          class AuthActivity : FragmentActivity() {
              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_SECURE,
                      android.view.WindowManager.LayoutParams.FLAG_SECURE
                  )
                  val user = intent.getParcelableExtra<AutofillId>("user")
                  val pw = intent.getParcelableExtra<AutofillId>("pw")
                  val eid = intent.getStringExtra("eid")

                  authenticate(onFail = { setResult(RESULT_CANCELED); finish() }) {
                      val e = Vault.load(this).firstOrNull { it.id == eid }
                      if (e == null) {
                          setResult(RESULT_CANCELED)
                      } else {
                          val pres = RemoteViews(packageName, R.layout.af_item).apply {
                              setTextViewText(R.id.t, e.title)
                          }
                          val ds = Dataset.Builder(pres)
                          user?.let { ds.setValue(it, AutofillValue.forText(e.user)) }
                          pw?.let { ds.setValue(it, AutofillValue.forText(e.secret)) }
                          setResult(RESULT_OK, Intent().putExtra(AutofillManager.EXTRA_AUTHENTICATION_RESULT, ds.build()))
                      }
                      finish()
                  }
              }
          }
          EOF

          # ---------- Quick-Settings-Kachel -> Wallet ----------
          cat > app/src/main/java/com/glassvault/app/WalletTile.kt <<'EOF'
          package com.glassvault.app

          import android.app.PendingIntent
          import android.content.Intent
          import android.os.Build
          import android.service.quicksettings.Tile
          import android.service.quicksettings.TileService

          class WalletTile : TileService() {
              override fun onStartListening() {
                  qsTile?.apply { state = Tile.STATE_INACTIVE; label = "Wallet"; updateTile() }
              }

              @Suppress("DEPRECATION")
              override fun onClick() {
                  val i = Intent(this, MainActivity::class.java)
                      .putExtra("tab", 1).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  if (Build.VERSION.SDK_INT >= 34) {
                      startActivityAndCollapse(
                          PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      )
                  } else startActivityAndCollapse(i)
              }
          }
          EOF

          # ---------- UI: Glass-Design ----------
          cat > app/src/main/java/com/glassvault/app/MainActivity.kt <<'EOF'
          package com.glassvault.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PersistableBundle
          import android.view.WindowManager
          import android.widget.Toast
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.input.VisualTransformation
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.fragment.app.FragmentActivity
          import java.util.UUID

          class MainActivity : FragmentActivity() {
              private var unlocked by mutableStateOf(false)
              private var tabReq by mutableIntStateOf(0)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Kein Screenshot / keine Vorschau im App-Switcher
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  tabReq = intent.getIntExtra("tab", 0)
                  setContent {
                      GlassTheme {
                          if (unlocked) Home(tabReq) { unlocked = false }
                          else LockScreen { unlock() }
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  tabReq = intent.getIntExtra("tab", 0)
              }

              override fun onStart() { super.onStart(); if (!unlocked) unlock() }

              // Auto-Lock: sobald die App in den Hintergrund geht
              override fun onStop() { super.onStop(); unlocked = false }

              private fun unlock() = authenticate { unlocked = true }
          }

          // ---------- Theme & Helfer ----------
          val Accent = Color(0xFF8B8DFF)
          val Dim = Color(0x99FFFFFF)

          @Composable
          fun GlassTheme(content: @Composable () -> Unit) =
              MaterialTheme(colorScheme = darkColorScheme(primary = Accent), content = content)

          fun Modifier.glass(r: Dp = 24.dp, base: Color = Color.Transparent): Modifier {
              val s = RoundedCornerShape(r)
              return this.clip(s)
                  .background(base)
                  .background(Brush.linearGradient(listOf(Color(0x2EFFFFFF), Color(0x0DFFFFFF))))
                  .border(1.dp, Brush.linearGradient(listOf(Color(0x66FFFFFF), Color(0x0FFFFFFF))), s)
          }

          fun copy(ctx: Context, text: String) {
              val cm = ctx.getSystemService(ClipboardManager::class.java)
              val clip = ClipData.newPlainText("gv", text)
              clip.description.extras = PersistableBundle().apply {
                  putBoolean("android.content.extra.IS_SENSITIVE", true)
              }
              cm.setPrimaryClip(clip)
              Handler(Looper.getMainLooper()).postDelayed({ try { cm.clearPrimaryClip() } catch (e: Exception) {} }, 30_000)
              Toast.makeText(ctx, "Kopiert · wird in 30 s gelöscht", Toast.LENGTH_SHORT).show()
          }

          @Composable
          fun Background() {
              Box(Modifier.fillMaxSize().background(Brush.verticalGradient(listOf(Color(0xFF0B1020), Color(0xFF1A1040), Color(0xFF0B1020))))) {
                  Box(Modifier.size(340.dp).offset((-120).dp, (-60).dp)
                      .background(Brush.radialGradient(listOf(Color(0x884F46E5), Color.Transparent))))
                  Box(Modifier.size(320.dp).align(Alignment.BottomEnd).offset(100.dp, 80.dp)
                      .background(Brush.radialGradient(listOf(Color(0x667C3AED), Color.Transparent))))
              }
          }

          @Composable
          fun Logo(size: Dp) {
              Box(
                  Modifier.size(size).clip(RoundedCornerShape(size * 0.3f))
                      .background(Brush.linearGradient(listOf(Color(0xFF6366F1), Color(0xFF8B5CF6)))),
                  contentAlignment = Alignment.Center
              ) {
                  Image(painterResource(R.drawable.ic_logo_fg), null, Modifier.requiredSize(size * 1.6f))
              }
          }

          @Composable
          fun GButton(text: String, accent: Boolean = false, onClick: () -> Unit) {
              val bg = if (accent) Brush.linearGradient(listOf(Color(0xFF6366F1), Color(0xFF8B5CF6)))
              else Brush.linearGradient(listOf(Color(0x33FFFFFF), Color(0x1AFFFFFF)))
              Box(
                  Modifier.clip(RoundedCornerShape(14.dp)).background(bg).clickable(onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 10.dp),
                  contentAlignment = Alignment.Center
              ) { Text(text, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Medium) }
          }

          @Composable
          fun Field(v: String, on: (String) -> Unit, label: String, kb: KeyboardType = KeyboardType.Text, mask: Boolean = false) {
              OutlinedTextField(
                  value = v, onValueChange = on, label = { Text(label) }, singleLine = true,
                  modifier = Modifier.fillMaxWidth(), shape = RoundedCornerShape(16.dp),
                  visualTransformation = if (mask) PasswordVisualTransformation() else VisualTransformation.None,
                  keyboardOptions = KeyboardOptions(keyboardType = kb),
                  colors = OutlinedTextFieldDefaults.colors(
                      focusedTextColor = Color.White, unfocusedTextColor = Color.White,
                      focusedBorderColor = Accent, unfocusedBorderColor = Color(0x33FFFFFF),
                      focusedLabelColor = Accent, unfocusedLabelColor = Dim, cursorColor = Color.White
                  )
              )
          }

          // ---------- Screens ----------
          @Composable
          fun LockScreen(onUnlock: () -> Unit) {
              Box(Modifier.fillMaxSize()) {
                  Background()
                  Column(
                      Modifier.fillMaxSize().padding(32.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center
                  ) {
                      Logo(104.dp)
                      Spacer(Modifier.height(24.dp))
                      Text("GlassVault", color = Color.White, fontSize = 32.sp, fontWeight = FontWeight.Bold)
                      Text("Dein Tresor ist gesperrt", color = Dim, fontSize = 14.sp)
                      Spacer(Modifier.height(32.dp))
                      GButton("Entsperren", accent = true, onClick = onUnlock)
                  }
              }
          }

          @Composable
          fun Home(startTab: Int, onLock: () -> Unit) {
              val ctx = LocalContext.current
              val all = remember { mutableStateListOf<Entry>().apply { addAll(Vault.load(ctx)) } }
              var tab by remember(startTab) { mutableIntStateOf(startTab) }
              var q by remember { mutableStateOf("") }
              var add by remember { mutableStateOf(false) }
              var open by remember { mutableStateOf<String?>(null) }
              val type = if (tab == 0) "login" else "card"
              val shown = all.filter {
                  it.type == type && (q.isBlank() || it.title.contains(q, true) || it.user.contains(q, true))
              }
              fun persist() = Vault.save(ctx, all.toList())

              Box(Modifier.fillMaxSize()) {
                  Background()
                  Column(Modifier.fillMaxSize().systemBarsPadding().padding(horizontal = 20.dp, vertical = 16.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Logo(44.dp)
                          Spacer(Modifier.width(12.dp))
                          Column(Modifier.weight(1f)) {
                              Text("GlassVault", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                              Text("${all.size} Einträge · AES-256-GCM", color = Dim, fontSize = 12.sp)
                          }
                          GButton("Sperren", onClick = onLock)
                      }
                      Spacer(Modifier.height(20.dp))
                      Row(Modifier.fillMaxWidth().glass(18.dp).padding(4.dp)) {
                          listOf("Passwörter", "Wallet").forEachIndexed { i, s ->
                              Box(
                                  Modifier.weight(1f).clip(RoundedCornerShape(14.dp))
                                      .background(if (tab == i) Color(0x33FFFFFF) else Color.Transparent)
                                      .clickable { tab = i; open = null }.padding(vertical = 10.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(s, color = Color.White, fontWeight = if (tab == i) FontWeight.SemiBold else FontWeight.Normal)
                              }
                          }
                      }
                      Spacer(Modifier.height(14.dp))
                      Field(q, { q = it }, "Suchen")
                      Spacer(Modifier.height(14.dp))
                      if (shown.isEmpty()) {
                          Box(Modifier.fillMaxWidth().padding(top = 60.dp), contentAlignment = Alignment.Center) {
                              Text(
                                  if (tab == 0) "Noch keine Passwörter.\nTippe auf + zum Hinzufügen." else "Noch keine Karten.\nTippe auf + zum Hinzufügen.",
                                  color = Dim
                              )
                          }
                      }
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 100.dp)) {
                          items(shown, key = { it.id }) { e ->
                              val isOpen = open == e.id
                              val toggle = { open = if (isOpen) null else e.id }
                              val del = { all.remove(e); persist(); open = null }
                              if (e.type == "login") LoginItem(e, isOpen, toggle, del) else CardItem(e, isOpen, toggle, del)
                          }
                      }
                  }
                  Box(
                      Modifier.align(Alignment.BottomEnd).padding(24.dp).size(62.dp).clip(CircleShape)
                          .background(Brush.linearGradient(listOf(Color(0xFF6366F1), Color(0xFF8B5CF6))))
                          .clickable { add = true },
                      contentAlignment = Alignment.Center
                  ) { Text("+", color = Color.White, fontSize = 30.sp) }
              }

              if (add) AddDialog(type, { add = false }) { e ->
                  all.add(0, e); persist(); add = false
              }
          }

          @Composable
          fun LoginItem(e: Entry, open: Boolean, toggle: () -> Unit, del: () -> Unit) {
              val ctx = LocalContext.current
              var show by remember { mutableStateOf(false) }
              Column(Modifier.fillMaxWidth().glass().clickable(onClick = toggle).padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Box(
                          Modifier.size(44.dp).clip(CircleShape)
                              .background(Brush.linearGradient(listOf(Color(0xFF6366F1), Color(0xFF8B5CF6)))),
                          contentAlignment = Alignment.Center
                      ) { Text(e.title.take(1).uppercase(), color = Color.White, fontWeight = FontWeight.Bold) }
                      Spacer(Modifier.width(14.dp))
                      Column {
                          Text(e.title, color = Color.White, fontWeight = FontWeight.SemiBold, fontSize = 16.sp)
                          Text(e.user, color = Dim, fontSize = 13.sp)
                      }
                  }
                  if (open) {
                      Spacer(Modifier.height(14.dp))
                      Text(
                          if (show) e.secret else "•".repeat(minOf(e.secret.length, 20)),
                          color = Color.White, fontFamily = FontFamily.Monospace, fontSize = 15.sp
                      )
                      Spacer(Modifier.height(12.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          GButton("Benutzer") { copy(ctx, e.user) }
                          GButton("Passwort", accent = true) { copy(ctx, e.secret) }
                          GButton(if (show) "Verbergen" else "Zeigen") { show = !show }
                          GButton("Löschen", onClick = del)
                      }
                  }
              }
          }

          @Composable
          fun CardItem(e: Entry, open: Boolean, toggle: () -> Unit, del: () -> Unit) {
              val ctx = LocalContext.current
              val parts = e.extra.split("|")
              val exp = parts.getOrElse(0) { "" }
              val cvv = parts.getOrElse(1) { "" }
              val digits = e.secret.filter { it.isDigit() }
              val numText = if (open) digits.chunked(4).joinToString(" ")
              else "••••  ••••  ••••  " + digits.takeLast(4)
              val s = RoundedCornerShape(24.dp)
              Column {
                  Column(
                      Modifier.fillMaxWidth().aspectRatio(1.6f).clip(s)
                          .background(Brush.linearGradient(listOf(Color(0xFF4F46E5), Color(0xFF9333EA), Color(0xFF0EA5E9))))
                          .border(1.dp, Color(0x55FFFFFF), s).clickable(onClick = toggle).padding(20.dp),
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Text(e.title, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 17.sp)
                      Text(numText, color = Color.White, fontFamily = FontFamily.Monospace, fontSize = 19.sp, letterSpacing = 1.sp)
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                          Column {
                              Text("INHABER", color = Dim, fontSize = 10.sp)
                              Text(e.user.uppercase(), color = Color.White, fontSize = 13.sp)
                          }
                          Column {
                              Text("GÜLTIG BIS", color = Dim, fontSize = 10.sp)
                              Text(exp, color = Color.White, fontSize = 13.sp)
                          }
                          if (open) Column {
                              Text("CVV", color = Dim, fontSize = 10.sp)
                              Text(cvv, color = Color.White, fontSize = 13.sp)
                          }
                      }
                  }
                  if (open) {
                      Spacer(Modifier.height(10.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          GButton("Nummer", accent = true) { copy(ctx, digits) }
                          GButton("CVV") { copy(ctx, cvv) }
                          GButton("Löschen", onClick = del)
                      }
                  }
              }
          }

          @Composable
          fun AddDialog(type: String, onDismiss: () -> Unit, onSave: (Entry) -> Unit) {
              var t by remember { mutableStateOf("") }
              var u by remember { mutableStateOf("") }
              var s by remember { mutableStateOf("") }
              var x by remember { mutableStateOf("") }
              var c by remember { mutableStateOf("") }
              val login = type == "login"
              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Column(
                      Modifier.padding(20.dp).fillMaxWidth().glass(28.dp, Color(0xFF141A36))
                          .verticalScroll(rememberScrollState()).padding(20.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text(if (login) "Neues Passwort" else "Neue Karte", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      if (login) {
                          Field(t, { t = it }, "Website / App (z. B. netflix.com)", KeyboardType.Uri)
                          Field(u, { u = it }, "Benutzername / E-Mail", KeyboardType.Email)
                          Field(s, { s = it }, "Passwort")
                          GButton("Sicheres Passwort generieren") { s = Vault.generate() }
                      } else {
                          Field(t, { t = it }, "Kartenname (z. B. Visa)")
                          Field(u, { u = it }, "Karteninhaber")
                          Field(s, { s = it }, "Kartennummer", KeyboardType.Number)
                          Field(x, { x = it }, "Gültig bis (MM/YY)", KeyboardType.Number)
                          Field(c, { c = it }, "CVV", KeyboardType.NumberPassword, mask = true)
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          GButton("Abbrechen", onClick = onDismiss)
                          GButton("Speichern", accent = true) {
                              if (t.isNotBlank() && s.isNotBlank()) {
                                  onSave(Entry(UUID.randomUUID().toString(), type, t.trim(), u.trim(), s, if (login) "" else "${x.trim()}|${c.trim()}"))
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: APK bauen
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: GlassVault-APK
          path: app/build/outputs/apk/debug/app-debug.apk
