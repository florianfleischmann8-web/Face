      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Marktkasse.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Marktkasse-APK
          path: Marktkasse.apk
