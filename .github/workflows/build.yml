              Column(Modifier.fillMaxWidth().glass(26.dp).padding(18.dp)) {
                  Txt("GEHEN & LAUFEN", 11, FontWeight.SemiBold, .55f, spacing = 1f)
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth().height(14.dp).clip(CircleShape).background(Color.White.copy(alpha = .08f))) {
                      Box(Modifier.weight(max(.0001f, 1f - rf)).fillMaxHeight().background(Mint))
                      Box(Modifier.weight(max(.0001f, rf)).fillMaxHeight().background(Amber))
                  }
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Txt("Gehen  ${d.walk.fmt()}", 14, FontWeight.Medium, color = Mint)
                      Txt("Laufen  ${d.run.fmt()}", 14, FontWeight.Medium, color = Amber)
