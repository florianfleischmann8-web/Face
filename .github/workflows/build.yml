name: Build Flora APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Projekt erzeugen
        run: |
          P=app/src/main
          K=$P/java/com/flora/app
          mkdir -p $K $P/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Flora"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.flora.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.flora.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > $P/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Flora" parent="android:Theme.DeviceDefault.Wallpaper.NoTitleBar">
                  <item name="android:windowShowWallpaper">true</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application android:label="Flora" android:theme="@style/Flora">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".WakeService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > $K/Cfg.kt <<'EOF'
          package com.flora.app

          import android.content.Context

          // ===== KONFIGURATION: Liquid-Glass-Look =====
          object Cfg {
              const val WAKE = "flora"
              const val BLUR = 60              // Hintergrund-Blur (px, Android 12+)
              const val RADIUS = 0.2237f       // Apple-Eckenradius im Verhältnis zur Icon-Größe
              const val GLASS_TOP = 0x40FFFFFF // Glas-Tönung oben
              const val GLASS_BOTTOM = 0x10FFFFFF
              const val DOCK_FILL = 0x33FFFFFF
              const val DOCK_STROKE = 0x66FFFFFF
          }

          fun Context.dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          EOF

          cat > $K/Glass.kt <<'EOF'
          package com.flora.app

          import android.graphics.*
          import android.graphics.drawable.Drawable

          object Glass {
              private val cache = HashMap<String, Bitmap>()

              fun icon(key: String, d: Drawable, s: Int): Bitmap = cache.getOrPut(key) {
                  val b = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(b)
                  val f = s.toFloat()
                  val r = f * Cfg.RADIUS
                  val path = Path().apply { addRoundRect(RectF(2f, 2f, f - 2f, f - 2f), r, r, Path.Direction.CW) }

                  c.save()
                  c.clipPath(path)
                  d.setBounds(0, 0, s, s)
                  d.draw(c)
                  // Glas-Tönung
                  val tint = Paint(Paint.ANTI_ALIAS_FLAG)
                  tint.shader = LinearGradient(0f, 0f, 0f, f, Cfg.GLASS_TOP, Cfg.GLASS_BOTTOM, Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, f, f, tint)
                  // Glanz oben
                  val gloss = Paint(Paint.ANTI_ALIAS_FLAG)
                  gloss.shader = LinearGradient(0f, 0f, 0f, f * 0.5f, 0x55FFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP)
                  c.drawRect(0f, 0f, f, f * 0.5f, gloss)
                  c.restore()

                  // Spekulare Kante
                  val edge = Paint(Paint.ANTI_ALIAS_FLAG)
                  edge.style = Paint.Style.STROKE
                  edge.strokeWidth = f * 0.025f
                  edge.shader = LinearGradient(
                      0f, 0f, f, f,
                      intArrayOf(0xDDFFFFFF.toInt(), 0x11FFFFFF, 0x88FFFFFF.toInt()), null, Shader.TileMode.CLAMP
                  )
                  c.drawPath(path, edge)
                  b
              }
          }
          EOF

          cat > $K/Apps.kt <<'EOF'
          package com.flora.app

          import android.content.Context
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import kotlin.math.abs

          data class AppInfo(val label: String, val pkg: String, val icon: Drawable)

          object Apps {
              private var cached: List<AppInfo>? = null

              fun list(ctx: Context, refresh: Boolean = false): List<AppInfo> {
                  if (!refresh) cached?.let { return it }
                  val pm = ctx.packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val l = pm.queryIntentActivities(i, 0)
                      .map { AppInfo(it.loadLabel(pm).toString(), it.activityInfo.packageName, it.loadIcon(pm)) }
                      .filter { it.pkg != ctx.packageName }
                      .sortedBy { it.label.lowercase() }
                  cached = l
                  return l
              }

              private val fill = setOf("öffne", "öffnen", "starte", "starten", "open", "bitte", "mach", "die", "den", "das", "app", "auf", "mal")

              fun find(ctx: Context, cmd: String, strict: Boolean): AppInfo? {
                  val q = cmd.split(" ", ",", ".", "!", "?").filter { it.isNotBlank() && it !in fill }.joinToString(" ")
                  if (q.length < 2) return null
                  val all = list(ctx)
                  val hits = all.filter {
                      val l = it.label.lowercase()
                      if (strict) (l == q || (l.length >= 3 && q.contains(l))) else (l == q || l.contains(q) || q.contains(l))
                  }
                  return hits.minByOrNull { abs(it.label.length - q.length) }
              }

              fun open(ctx: Context, a: AppInfo) {
                  ctx.packageManager.getLaunchIntentForPackage(a.pkg)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(it)
                  }
              }
          }
          EOF

          cat > $K/Orb.kt <<'EOF'
          package com.flora.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.min
          import kotlin.math.sin

          class Orb(c: Context) : View(c) {
              private var t = 0f
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG)
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 7f }
              private val core = Paint(Paint.ANTI_ALIAS_FLAG)
              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2400
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { t = it.animatedValue as Float; invalidate() }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val pulse = 1f + 0.12f * sin(t * 2f * PI.toFloat())
                  val r = min(width, height) / 2f * 0.45f * pulse

                  glow.shader = RadialGradient(
                      cx, cy, r * 2f,
                      intArrayOf(0xAA8A7CFF.toInt(), 0x558AE4FF, 0x00FFFFFF),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, r * 2f, glow)

                  core.shader = RadialGradient(
                      cx, cy - r * 0.3f, r,
                      intArrayOf(0xF0FFFFFF.toInt(), 0x66BFD9FF, 0x33FFFFFF), null, Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, r, core)

                  c.save()
                  c.rotate(t * 360f, cx, cy)
                  ring.shader = SweepGradient(
                      cx, cy,
                      intArrayOf(0x00FFFFFF, 0xFFFF7AD9.toInt(), 0xFF7AC8FF.toInt(), 0xFFB7FF9A.toInt(), 0x00FFFFFF), null
                  )
                  c.drawCircle(cx, cy, r * 1.08f, ring)
                  c.restore()
              }
          }
          EOF

          cat > $K/WakeService.kt <<'EOF'
          package com.flora.app

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.*
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator

          class WakeService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var sr: SpeechRecognizer? = null
              private var orb: Orb? = null
              private var awake = false
              private var handled = false
              private val timeout = Runnable { hideOrb() }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("flora", "Flora", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "flora")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Flora hört zu")
                      .setContentText("Sag: Hey Flora")
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
                  if (sr == null) begin()
                  return START_STICKY
              }

              private fun begin() {
                  sr = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(p: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(v: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                          override fun onError(e: Int) {
                              h.postDelayed({ sr?.cancel(); listen() },
                                  if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) 800L else 250L)
                          }
                          override fun onResults(b: Bundle?) { process(text(b), true); h.postDelayed({ listen() }, 150) }
                          override fun onPartialResults(b: Bundle?) { process(text(b), false) }
                      })
                  }
                  listen()
              }

              private fun text(b: Bundle?) =
                  b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()?.lowercase() ?: ""

              private fun listen() {
                  handled = false
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "de-DE")
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      .putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                  sr?.startListening(i)
              }

              private fun process(t: String, final: Boolean) {
                  if (handled || t.isBlank()) return
                  val idx = t.indexOf(Cfg.WAKE)
                  if (idx < 0 && !awake) return
                  if (!awake) { awake = true; showOrb() }
                  h.removeCallbacks(timeout)
                  h.postDelayed(timeout, 7000)
                  val cmd = if (idx >= 0) t.substring(idx + Cfg.WAKE.length) else t
                  val app = Apps.find(this, cmd, !final)
                  if (app != null) {
                      handled = true
                      Apps.open(this, app)
                      hideOrb()
                  }
              }

              private fun showOrb() {
                  if (orb != null) return
                  val o = Orb(this)
                  val lp = WindowManager.LayoutParams(
                      dp(240), dp(240),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                  lp.y = dp(48)
                  o.alpha = 0f; o.scaleX = 0.5f; o.scaleY = 0.5f
                  (getSystemService(Context.WINDOW_SERVICE) as WindowManager).addView(o, lp)
                  o.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(260)
                      .setInterpolator(OvershootInterpolator(1.4f)).start()
                  orb = o
              }

              private fun hideOrb() {
                  awake = false
                  h.removeCallbacks(timeout)
                  val o = orb ?: return
                  orb = null
                  o.animate().alpha(0f).scaleX(0.5f).scaleY(0.5f).setDuration(200).withEndAction {
                      try { (getSystemService(Context.WINDOW_SERVICE) as WindowManager).removeView(o) } catch (_: Exception) {}
                  }.start()
              }

              override fun onDestroy() {
                  sr?.destroy()
                  hideOrb()
                  super.onDestroy()
              }
          }
          EOF

          cat > $K/MainActivity.kt <<'EOF'
          package com.flora.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*

          class MainActivity : Activity() {
              private var asked = false
              private lateinit var grid: GridView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.setBackgroundDrawable(ColorDrawable(0x22000000))
                  if (Build.VERSION.SDK_INT >= 31) window.setBackgroundBlurRadius(Cfg.BLUR)

                  val root = FrameLayout(this)
                  grid = GridView(this).apply {
                      numColumns = 4
                      verticalSpacing = dp(22)
                      selector = ColorDrawable(Color.TRANSPARENT)
                      clipToPadding = false
                      setPadding(dp(14), dp(64), dp(14), dp(130))
                      isVerticalScrollBarEnabled = false
                  }
                  root.addView(grid, ViewGroup.LayoutParams(-1, -1))

                  val dock = TextView(this).apply {
                      text = "●  Sag „Hey Flora“"
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(dp(28), dp(16), dp(28), dp(16))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(32).toFloat()
                          setColor(Cfg.DOCK_FILL)
                          setStroke(dp(1), Cfg.DOCK_STROKE)
                      }
                  }
                  root.addView(dock, FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL).apply { bottomMargin = dp(36) })
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  val apps = Apps.list(this, true)
                  grid.adapter = object : BaseAdapter() {
                      override fun getCount() = apps.size
                      override fun getItem(p: Int) = apps[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, v: View?, parent: ViewGroup): View {
                          val a = apps[p]
                          val img = ImageView(this@MainActivity).apply {
                              setImageBitmap(Glass.icon(a.pkg, a.icon, dp(120)))
                          }
                          val tv = TextView(this@MainActivity).apply {
                              text = a.label
                              setTextColor(Color.WHITE)
                              textSize = 11f
                              maxLines = 1
                              gravity = Gravity.CENTER
                              setShadowLayer(6f, 0f, 2f, 0x99000000.toInt())
                          }
                          return LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER_HORIZONTAL
                              addView(img, LinearLayout.LayoutParams(dp(60), dp(60)))
                              addView(tv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(6) })
                              setOnClickListener { Apps.open(this@MainActivity, a) }
                          }
                      }
                  }
                  checkSetup()
              }

              private fun checkSetup() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (!asked) {
                          asked = true
                          val p = if (Build.VERSION.SDK_INT >= 33)
                              arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                          else arrayOf(Manifest.permission.RECORD_AUDIO)
                          requestPermissions(p, 1)
                      }
                  } else if (!Settings.canDrawOverlays(this)) {
                      if (!asked) {
                          asked = true
                          Toast.makeText(this, "Bitte „Über anderen Apps einblenden“ erlauben", Toast.LENGTH_LONG).show()
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  } else {
                      startForegroundService(Intent(this, WakeService::class.java))
                  }
              }

              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) {
                  asked = false
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Flora-APK
          path: app/build/outputs/apk/debug/app-debug.apk
