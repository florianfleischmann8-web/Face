          @Composable
          fun LivePill() {
              val mode = if (Live.running) Live.mode else "off"
              val flash = System.currentTimeMillis() - Live.fakeFlash < 2500
              val col by animateColorAsState(
                  when {
                      flash -> Rose
                      mode == "run" -> Amber
                      mode == "walk" -> Mint
                      mode == "idle" -> Sky
                      else -> Color.Gray
                  }, tween(400), label = "dot"
              )
              val inf = rememberInfiniteTransition(label = "pulse")
              val pulse by inf.animateFloat(
                  .6f, 1.25f,
                  infiniteRepeatable(tween(900, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "pulse"
              )
              val text = when {
                  flash -> "Fake-Schritt erkannt"
                  mode == "run" -> "Laufen · ${Live.cadence} Schritte/min"
                  mode == "walk" -> "Gehen · ${Live.cadence} Schritte/min"
                  mode == "idle" -> "Bereit – wartet auf Bewegung"
                  else -> "Live-Erkennung aus"
              }
              Row(
                  Modifier.fillMaxWidth().glass(24.dp).padding(horizontal = 18.dp, vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(10.dp).scale(if (mode == "off") 1f else pulse).background(col, CircleShape))
                  Spacer(Modifier.width(12.dp))
                  Txt(text, 15, FontWeight.Medium)
              }
          }

