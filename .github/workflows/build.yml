                  sendBtn = new TextView(this);
                  sendBtn.setText("➤");
                  sendBtn.setTextSize(18);
                  sendBtn.setTextColor(Color.WHITE);
                  sendBtn.setGravity(Gravity.CENTER);
                  GradientDrawable sg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF6AA8FF, 0xFF7B5CFF});
                  sg.setShape(GradientDrawable.OVAL);
                  sg.setStroke(dp(1), 0x99FFFFFF);
