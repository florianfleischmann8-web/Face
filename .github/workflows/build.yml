# Discipline - komplette App in einer Datei.
# Diese Datei als .github/workflows/build.yml in ein leeres GitHub-Repo legen.
# Dann: Actions -> "Build APK" -> Run workflow -> APK unter "Artifacts" laden.
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Datei app/build.gradle.kts"
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.discipline.app"
              compileSdk = 34
              defaultConfig { applicationId = "com.discipline.app"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("com.google.mlkit:pose-detection:18.0.0-beta4")
          }
          EOF_FILE

      - name: "Datei build.gradle.kts"
        run: |
          mkdir -p .
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE

      - name: "Datei gradle.properties"
        run: |
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE

      - name: "Datei settings.gradle.kts"
        run: |
          mkdir -p .
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Discipline"
          include(":app")
          EOF_FILE

      - name: "Datei app/src/main/AndroidManifest.xml"
        run: |
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:usesCleartextTraffic="true" android:label="Discipline" android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher" android:theme="@style/Theme.Discipline">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".ExerciseActivity" android:exported="false"/>
                  <service android:name=".BlockerService" android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility"/>
                  </service>
                  <receiver android:name=".AdminReceiver" android:exported="true"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter>
                      <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                  </receiver>
              </application>
          </manifest>
          EOF_FILE

      - name: "Datei app/src/main/res/drawable/ic_bg.xml"
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
