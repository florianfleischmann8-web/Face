# Halo – komplett selbstenthaltend: diese eine Datei erzeugt den gesamten Code und baut die App.
# Ablegen unter .github/workflows/build.yml in einem leeren GitHub-Repo, pushen, fertig.
name: build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get install -y librsvg2-bin
      - name: Code erzeugen
        run: |
          mkdir -p client server assets www
          cat > client/index.html <<'HALO_EOF'
          <!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>Halo</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='5' fill='%237c5cff'/></svg>">
          <style>
          :root{--g:rgba(255,255,255,.09);--b:rgba(255,255,255,.22);--t:#f5f4ff;--m:#a9a6c9;--a:#19d3c5;--p:#7c5cff;--r:#ff4d6d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;background:#0b0a1a;color:var(--t);overflow:hidden}
          .bg i{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;animation:f 16s ease-in-out infinite alternate}
          .bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--p);top:-20vmax;left:-15vmax}
          .bg i:nth-child(2){width:50vmax;height:50vmax;background:var(--a);bottom:-20vmax;right:-15vmax;animation-delay:-8s}
          @keyframes f{to{transform:translate(8vmax,6vmax) scale(1.15)}}
          .s{position:fixed;inset:0;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));opacity:0;visibility:hidden;transform:scale(.96) translateY(12px);transition:.5s cubic-bezier(.2,.8,.2,1)}
          .s.on{opacity:1;visibility:visible;transform:none}
          .card{width:min(420px,100%);padding:28px;border-radius:32px;background:var(--g);border:1px solid var(--b);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:0 30px 80px #0006,inset 0 1px 0 #fff3;display:grid;gap:14px}
          .logo{width:76px;height:76px;border-radius:22px;margin:0 auto;box-shadow:0 10px 40px #7c5cff88}
          h1{text-align:center;font-size:30px;font-weight:700;letter-spacing:-.02em}
          p.m{text-align:center;color:var(--m);font-size:14px;min-height:18px}
          input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--b);background:#ffffff12;color:var(--t);font-size:17px;outline:0;transition:.25s}
          input:focus{border-color:var(--a);background:#ffffff1c;box-shadow:0 0 0 4px #19d3c522}
          button{padding:16px;border-radius:18px;border:1px solid var(--b);background:var(--g);color:var(--t);font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s,background .3s;backdrop-filter:blur(10px)}
          button:hover{background:#ffffff22}button:active{transform:scale(.96)}
          .pri{background:linear-gradient(135deg,var(--p),var(--a));border:0}
          .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .num{text-align:center;font-size:44px;font-weight:300;letter-spacing:.06em;font-variant-numeric:tabular-nums}
          #call{padding:0;background:#000}#rv{width:100%;height:100%;object-fit:cover;background:#000}
          #lv{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));width:28vw;max-width:180px;aspect-ratio:3/4;object-fit:cover;border-radius:22px;border:1px solid var(--b);box-shadow:0 10px 40px #0008;transform:scaleX(-1)}
          .bar{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:14px;padding:12px;border-radius:40px;background:var(--g);border:1px solid var(--b);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
          .bar button{width:62px;height:62px;border-radius:50%;padding:0;font-size:24px}
          .end{background:var(--r)!important;border:0!important}
          #st{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;padding:8px 14px;border-radius:20px;background:var(--g);border:1px solid var(--b);backdrop-filter:blur(20px);font-size:13px;font-variant-numeric:tabular-nums}
          #ring{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));width:min(380px,92vw);transform:translate(-50%,-160%);transition:.55s cubic-bezier(.2,1.2,.3,1);z-index:9}
          #ring.on{transform:translate(-50%,0)}#ring .card{padding:18px;gap:12px}
          .pulse{animation:pu 1.4s infinite}@keyframes pu{50%{box-shadow:0 0 0 14px #19d3c500,0 30px 80px #19d3c566}}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style></head><body>
          <div class="bg"><i></i><i></i></div>

          <section class="s on" id="auth"><div class="card">
          <svg class="logo" viewBox="0 0 1024 1024"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#19d3c5"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g)"/><circle cx="512" cy="512" r="300" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-opacity=".6" stroke-width="10"/><path d="M430 400v224l190-112z" fill="#fff"/></svg>
          <h1>Halo</h1><p class="m" id="msg">Anrufen in 4K, ohne Verzögerung.</p>
          <input id="srv" placeholder="Server-URL (https://…/api.php)" hidden>
          <input id="nm" placeholder="Benutzername" autocomplete="username">
          <button class="pri" id="pk">Mit Passkey anmelden</button>
          <button id="pkr">Neuen Account mit Passkey erstellen</button>
          <input id="pw" type="password" placeholder="Passwort (ohne Passkey)" autocomplete="current-password">
          <div class="row"><button id="li">Anmelden</button><button id="rg">Registrieren</button></div>
          </div></section>

          <section class="s" id="home"><div class="card">
          <p class="m">Deine Nummer</p><div class="num" id="my"></div>
          <input id="to" inputmode="numeric" placeholder="Nummer anrufen" style="text-align:center;font-size:22px">
          <div class="row"><button id="ca">📞 Anruf</button><button class="pri" id="cv">🎥 Video 4K</button></div>
          <button id="lo">Abmelden</button>
          </div></section>

          <section class="s" id="call"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div id="st">Verbinde…</div>
          <div class="bar"><button id="mu">🎙️</button><button id="cm">📷</button><button class="end" id="hu">✕</button></div></section>

          <div id="ring"><div class="card pulse"><h1 id="rn" style="font-size:22px"></h1><div class="row"><button class="end" id="no">Ablehnen</button><button class="pri" id="ok">Annehmen</button></div></div></div>

          <script>
          const $=i=>document.getElementById(i),app=!!window.Capacitor;
          let API=localStorage.srv||'api.php',S=JSON.parse(localStorage.sess||'null'),pc,ls,peer,offer,pend=[],tm,t0;
          if(app){$('srv').hidden=false;$('srv').value=localStorage.srv||''}
          const show=i=>document.querySelectorAll('.s').forEach(s=>s.classList.toggle('on',s.id===i));
          const b2u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
          const u2b=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
          async function api(a,d={}){const r=await fetch(API+'?a='+a,{method:'POST',body:JSON.stringify({token:S&&S.token,...d})});const j=await r.json();if(j.error)throw j.error;return j}
          const note=t=>$('msg').textContent=t;
          function login(s){S=s;localStorage.sess=JSON.stringify(s);$('my').textContent=s.number;show('home');poll()}
          function srv(){if(app){localStorage.srv=API=$('srv').value.trim()}}
          const guard=f=>async()=>{try{srv();await f()}catch(e){note(e.message||e)}};

          $('pkr').onclick=guard(async()=>{const n=$('nm').value.trim();if(!n)throw'Benutzername fehlt';
           const o=await api('reg_opts');
           const c=await navigator.credentials.create({publicKey:{challenge:u2b(o.challenge),rp:{name:'Halo',id:o.rp},user:{id:new TextEncoder().encode(n),name:n,displayName:n},
            pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{residentKey:'required',userVerification:'required'}}});
           login(await api('reg',{cid:o.cid,name:n,id:c.id,cdj:b2u(c.response.clientDataJSON),spki:b2u(c.response.getPublicKey())}))});
          $('pk').onclick=guard(async()=>{const o=await api('login_opts');
           const c=await navigator.credentials.get({publicKey:{challenge:u2b(o.challenge),rpId:o.rp,userVerification:'required'}});
           login(await api('login',{cid:o.cid,id:c.id,cdj:b2u(c.response.clientDataJSON),ad:b2u(c.response.authenticatorData),sig:b2u(c.response.signature)}))});
          $('li').onclick=guard(async()=>login(await api('pw_login',{name:$('nm').value,pw:$('pw').value})));
          $('rg').onclick=guard(async()=>login(await api('pw_reg',{name:$('nm').value,pw:$('pw').value})));
          $('lo').onclick=()=>{localStorage.removeItem('sess');S=null;show('auth')};
          if(!window.PublicKeyCredential||app)note('Kein Passkey verfügbar? Nutze Benutzername + Passwort.');

          // ---- Anrufe ----
          const cfg={iceServers:[{urls:'stun:stun.l.google.com:19302'}],bundlePolicy:'max-bundle'};
          const send=(to,type,data)=>api('send',{to,type,data}).catch(()=>{});
          async function media(video){
           const c=video?{width:{ideal:3840},height:{ideal:2160},frameRate:{ideal:120,min:30}}:false;
           try{ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:c})}
           catch{ls=await navigator.mediaDevices.getUserMedia({audio:true,video})}
           $('lv').srcObject=ls;$('lv').style.display=video?'':'none';$('cm').style.display=video?'':'none'}
          function mk(){pc=new RTCPeerConnection(cfg);
           ls.getTracks().forEach(t=>{if(t.kind==='video')t.contentHint='motion';pc.addTrack(t,ls)});
           pc.ontrack=e=>{$('rv').srcObject=e.streams[0];e.receiver.jitterBufferTarget=0;e.receiver.playoutDelayHint=0};
           pc.onicecandidate=e=>e.candidate&&send(peer,'ice',e.candidate);
           pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected'){t0=Date.now();tm=setInterval(stat,1000)}if(['failed','closed'].includes(pc.connectionState))end()};
           pc.getTransceivers().forEach(t=>{if(t.sender.track?.kind!=='video')return;const c=RTCRtpSender.getCapabilities('video').codecs;
            const pr=['video/AV1','video/H264','video/VP9','video/VP8'];c.sort((a,b)=>pr.indexOf(a.mimeType)-pr.indexOf(b.mimeType));try{t.setCodecPreferences(c)}catch{}})}
          async function tune(){for(const s of pc.getSenders()){if(s.track?.kind!=='video')continue;const p=s.getParameters();p.encodings=p.encodings?.length?p.encodings:[{}];
           Object.assign(p.encodings[0],{maxBitrate:35e6,maxFramerate:120,priority:'high',networkPriority:'high'});p.degradationPreference='maintain-framerate';try{await s.setParameters(p)}catch{}}}
          async function stat(){let t='';(await pc.getStats()).forEach(r=>{if(r.type==='inbound-rtp'&&r.kind==='video')t=r.frameWidth+'×'+r.frameHeight+' @ '+Math.round(r.framesPerSecond||0)+' fps'});$('st').textContent=t||'Verbunden'}
          async function call(video){const to=$('to').value.trim();if(!to)return;peer=to;await media(video);show('call');mk();
           const o=await pc.createOffer();await pc.setLocalDescription(o);await tune();send(to,'offer',{sdp:o,video})}
          async function accept(){$('ring').classList.remove('on');await media(offer.data.video);show('call');mk();
           await pc.setRemoteDescription(offer.data.sdp);pend.forEach(c=>pc.addIceCandidate(c));pend=[];
           const a=await pc.createAnswer();await pc.setLocalDescription(a);await tune();send(peer,'answer',a)}
          function end(local){if(peer&&local)send(peer,'hangup');clearInterval(tm);pc&&pc.close();pc=0;ls&&ls.getTracks().forEach(t=>t.stop());ls=0;peer=0;offer=0;pend=[];$('ring').classList.remove('on');$('rv').srcObject=null;if(S)show('home')}
          $('ca').onclick=()=>call(false);$('cv').onclick=()=>call(true);$('hu').onclick=()=>end(true);
          $('ok').onclick=accept;$('no').onclick=()=>{send(peer,'hangup');end()};
          $('mu').onclick=()=>{const t=ls.getAudioTracks()[0];t.enabled=!t.enabled;$('mu').style.opacity=t.enabled?1:.4};
          $('cm').onclick=()=>{const t=ls.getVideoTracks()[0];t.enabled=!t.enabled;$('cm').style.opacity=t.enabled?1:.4};

          async function poll(){while(S){try{for(const m of await api('poll')){
           if(m.type==='offer'){if(pc||offer){send(m.from,'hangup');continue}peer=m.from;offer=m;$('rn').textContent=m.name+' ('+m.from+') ruft an';$('ring').classList.add('on')}
           else if(m.type==='answer'&&pc){await pc.setRemoteDescription(m.data)}
           else if(m.type==='ice'){pc&&pc.remoteDescription?pc.addIceCandidate(m.data):pend.push(m.data)}
           else if(m.type==='hangup')end()}}catch(e){if(e==='Nicht angemeldet'){$('lo').click();return}}
           await new Promise(r=>setTimeout(r,pc?250:700))}}
          if(S)login(S);
          </script></body></html>
          HALO_EOF
          cat > server/api.php <<'HALO_EOF'
          <?php
          // Halo – Signaling + Auth (Passkey/WebAuthn, Fallback Passwort). Alles in JSON-Dateien.
          header('Access-Control-Allow-Origin: *'); header('Access-Control-Allow-Headers: *'); header('Content-Type: application/json');
          if ($_SERVER['REQUEST_METHOD']==='OPTIONS') exit;
          $D=__DIR__.'/data'; @mkdir($D,0700);
          function ld($f){global $D;$p="$D/$f.json";return is_file($p)?(json_decode(file_get_contents($p),true)?:[]):[];}
          function sv($f,$d){global $D;file_put_contents("$D/$f.json",json_encode($d),LOCK_EX);}
          function out($d){echo json_encode($d);exit;}
          function err($m){http_response_code(400);out(['error'=>$m]);}
          function b64u($s){return rtrim(strtr(base64_encode($s),'+/','-_'),'=');}
          function unb($s){return base64_decode(strtr($s,'-_','+/'));}
          $in=json_decode(file_get_contents('php://input'),true)?:[]; $a=$_GET['a']??'';
          $rp=preg_replace('/:\d+$/','',$_SERVER['HTTP_HOST']??'localhost');
          function newUser($name,$extra){
            $u=ld('users'); foreach($u as $x) if(strcasecmp($x['name'],$name)==0) err('Name vergeben');
            do{$n=(string)random_int(1000000,9999999);}while(isset($u[$n]));
            $u[$n]=['name'=>$name,'number'=>$n]+$extra; sv('users',$u); return $n;}
          function session($n){$t=b64u(random_bytes(24));$s=ld('tokens');$s[$t]=$n;sv('tokens',$s);return ['token'=>$t,'number'=>$n];}
          function chal(){$c=ld('chal');$id=b64u(random_bytes(8));$ch=b64u(random_bytes(32));
            $c=array_filter($c,fn($x)=>$x['t']>time()-300);$c[$id]=['c'=>$ch,'t'=>time()];sv('chal',$c);return [$id,$ch];}
          function chk($cid,$cdj,$type){$c=ld('chal');if(!isset($c[$cid]))err('Challenge');
            $j=json_decode(unb($cdj),true);if(($j['type']??'')!==$type||($j['challenge']??'')!==$c[$cid]['c'])err('Ungültig');
            unset($c[$cid]);sv('chal',$c);}
          function me(){global $in;$s=ld('tokens');$t=$in['token']??'';if(!isset($s[$t]))err('Nicht angemeldet');return $s[$t];}

          switch($a){
          case 'reg_opts': [$id,$ch]=chal(); out(['cid'=>$id,'challenge'=>$ch,'rp'=>$rp]);
          case 'reg':
            chk($in['cid'],$in['cdj'],'webauthn.create');
            $pem="-----BEGIN PUBLIC KEY-----\n".chunk_split(base64_encode(unb($in['spki'])),64)."-----END PUBLIC KEY-----\n";
            $n=newUser(trim($in['name']),['passkeys'=>[['id'=>$in['id'],'pem'=>$pem]]]); out(session($n));
          case 'login_opts': [$id,$ch]=chal(); out(['cid'=>$id,'challenge'=>$ch,'rp'=>$rp]);
          case 'login':
            chk($in['cid'],$in['cdj'],'webauthn.get'); $ad=unb($in['ad']);
            if(substr($ad,0,32)!==hash('sha256',$rp,true)) err('RP');
            if(!(ord($ad[32])&1)) err('Keine Nutzerprüfung');
            $msg=$ad.hash('sha256',unb($in['cdj']),true);
            foreach(ld('users') as $u) foreach($u['passkeys']??[] as $k) if($k['id']===$in['id'])
              if(openssl_verify($msg,unb($in['sig']),$k['pem'],OPENSSL_ALGO_SHA256)===1) out(session($u['number']));
            err('Passkey unbekannt');
          case 'pw_reg':
            if(strlen($in['pw']??'')<6||!trim($in['name']??'')) err('Name + Passwort (min. 6)');
            out(session(newUser(trim($in['name']),['hash'=>password_hash($in['pw'],PASSWORD_DEFAULT)])));
          case 'pw_login':
            foreach(ld('users') as $u) if(strcasecmp($u['name'],$in['name']??'')==0&&isset($u['hash'])&&password_verify($in['pw']??'',$u['hash'])) out(session($u['number']));
            err('Falsche Daten');
          case 'send':
            $m=me(); $to=$in['to']; $us=ld('users'); if(!isset($us[$to])) err('Nummer unbekannt');
            $q=ld('sig'); $q[$to][]=['from'=>$m,'name'=>$us[$m]['name'],'type'=>$in['type'],'data'=>$in['data']??null]; sv('sig',$q); out(['ok'=>1]);
          case 'poll':
            $m=me(); $q=ld('sig'); $r=$q[$m]??[]; if($r){unset($q[$m]);sv('sig',$q);} out($r);
          default: err('?');
          }
          HALO_EOF
          cat > assets/logo.svg <<'HALO_EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#19d3c5"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient></defs><rect width="1024" height="1024" fill="url(#g)"/><circle cx="512" cy="512" r="300" fill="url(#s)" stroke="#fff" stroke-opacity=".6" stroke-width="10"/><path d="M430 400v224l190-112z" fill="#fff"/></svg>
          HALO_EOF
          cat > package.json <<'HALO_EOF'
          {"name":"halo-call","version":"1.0.0","dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}
          HALO_EOF
          cat > capacitor.config.json <<'HALO_EOF'
          {"appId":"app.halo.call","appName":"Halo","webDir":"www","server":{"androidScheme":"https","cleartext":true}}
          HALO_EOF
          cp client/index.html server/index.html
          mkdir -p server/data && echo 'Require all denied' > server/data/.htaccess

      - run: npm install
      - run: cp client/index.html www/
      - run: rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/icon-only.png
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Kamera/Mikro-Rechte
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' $M
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: halo-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        with: { name: halo-web-php, path: server }
