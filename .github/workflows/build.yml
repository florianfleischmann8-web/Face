      # ------------------------------------------------------------------
      - name: Kotlin - Datenhaltung, Widget, Hintergrund-Sync
        run: |
          cat > app/src/main/java/com/stride/app/Store.kt <<'EOF'
          package com.stride.app

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import java.io.File
          import java.time.LocalDate
          import kotlin.math.*

          data class Day(val date: String, val total: Int, val fake: Int, val run: Int) {
              val real: Int get() = max(0, total - fake)
              val walk: Int get() = max(0, real - run)
              val km: Double get() = (walk * 0.72 + run * 1.05) / 1000.0
              val kcal: Int get() = (walk * 0.72 * 0.045 + run * 1.05 * 0.07).roundToInt()
          }

          object Store {
              private fun sp(c: Context): SharedPreferences =
                  c.applicationContext.getSharedPreferences("stride", Context.MODE_PRIVATE)

              private fun key(d: String, k: String) = "d_${d}_$k"
              fun todayKey(): String = LocalDate.now().toString()

              /** Hardware-Schrittzaehler (laeuft im Sensor-Chip, auch wenn die App nicht laeuft) */
              @Synchronized
              fun sync(c: Context, counter: Float) {
                  val s = sp(c)
                  val last = s.getLong("last_counter", -1L)
                  val cur = counter.toLong()
                  val delta = if (last < 0) 0L else if (cur >= last) cur - last else cur // cur < last => Neustart
                  val e = s.edit().putLong("last_counter", cur)
                  if (delta > 0) {
                      val k = key(todayKey(), "total")
                      e.putInt(k, s.getInt(k, 0) + delta.toInt())
                  }
                  e.apply()
              }

              @Synchronized fun addFake(c: Context) = inc(c, "fake")
              @Synchronized fun addRun(c: Context) = inc(c, "run")

              private fun inc(c: Context, k: String) {
                  val s = sp(c)
                  val kk = key(todayKey(), k)
                  s.edit().putInt(kk, s.getInt(kk, 0) + 1).apply()
              }

              fun day(c: Context, d: String): Day {
                  val s = sp(c)
                  return Day(d, s.getInt(key(d, "total"), 0), s.getInt(key(d, "fake"), 0), s.getInt(key(d, "run"), 0))
              }

              fun today(c: Context): Day = day(c, todayKey())
              fun goal(c: Context): Int = sp(c).getInt("goal", 10000)
              fun setGoal(c: Context, g: Int) = sp(c).edit().putInt("goal", g.coerceIn(1000, 50000)).apply()
              fun tracking(c: Context): Boolean = sp(c).getBoolean("tracking", false)
              fun setTracking(c: Context, on: Boolean) = sp(c).edit().putBoolean("tracking", on).apply()
          }

          data class Pt(val lat: Double, val lon: Double, val t: Long, val seg: Int, val run: Boolean)
          data class RouteStats(val distM: Double, val timeS: Double, val avgKmh: Double)

          /** Lauftour der letzten Stunde. Nur aktive Abschnitte, alles Aeltere wird geloescht. */
          object Route {
              private const val HOUR = 3_600_000L
              private fun file(c: Context) = File(c.applicationContext.filesDir, "route.json")

              @Synchronized
              fun load(c: Context): List<Pt> {
                  val f = file(c)
                  if (!f.exists()) return emptyList()
                  return try {
                      val a = JSONArray(f.readText())
                      val cutoff = System.currentTimeMillis() - HOUR
                      val all = (0 until a.length()).map {
                          val o = a.getJSONArray(it)
                          Pt(o.getDouble(0), o.getDouble(1), o.getLong(2), o.getInt(3), o.getInt(4) == 1)
                      }
                      val keep = all.filter { it.t >= cutoff }
                      if (keep.size != all.size) save(c, keep)
                      keep
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              @Synchronized
              fun save(c: Context, pts: List<Pt>) {
                  val a = JSONArray()
                  pts.forEach { a.put(JSONArray().put(it.lat).put(it.lon).put(it.t).put(it.seg).put(if (it.run) 1 else 0)) }
                  file(c).writeText(a.toString())
              }

              @Synchronized
              fun add(c: Context, p: Pt) {
                  val cutoff = System.currentTimeMillis() - HOUR
                  save(c, (load(c) + p).filter { it.t >= cutoff })
              }

              /** Zu kurze Abschnitte (kein echtes Laufen) werden verworfen. */
              @Synchronized
              fun dropShortSegment(c: Context, seg: Int) {
                  val l = load(c)
                  if (l.count { it.seg == seg } < 3) save(c, l.filter { it.seg != seg })
              }

              @Synchronized fun clear(c: Context) { file(c).delete() }

              fun dist(a: Pt, b: Pt): Double {
                  val r = 6371000.0
                  val p1 = Math.toRadians(a.lat)
                  val p2 = Math.toRadians(b.lat)
                  val dp = p2 - p1
                  val dl = Math.toRadians(b.lon - a.lon)
                  val h = sin(dp / 2).pow(2) + cos(p1) * cos(p2) * sin(dl / 2).pow(2)
                  return 2 * r * asin(min(1.0, sqrt(h)))
              }

              fun stats(p: List<Pt>): RouteStats {
                  var d = 0.0
                  var t = 0.0
                  for (i in 1 until p.size) {
                      val a = p[i - 1]
                      val b = p[i]
                      if (a.seg != b.seg) continue
                      val dt = (b.t - a.t) / 1000.0
                      if (dt < 0.5 || dt > 30) continue
                      val dd = dist(a, b)
                      if (dd / dt > 8.0) continue
                      d += dd
                      t += dt
                  }
                  return RouteStats(d, t, if (t > 0) d / t * 3.6 else 0.0)
              }
          }
          EOF

          cat > app/src/main/java/com/stride/app/Background.kt <<'EOF'
          package com.stride.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withTimeoutOrNull
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          /** Liest EINMAL den Hardware-Zaehler (zaehlt im Sensor-Chip, die App muss dafuer nicht laufen). */
          object Counter {
              suspend fun read(c: Context): Float? = withTimeoutOrNull(6000L) {
                  suspendCancellableCoroutine<Float?> { cont ->
                      val sm = c.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                      val sensor = sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)
                      if (sensor == null) {
                          cont.resume(null)
                      } else {
                          val l = object : SensorEventListener {
                              override fun onSensorChanged(e: SensorEvent) {
                                  sm.unregisterListener(this)
                                  if (cont.isActive) cont.resume(e.values[0])
                              }
                              override fun onAccuracyChanged(x: Sensor?, a: Int) {}
                          }
                          sm.registerListener(l, sensor, SensorManager.SENSOR_DELAY_NORMAL)
                          cont.invokeOnCancellation { sm.unregisterListener(l) }
                      }
                  }
              }
          }

          class SyncWorker(c: Context, p: WorkerParameters) : CoroutineWorker(c, p) {
              override suspend fun doWork(): Result {
                  val v = Counter.read(applicationContext)
                  if (v != null) Store.sync(applicationContext, v)
                  StepWidget.updateAll(applicationContext)
                  return Result.success()
              }
          }

          object Scheduler {
              fun schedule(c: Context) {
                  val req = PeriodicWorkRequestBuilder<SyncWorker>(15, TimeUnit.MINUTES).build()
                  WorkManager.getInstance(c.applicationContext)
                      .enqueueUniquePeriodicWork("stride_sync", ExistingPeriodicWorkPolicy.KEEP, req)
              }

              fun now(c: Context) {
                  WorkManager.getInstance(c.applicationContext).enqueue(OneTimeWorkRequestBuilder<SyncWorker>().build())
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  Scheduler.schedule(c)
                  Scheduler.now(c)
              }
          }
          EOF

          cat > app/src/main/java/com/stride/app/StepWidget.kt <<'EOF'
          package com.stride.app

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import java.util.Locale
          import kotlin.math.max
          import kotlin.math.min

          class StepWidget : AppWidgetProvider() {

              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) {
                  ids.forEach { render(c, m, it) }
                  Scheduler.now(c)
              }

              override fun onEnabled(c: Context) {
                  Scheduler.schedule(c)
              }

              companion object {
                  fun updateAll(c: Context) {
                      val m = AppWidgetManager.getInstance(c)
                      m.getAppWidgetIds(ComponentName(c, StepWidget::class.java)).forEach { render(c, m, it) }
                  }

                  fun render(c: Context, m: AppWidgetManager, id: Int) {
                      val d = Store.today(c)
                      val goal = max(1, Store.goal(c))
                      val pct = min(100, d.real * 100 / goal)
                      val v = RemoteViews(c.packageName, R.layout.widget_steps)
                      v.setTextViewText(R.id.w_steps, String.format(Locale.GERMAN, "%,d", d.real))
                      v.setProgressBar(R.id.w_bar, 100, pct, false)
                      v.setTextViewText(R.id.w_km, String.format(Locale.GERMAN, "%.2f km", d.km))
                      v.setTextViewText(R.id.w_kcal, "${d.kcal} kcal")
                      v.setTextViewText(R.id.w_pct, "$pct %")
                      val pi = PendingIntent.getActivity(
                          c, 0, Intent(c, MainActivity::class.java),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      v.setOnClickPendingIntent(R.id.w_root, pi)
                      m.updateAppWidget(id, v)
                  }
              }
          }
          EOF

      # ------------------------------------------------------------------
      - name: Kotlin - Erkennung (Fake/Echt, Gehen/Rennen) und Live-Service
        run: |
          cat > app/src/main/java/com/stride/app/Engine.kt <<'EOF'
          package com.stride.app

          import android.os.SystemClock
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** Live-Zustand, den die UI beobachtet. */
          object Live {
              var mode by mutableStateOf("idle")        // idle | walk | run
              var cadence by mutableIntStateOf(0)       // Schritte pro Minute
              var running by mutableStateOf(false)
              var fakeFlash by mutableLongStateOf(0L)
              var gps by mutableStateOf(false)
          }

          /**
           * Prueft jeden Hardware-Schritt gegen den Beschleunigungssensor:
           *  - zu wenig Bewegung        -> Fake (App/Emulator/Tippen auf dem Tisch)
           *  - unmenschlich schnell     -> Fake
           *  - unregelmaessiger Rhythmus-> Fake (Schuetteln)
           *  - extreme Amplitude        -> Fake (heftiges Schuetteln)
           * Danach Unterscheidung Gehen / Laufen ueber Kadenz + Aufprallstaerke.
           */
          class Detector(private val onReal: (Boolean) -> Unit, private val onFake: () -> Unit) {
              private class S(val t: Long, val m: Float)

              private val buf = ArrayDeque<S>()
              private val steps = ArrayDeque<Long>()

              var lastRealAt = 0L
                  private set

              fun onAccel(t: Long, x: Float, y: Float, z: Float) {
                  buf.addLast(S(t, sqrt(x * x + y * y + z * z)))
                  while (buf.isNotEmpty() && t - buf.first().t > 1200) buf.removeFirst()
              }

              fun onStep(t: Long) {
                  var mn = Float.MAX_VALUE
                  var mx = 0f
                  var n = 0
                  for (s in buf) {
                      val dt0 = t - s.t
                      if (dt0 >= 0 && dt0 <= 700) {
                          mn = min(mn, s.m)
                          mx = max(mx, s.m)
                          n++
                      }
                  }
                  val amp = if (n >= 3) mx - mn else 0f
                  var ok = amp >= 1.6f && amp <= 38f

                  if (steps.isNotEmpty() && t - steps.last() > 2500) steps.clear()
                  if (ok && steps.isNotEmpty()) {
                      val dt = t - steps.last()
                      if (dt < 230) {
                          ok = false
                      } else if (steps.size >= 5) {
                          val iv = (steps.toList().takeLast(6) + t).zipWithNext { a, b -> (b - a).toFloat() }
                          val mean = iv.average().toFloat()
                          val sd = sqrt(iv.map { (it - mean) * (it - mean) }.average()).toFloat()
                          if (sd > mean * 0.55f) ok = false
                      }
                  }

                  if (!ok) {
                      onFake()
                      return
                  }

                  steps.addLast(t)
                  while (steps.size > 12) steps.removeFirst()
                  lastRealAt = SystemClock.elapsedRealtime()

                  var run = false
                  if (steps.size >= 4) {
                      val last = steps.toList().takeLast(6)
                      val mean = (last.last() - last.first()).toFloat() / (last.size - 1)
                      val cad = 1000f / max(mean, 1f)
                      Live.cadence = (cad * 60).roundToInt()
                      run = cad >= 2.5f || (cad >= 2.2f && amp > 20f)
                  }
                  onReal(run)
              }
          }
