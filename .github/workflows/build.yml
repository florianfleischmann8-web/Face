name: Build PhoneLink APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/phonelink app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/assets
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PhoneLink"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.phonelink"
              compileSdk = 34
              defaultConfig { applicationId = "com.phonelink"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="desc">Erlaubt PhoneLink, dein Handy von deinem iPad aus zu bedienen (tippen, wischen, Tasten, Text).</string></resources>
          EOF
          cat > app/src/main/res/xml/accessibility.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/desc"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF
          cat > app/src/main/res/drawable/ic_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108">
                          <item android:offset="0" android:color="#0D1B24" />
                          <item android:offset="1" android:color="#1E3A8A" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M36,33h14a5,5 0 0 1 5,5v32a5,5 0 0 1 -5,5h-14a5,5 0 0 1 -5,-5v-32a5,5 0 0 1 5,-5z"
                  android:strokeColor="#FFFFFF" android:strokeWidth="3.6" android:fillColor="#00000000" />
              <path android:pathData="M43,54m-3,0a3,3 0 1 0 6,0a3,3 0 1 0 -6,0" android:fillColor="#FFFFFF" />
              <path android:pathData="M66.36,47.64A9,9 0 0 1 66.36,60.36" android:strokeColor="#FFB84D" android:strokeWidth="4.4" android:strokeLineCap="round" />
              <path android:pathData="M72.02,41.98A17,17 0 0 1 72.02,66.02" android:strokeColor="#5CE1C6" android:strokeWidth="4.4" android:strokeLineCap="round" />
              <path android:pathData="M77.68,36.32A25,25 0 0 1 77.68,71.68" android:strokeColor="#7AA2FF" android:strokeWidth="4.4" android:strokeLineCap="round" />
