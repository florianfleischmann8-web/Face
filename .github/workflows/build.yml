          // ---------------------------------------------------------------- Farben & Paletten
          val Ink = Color(0xFF080A12)
          val Mint = Color(0xFF30D158)
          val Sky = Color(0xFF64D2FF)
          val Azure = Color(0xFF0A84FF)
          val Grape = Color(0xFFBF5AF2)
          val Amber = Color(0xFFFF9F0A)
          val Rose = Color(0xFFFF375F)

          data class Pal(
              val dark: Boolean, val bg: Color, val fg: Color, val accent: Color,
              val gTop: Color, val gBot: Color, val bTop: Color, val bBot: Color,
              val bar: Color, val blob: Float
          )

          val DarkPal = Pal(
              true, Ink, Color.White, Sky,
              Color.White.copy(alpha = .16f), Color.White.copy(alpha = .05f),
              Color.White.copy(alpha = .38f), Color.White.copy(alpha = .06f),
              Color(0xCC0B0E17), .48f
          )
          val LightPal = Pal(
              false, Color(0xFFEFF2F9), Color(0xFF0B0E17), Azure,
              Color.White.copy(alpha = .82f), Color.White.copy(alpha = .52f),
              Color.White, Color.Black.copy(alpha = .07f),
              Color(0xE6FFFFFF), .30f
          )

          val LocalPal = staticCompositionLocalOf { DarkPal }
          val LocalHaptics = staticCompositionLocalOf { true }

          /** Akzentfarben im Light-Mode etwas abdunkeln (Kontrast auf hellem Glas). */
          @Composable
          fun tone(c: Color): Color = if (LocalPal.current.dark) c else lerp(c, Color.Black, .3f)

          fun Int.fmt(): String = String.format(Locale.GERMAN, "%,d", this)
          fun Double.f1(): String = String.format(Locale.GERMAN, "%.1f", this)
          fun Double.f2(): String = String.format(Locale.GERMAN, "%.2f", this)

          fun toast(c: Context, s: String) = Toast.makeText(c, s, Toast.LENGTH_SHORT).show()

          object UiState {
              var foreground by mutableStateOf(true)
          }

          // ---------------------------------------------------------------- Activity
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  Scheduler.schedule(this)
                  setContent { App() }
              }

              override fun onResume() {
                  super.onResume()
                  UiState.foreground = true
                  StepWidget.updateAll(this)
              }

              override fun onPause() {
                  UiState.foreground = false
                  super.onPause()
              }
          }

          // ---------------------------------------------------------------- Berechtigungen
          data class Perms(val act: Boolean, val loc: Boolean, val notif: Boolean)

          fun permState(c: Context): Perms {
              fun g(p: String) = ContextCompat.checkSelfPermission(c, p) == PackageManager.PERMISSION_GRANTED
              return Perms(
                  if (Build.VERSION.SDK_INT >= 29) g(Manifest.permission.ACTIVITY_RECOGNITION) else true,
                  g(Manifest.permission.ACCESS_FINE_LOCATION),
                  if (Build.VERSION.SDK_INT >= 33) g(Manifest.permission.POST_NOTIFICATIONS) else true
              )
          }

          fun needed(): Array<String> {
              val l = mutableListOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION)
              if (Build.VERSION.SDK_INT >= 29) l.add(Manifest.permission.ACTIVITY_RECOGNITION)
              if (Build.VERSION.SDK_INT >= 33) l.add(Manifest.permission.POST_NOTIFICATIONS)
              return l.toTypedArray()
          }

          // ---------------------------------------------------------------- Root
          @Composable
          fun App() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var tab by remember { mutableIntStateOf(0) }
              var st by remember { mutableStateOf(Store.settings(ctx)) }
              var d by remember { mutableStateOf(Store.today(ctx)) }
              var route by remember { mutableStateOf<List<Pt>>(emptyList()) }
              var perms by remember { mutableStateOf(permState(ctx)) }
              var saver by remember { mutableStateOf(false) }

              val change: (Settings) -> Unit = { n ->
                  Store.saveSettings(ctx, n)
                  st = Store.settings(ctx)
                  d = Store.today(ctx)
              }

              // ----- Launcher
              val launcher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  perms = permState(ctx)
              }
              val hcLauncher = rememberLauncherForActivityResult(PermissionController.createRequestPermissionResultContract()) { granted ->
                  if (granted.containsAll(HealthSync.permissions)) {
                      change(st.copy(hc = true))
                      scope.launch {
                          withContext(Dispatchers.IO) { HealthSync.push(ctx) }
                          toast(ctx, "Health Connect verbunden")
                      }
                  } else {
                      toast(ctx, "Health Connect: Zugriff nicht erteilt")
                  }
              }
              val gpxLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/gpx+xml")) { uri ->
                  if (uri != null) scope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              ctx.contentResolver.openOutputStream(uri)?.use { it.write(Export.gpx(Route.load(ctx)).toByteArray()) }
                              true
                          } catch (e: Exception) {
                              false
                          }
                      }
                      toast(ctx, if (ok) "Route gespeichert" else "Export fehlgeschlagen")
                  }
              }
              val csvLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("text/csv")) { uri ->
                  if (uri != null) scope.launch {
                      val ok = withContext(Dispatchers.IO) {
                          try {
                              ctx.contentResolver.openOutputStream(uri)?.use { it.write(Export.csv(ctx).toByteArray()) }
                              true
                          } catch (e: Exception) {
                              false
                          }
                      }
                      toast(ctx, if (ok) "Verlauf gespeichert" else "Export fehlgeschlagen")
                  }
              }

              LaunchedEffect(Unit) {
                  if (!perms.act) launcher.launch(needed())
              }

              // ----- Tick: UI-Daten aktualisieren (pausiert, solange die App im Hintergrund ist)
              LaunchedEffect(Unit) {
                  var n = 0
                  while (true) {
                      if (UiState.foreground) {
                          d = Store.today(ctx)
                          route = withContext(Dispatchers.IO) { Route.load(ctx) }
                          perms = permState(ctx)
                          val ns = Store.settings(ctx)
                          if (ns != st) st = ns
                          saver = (ctx.getSystemService(Context.POWER_SERVICE) as PowerManager).isPowerSaveMode
                          if (Store.goalJustReached(ctx)) Haptics.success(ctx)
                          if (n++ % 20 == 0) StepWidget.updateAll(ctx)
                          delay(1000)
                      } else {
                          delay(3000)
                      }
                  }
              }

              // ----- Hardware-Zaehler nur mitlesen, solange die App sichtbar ist
              DisposableEffect(perms.act, UiState.foreground) {
                  val sm = ctx.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)
                  val l = object : SensorEventListener {
                      override fun onSensorChanged(e: SensorEvent) {
                          Store.sync(ctx, e.values[0])
                          d = Store.today(ctx)
                      }
                      override fun onAccuracyChanged(x: Sensor?, a: Int) {}
                  }
                  if (sensor != null && perms.act && UiState.foreground) sm.registerListener(l, sensor, SensorManager.SENSOR_DELAY_UI)
                  onDispose { sm.unregisterListener(l) }
              }

              // ----- Live-Service nach App-/Prozess-Neustart wiederherstellen
              LaunchedEffect(perms.act, perms.loc) {
                  if (Store.tracking(ctx) && perms.act && perms.loc && !Live.running) {
                      try {
                          ContextCompat.startForegroundService(ctx, Intent(ctx, TrackingService::class.java))
                      } catch (e: Exception) {
                      }
                  }
              }

              val onToggle: (Boolean) -> Unit = { on ->
                  if (on && !(perms.act && perms.loc)) {
                      launcher.launch(needed())
                  } else {
                      Store.setTracking(ctx, on)
                      val i = Intent(ctx, TrackingService::class.java)
                      if (on) {
                          try {
                              ContextCompat.startForegroundService(ctx, i)
                          } catch (e: Exception) {
                          }
                      } else {
                          ctx.stopService(i)
                      }
                  }
              }

              val onHc: (Boolean) -> Unit = { on ->
                  if (!on) {
                      change(st.copy(hc = false))
                  } else if (!HealthSync.available(ctx)) {
                      toast(ctx, "Health Connect ist auf diesem Gerät nicht verfügbar")
                  } else {
                      hcLauncher.launch(HealthSync.permissions)
                  }
              }

              val onRestore: () -> Unit = {
                  scope.launch {
                      val n = withContext(Dispatchers.IO) { HealthSync.restore(ctx) }
                      toast(ctx, if (n < 0) "Health Connect: kein Zugriff" else "$n Tage wiederhergestellt")
                  }
              }

              val onGpx: () -> Unit = {
                  if (route.size < 2) toast(ctx, "Keine Route vorhanden") else gpxLauncher.launch("stride-route.gpx")
              }
              val onCsv: () -> Unit = { csvLauncher.launch("stride-verlauf.csv") }

              val hist = remember(d) {
                  (6 downTo 0).map { Store.day(ctx, LocalDate.now().minusDays(it.toLong()).toString()) }
              }

              // ----- Theme
              val sysDark = isSystemInDarkTheme()
              val dark = when (st.theme) {
                  1 -> false
                  2 -> true
                  else -> sysDark
              }
              val pal = if (dark) DarkPal else LightPal
              val activity = ctx as? ComponentActivity
              LaunchedEffect(dark) {
                  val transparent = android.graphics.Color.TRANSPARENT
                  activity?.enableEdgeToEdge(
                      statusBarStyle = if (dark) SystemBarStyle.dark(transparent) else SystemBarStyle.light(transparent, transparent),
                      navigationBarStyle = if (dark) SystemBarStyle.dark(transparent) else SystemBarStyle.light(transparent, transparent)
                  )
              }
              val animateBg = !st.reduce && UiState.foreground && !saver

              MaterialTheme(
                  colorScheme = if (dark) darkColorScheme(primary = Sky, background = pal.bg, surface = pal.bg)
                  else lightColorScheme(primary = Azure, background = pal.bg, surface = pal.bg)
              ) {
                  CompositionLocalProvider(LocalPal provides pal, LocalHaptics provides st.haptics) {
                      Surface(Modifier.fillMaxSize(), color = Color.Transparent, contentColor = pal.fg) {
                          Box(Modifier.fillMaxSize()) {
                              Aurora(Modifier.fillMaxSize(), animateBg)
                              AnimatedContent(
                                  targetState = tab,
                                  modifier = Modifier.fillMaxSize(),
                                  transitionSpec = {
                                      val dir = if (targetState > initialState) 1 else -1
                                      (fadeIn(tween(380, delayMillis = 60)) +
                                          slideInHorizontally(tween(420, easing = FastOutSlowInEasing)) { it / 7 * dir }) togetherWith
                                          (fadeOut(tween(200)) +
                                              slideOutHorizontally(tween(420, easing = FastOutSlowInEasing)) { -it / 7 * dir })
                                  },
                                  label = "tabs"
                              ) { t ->
                                  when (t) {
                                      0 -> Home(d, st.goal, route, Live.running, onToggle)
                                      1 -> RouteScreen(route)
                                      2 -> History(hist, st.goal)
                                      else -> SettingsScreen(st, perms, change, { launcher.launch(needed()) }, onHc, onRestore, onGpx, onCsv)
                                  }
                              }
                              TabBar(tab, { tab = it }, Modifier.align(Alignment.BottomCenter).navigationBarsPadding())
                          }
                      }
                  }
              }
          }

          // ---------------------------------------------------------------- Bausteine
          private fun DrawScope.drawAurora(p: Float, bg: Color, a: Float) {
              drawRect(bg)
              val w = size.width
              val h = size.height
              fun blob(cx: Float, cy: Float, r: Float, c: Color) {
                  drawCircle(
                      brush = Brush.radialGradient(listOf(c.copy(alpha = a), Color.Transparent), center = Offset(cx, cy), radius = r),
                      radius = r, center = Offset(cx, cy)
                  )
              }
              blob(w * (.2f + .15f * sin(p)), h * (.14f + .08f * cos(p)), w * .95f, Azure)
              blob(w * (.85f + .10f * cos(p)), h * (.46f + .10f * sin(p)), w * .8f, Grape)
              blob(w * (.30f + .20f * sin(p + 2f)), h * (.88f + .06f * cos(p + 1f)), w * .95f, Mint)
          }

          /** animate=false => statisch (kein Frame-Loop, spart CPU/Akku). Der Phasenwert wird nur beim Zeichnen gelesen. */
          @Composable
          fun Aurora(modifier: Modifier = Modifier, animate: Boolean = true) {
              val pal = LocalPal.current
              if (animate) {
                  val t = rememberInfiniteTransition(label = "aurora")
                  val p by t.animateFloat(
                      0f, (2 * PI).toFloat(),
                      infiniteRepeatable(tween(40000, easing = LinearEasing)), label = "p"
                  )
                  Canvas(modifier) { drawAurora(p, pal.bg, pal.blob) }
              } else {
                  Canvas(modifier) { drawAurora(0.9f, pal.bg, pal.blob) }
              }
          }

          @Composable
          fun Modifier.glass(r: Dp = 28.dp, base: Color = Color.Transparent): Modifier {
              val p = LocalPal.current
              val s = RoundedCornerShape(r)
              return this
                  .clip(s)
                  .background(base)
                  .background(Brush.verticalGradient(listOf(p.gTop, p.gBot)))
                  .border(1.dp, Brush.verticalGradient(listOf(p.bTop, p.bBot)), s)
          }

          @Composable
          fun Modifier.bounceClick(onClick: () -> Unit): Modifier {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val s by animateFloatAsState(if (pressed) .93f else 1f, spring(dampingRatio = .5f, stiffness = 500f), label = "press")
              val hf = LocalHapticFeedback.current
              val hapt = LocalHaptics.current
              return this.scale(s).clickable(interactionSource = src, indication = null) {
                  if (hapt) hf.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                  onClick()
              }
          }

          @Composable
          fun Txt(
              t: String, size: Int, w: FontWeight = FontWeight.Normal, a: Float = 1f,
              color: Color = Color.Unspecified, spacing: Float = 0f, modifier: Modifier = Modifier, align: TextAlign? = null
          ) {
              val c = if (color == Color.Unspecified) LocalPal.current.fg else color
              Text(
                  t, modifier, color = c.copy(alpha = a), fontSize = size.sp, fontWeight = w,
                  letterSpacing = spacing.sp, textAlign = align
              )
          }

          @Composable
          fun Appear(i: Int, content: @Composable () -> Unit) {
              var show by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) {
                  delay(i * 70L)
                  show = true
              }
              AnimatedVisibility(
                  visible = show,
                  enter = fadeIn(tween(550)) + slideInVertically(tween(550, easing = FastOutSlowInEasing)) { it / 6 }
              ) { content() }
          }

