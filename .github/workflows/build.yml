name: Build Hausi APK

# Diese Datei nach .github/workflows/build.yml in dein GitHub-Repo legen.
# Sie erzeugt das komplette Android-Projekt selbst und baut die APK.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/hausi/helper

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Hausi"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.hausi.helper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hausi.helper"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Hausi"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hausi/helper/MainActivity.java <<'EOF'
          package com.hausi.helper;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.LinkedHashSet;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {

              // =====================================================
              //  WORTSCHATZ: Hier trägst du deutsche Wörter ein.
              //  add("Fach", "wort1 wort2 wort3 ...");
              //  Einfach beliebig viele Zeilen ergänzen!
              // =====================================================
              static final Map<String, String> LEX = new HashMap<>();
              static final Map<String, String> TASK = new HashMap<>();

              static void add(String fach, String woerter) {
                  for (String w : woerter.trim().split("\\s+")) {
                      LEX.put(w.toLowerCase(Locale.GERMAN), fach);
                  }
              }

              static void task(String anweisung, String verben) {
                  for (String w : verben.trim().split("\\s+")) {
                      TASK.put(w.toLowerCase(Locale.GERMAN), anweisung);
                  }
              }

              static {
                  add("Mathe", "Addition Subtraktion Multiplikation Division Summe Differenz Produkt Quotient "
                          + "Gleichung Ungleichung Variable Term Bruch Zähler Nenner Dezimalzahl Prozent Zinsen "
                          + "Dreisatz Wurzel Potenz Quadrat Kubik Primzahl Teiler Vielfaches Dreieck Viereck Rechteck "
                          + "Kreis Kugel Zylinder Kegel Pyramide Würfel Fläche Umfang Volumen Radius Durchmesser "
                          + "Winkel Gerade Parabel Funktion Steigung Achsenabschnitt Nullstelle Ableitung Integral "
                          + "Wahrscheinlichkeit Mittelwert Median Diagramm Koordinatensystem Satz Pythagoras Hypotenuse "
                          + "Kathete plus minus mal geteilt gleich Zahl Ziffer Rechnung Ergebnis Lösung");

                  add("Deutsch", "Nomen Substantiv Verb Adjektiv Adverb Artikel Pronomen Präposition Konjunktion "
                          + "Satz Hauptsatz Nebensatz Subjekt Prädikat Objekt Akkusativ Dativ Genitiv Nominativ "
                          + "Präsens Präteritum Perfekt Plusquamperfekt Futur Gedicht Strophe Vers Reim Metapher "
                          + "Vergleich Erzählung Märchen Fabel Roman Novelle Autor Erzähler Inhaltsangabe Erörterung "
                          + "Charakterisierung Interpretation Textanalyse Aufsatz Brief Bericht Rechtschreibung "
                          + "Grammatik Komma Wortart Satzglied Text Absatz Einleitung Hauptteil Schluss Argument");

                  add("Englisch", "Englisch Vokabeln Übersetzung übersetzen Present Past Simple Continuous "
                          + "Conditional Passiv Vokabel Aussprache");

                  add("Geschichte", "Mittelalter Antike Steinzeit Römer Griechen Ägypter Pharao Pyramide Kaiser König "
                          + "Krieg Weltkrieg Revolution Reformation Luther Napoleon Demokratie Diktatur Republik "
                          + "Kolonialismus Industrialisierung Nationalsozialismus Hitler Holocaust Mauerfall "
                          + "Wiedervereinigung Kalter Jahrhundert Jahrhunderte Epoche Ritter Burg Kreuzzüge Pest "
                          + "Französische Kaiserreich Weimarer Bismarck Ursache Folge Quelle");

                  add("Biologie", "Zelle Zellkern Organismus Pflanze Tier Mensch Photosynthese Chlorophyll Atmung "
                          + "Blut Herz Lunge Niere Leber Gehirn Nerven Skelett Muskel Haut Verdauung Vererbung Gen "
                          + "Chromosom Evolution Ökosystem Nahrungskette Nahrungsnetz Säugetier Reptil Amphibie "
                          + "Insekt Vogel Fisch Bakterien Viren Immunsystem Hormon Fortpflanzung Wirbeltier Wald "
                          + "Biotop Art Lebewesen Stoffwechsel Enzym");

                  add("Physik", "Kraft Masse Gewicht Geschwindigkeit Beschleunigung Energie Arbeit Leistung Druck "
                          + "Temperatur Wärme Licht Schall Strom Spannung Widerstand Ohm Stromkreis Magnet Elektron "
                          + "Atom Schwerkraft Gravitation Reibung Hebel Newton Joule Watt Volt Ampere Welle Frequenz "
                          + "Reflexion Brechung Linse Spiegel Optik Mechanik Dichte Auftrieb");

                  add("Chemie", "Element Verbindung Molekül Atom Periodensystem Säure Base Lauge Salz Reaktion "
                          + "Oxidation Reduktion Metall Nichtmetall Wasserstoff Sauerstoff Kohlenstoff Stickstoff "
                          + "Natrium Chlor Eisen Gold Kupfer Ion Bindung Gemisch Lösung Destillation Filtration "
                          + "Indikator pH Katalysator Brennstoff Verbrennung Formel Gleichung Stoff");

                  add("Erdkunde", "Kontinent Land Staat Hauptstadt Gebirge Fluss Meer Ozean See Insel Wüste "
                          + "Regenwald Klima Wetter Vulkan Erdbeben Plattentektonik Landwirtschaft Industrie "
                          + "Bevölkerung Einwohner Karte Maßstab Himalaya Alpen Rhein Donau Europa Asien Afrika "
                          + "Amerika Australien Antarktis Gletscher Tourismus Rohstoffe Globalisierung");

                  // ---- Aufgaben-Wörter (Operatoren): was soll gemacht werden? ----
                  task("Rechne Schritt für Schritt und nenne das Ergebnis klar.",
                          "berechne berechnen rechne rechnen ausrechnen löse lösen bestimme bestimmen ermittle ermitteln");
                  task("Erkläre es verständlich und mit einem Beispiel.",
                          "erkläre erklären erläutere erläutern begründe begründen warum wieso weshalb");
                  task("Beschreibe es sachlich und vollständig.",
                          "beschreibe beschreiben schildere schildern nenne nennen");
                  task("Fasse den Inhalt kurz in eigenen Worten zusammen.",
                          "fasse zusammenfassen zusammenfassung zusammen");
                  task("Übersetze den Text korrekt und natürlich.",
                          "übersetze übersetzen übersetzung");
                  task("Analysiere genau und belege mit Argumenten.",
                          "analysiere analysieren untersuche untersuchen interpretiere interpretieren vergleiche vergleichen");
                  task("Schreibe einen gut strukturierten Text mit Einleitung, Hauptteil und Schluss.",
                          "schreibe schreiben verfasse verfassen erörtere erörtern aufsatz");
                  task("Korrigiere die Fehler und erkläre kurz die Regel dahinter.",
                          "korrigiere korrigieren verbessere verbessern fehler");
                  task("Zeichne oder beschreibe die Skizze in Worten und beschrifte sie.",
                          "zeichne zeichnen skizziere skizzieren");
              }

              static final String[] SUFFIXE = {"en", "er", "es", "em", "e", "n", "s", "t", "st"};

              /** Sucht ein Wort im Wortschatz, auch mit einfachen Endungen (Haus / Häuser-Näherung). */
              static String lookup(Map<String, String> map, String key) {
                  String r = map.get(key);
                  if (r != null) return r;
                  for (String suf : SUFFIXE) {
                      if (key.endsWith(suf) && key.length() - suf.length() >= 3) {
                          String stamm = key.substring(0, key.length() - suf.length());
                          r = map.get(stamm);
                          if (r == null) r = map.get(stamm + "e");
                          if (r == null) r = map.get(stamm + "en");
                          if (r != null) return r;
                      }
                  }
                  return null;
              }

              // ----------------- Mini-Taschenrechner (offline) -----------------
              static class Parser {
                  final String s;
                  int i = 0;

                  Parser(String s) { this.s = s.replace(" ", ""); }

                  double parse() {
                      double v = expr();
                      if (i < s.length()) throw new RuntimeException("Rest");
                      return v;
                  }

                  double expr() {
                      double v = term();
                      while (i < s.length()) {
                          char c = s.charAt(i);
                          if (c == '+') { i++; v += term(); }
                          else if (c == '-') { i++; v -= term(); }
                          else break;
                      }
                      return v;
                  }

                  double term() {
                      double v = pow();
                      while (i < s.length()) {
                          char c = s.charAt(i);
                          if (c == '*') { i++; v *= pow(); }
                          else if (c == '/') { i++; v /= pow(); }
                          else break;
                      }
                      return v;
                  }

                  double pow() {
                      double b = unary();
                      if (i < s.length() && s.charAt(i) == '^') { i++; return Math.pow(b, pow()); }
                      return b;
                  }

                  double unary() {
                      if (i < s.length() && s.charAt(i) == '-') { i++; return -unary(); }
                      return atom();
                  }

                  double atom() {
                      if (i < s.length() && s.charAt(i) == '(') {
                          i++;
                          double v = expr();
                          if (i >= s.length() || s.charAt(i) != ')') throw new RuntimeException("Klammer");
                          i++;
                          return v;
                      }
                      int st = i;
                      while (i < s.length() && (Character.isDigit(s.charAt(i)) || s.charAt(i) == '.')) i++;
                      if (st == i) throw new RuntimeException("Zahl");
                      return Double.parseDouble(s.substring(st, i));
                  }
              }

              static String versucheRechnen(String text) {
                  String t = text.trim();
                  while (t.endsWith("=") || t.endsWith("?")) t = t.substring(0, t.length() - 1).trim();
                  if (t.isEmpty() || !t.matches("[0-9+\\-*/().,:xX×÷^ ]+")) return null;
                  if (!t.matches(".*[+\\-*/:xX×÷^].*")) return null;
                  t = t.replace(',', '.').replace('x', '*').replace('X', '*')
                          .replace('×', '*').replace(':', '/').replace('÷', '/');
                  try {
                      double v = new Parser(t).parse();
                      if (Double.isNaN(v) || Double.isInfinite(v)) return "Nicht definiert (Division durch 0?)";
                      if (v == Math.rint(v) && Math.abs(v) < 1e15) return String.valueOf((long) v);
                      return String.valueOf(Math.round(v * 1e8) / 1e8);
                  } catch (Exception e) {
                      return null;
                  }
              }

              // ----------------- Oberfläche -----------------
              EditText urlIn, modelIn, taskIn;
              TextView analysisOut, answerOut;
              Button goBtn;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              EditText field(String hint, String value) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setSingleLine(true);
                  return e;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  ScrollView sv = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(40), dp(16), dp(24));
                  sv.addView(root);

                  TextView title = new TextView(this);
                  title.setText("Hausi – Hausaufgabenhelfer");
                  title.setTextSize(22);
                  root.addView(title);

                  urlIn = field("Ollama-Adresse", "http://127.0.0.1:11434");
                  modelIn = field("Modell", "llama3.2:1b");
                  root.addView(urlIn);
                  root.addView(modelIn);

                  taskIn = new EditText(this);
                  taskIn.setHint("Aufgabe hier eintippen …");
                  taskIn.setMinLines(5);
                  taskIn.setGravity(Gravity.TOP);
                  root.addView(taskIn);

                  goBtn = new Button(this);
                  goBtn.setText("Lösen");
                  goBtn.setOnClickListener(v -> loesen());
                  root.addView(goBtn);

                  analysisOut = new TextView(this);
                  analysisOut.setTextSize(13);
                  analysisOut.setPadding(0, dp(12), 0, dp(8));
                  analysisOut.setTextIsSelectable(true);
                  root.addView(analysisOut);

                  answerOut = new TextView(this);
                  answerOut.setTextSize(16);
                  answerOut.setTextIsSelectable(true);
                  root.addView(answerOut);

                  setContentView(sv);
              }

              // ----------------- Wort-Erkennung -----------------
              void loesen() {
                  final String text = taskIn.getText().toString().trim();
                  if (text.isEmpty()) {
                      answerOut.setText("Bitte erst eine Aufgabe eingeben.");
                      return;
                  }

                  Map<String, Integer> punkte = new HashMap<>();
                  LinkedHashSet<String> bekannt = new LinkedHashSet<>();
                  LinkedHashSet<String> unbekannt = new LinkedHashSet<>();
                  String hinweis = null;

                  for (String t : text.split("[^\\p{L}\\p{N}ß]+")) {
                      if (t.isEmpty() || t.matches("\\d+")) continue;
                      String key = t.toLowerCase(Locale.GERMAN);
                      String fach = lookup(LEX, key);
                      String aufgabe = lookup(TASK, key);
                      if (fach != null) {
                          bekannt.add(t);
                          Integer alt = punkte.get(fach);
                          punkte.put(fach, alt == null ? 1 : alt + 1);
                      }
                      if (aufgabe != null) {
                          bekannt.add(t);
                          if (hinweis == null) hinweis = aufgabe;
                      }
                      if (fach == null && aufgabe == null) unbekannt.add(t);
                  }
                  if (text.matches(".*\\d.*[+\\-*/^=].*")) {
                      Integer alt = punkte.get("Mathe");
                      punkte.put("Mathe", alt == null ? 1 : alt + 1);
                  }

                  String fach = "Allgemein";
                  int max = 0;
                  for (Map.Entry<String, Integer> e : punkte.entrySet()) {
                      if (e.getValue() > max) { max = e.getValue(); fach = e.getKey(); }
                  }
                  if (hinweis == null) hinweis = "Beantworte die Aufgabe verständlich und Schritt für Schritt.";

                  analysisOut.setText("Fach erkannt: " + fach
                          + "\nErkannte Wörter: " + (bekannt.isEmpty() ? "–" : String.join(", ", bekannt))
                          + "\nUnbekannte Wörter: " + (unbekannt.isEmpty() ? "–" : String.join(", ", unbekannt)));

                  // Reine Rechenaufgabe? Dann sofort offline lösen.
                  String lokal = versucheRechnen(text);
                  if (lokal != null) {
                      answerOut.setText("Ergebnis (offline berechnet): " + lokal);
                      return;
                  }

                  final String prompt = "Du bist ein freundlicher Hausaufgabenhelfer für Schüler.\n"
                          + "Fach: " + fach + "\n"
                          + "Anweisung: " + hinweis + "\n"
                          + (bekannt.isEmpty() ? "" : "Wichtige Schlüsselwörter: " + String.join(", ", bekannt) + "\n")
                          + "Antworte immer auf Deutsch, klar und nicht zu lang.\n\n"
                          + "Aufgabe:\n" + text;

                  final String basis = urlIn.getText().toString().trim().replaceAll("/+$", "");
                  final String modell = modelIn.getText().toString().trim();

                  goBtn.setEnabled(false);
                  answerOut.setText("Ollama denkt nach …");

                  new Thread(() -> {
                      String ergebnis;
                      try {
                          ergebnis = frageOllama(basis, modell, prompt);
                      } catch (Exception e) {
                          ergebnis = "Verbindung zu Ollama fehlgeschlagen.\n\n"
                                  + "Prüfe in Termux:\n"
                                  + "1) ollama serve  (muss laufen)\n"
                                  + "2) ollama pull " + modell + "\n"
                                  + "3) Adresse hier: http://127.0.0.1:11434\n\n"
                                  + "Fehler: " + e.getMessage();
                      }
                      final String fertig = ergebnis;
                      runOnUiThread(() -> {
                          answerOut.setText(fertig);
                          goBtn.setEnabled(true);
                      });
                  }).start();
              }

              // ----------------- Ollama-Verbindung -----------------
              static String frageOllama(String basis, String modell, String prompt) throws Exception {
                  JSONObject body = new JSONObject();
                  body.put("model", modell);
                  body.put("prompt", prompt);
                  body.put("stream", false);

                  HttpURLConnection c = (HttpURLConnection) new URL(basis + "/api/generate").openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(300000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  try (OutputStream os = c.getOutputStream()) {
                      os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                  }

                  int code = c.getResponseCode();
                  InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                  }
                  if (code >= 400) throw new Exception("HTTP " + code + ": " + sb);
                  return new JSONObject(sb.toString()).optString("response", "(keine Antwort)").trim();
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Hausi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
