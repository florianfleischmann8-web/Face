              int dp(float v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              /** Glas-Hintergrund: leichter Farbverlauf + heller Rand wie bei Liquid Glass. */
              GradientDrawable glass(int c1, int c2, float tl, float tr, float br, float bl, int stroke) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{c1, c2});
                  g.setCornerRadii(new float[]{dp(tl), dp(tl), dp(tr), dp(tr), dp(br), dp(br), dp(bl), dp(bl)});
                  g.setStroke(dp(1), stroke);
                  return g;
              }

              View blob(int color, int gravity, int mx, int my) {
                  View v = new View(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setGradientType(GradientDrawable.RADIAL_GRADIENT);
                  g.setGradientRadius(dp(170));
                  g.setColors(new int[]{color, color & 0x00FFFFFF});
                  v.setBackground(g);
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(dp(340), dp(340), gravity);
                  lp.setMargins(dp(mx), dp(my), dp(mx), dp(my));
                  v.setLayoutParams(lp);
                  return v;
              }

              TextView pill(String text, float size) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(dp(14), dp(8), dp(14), dp(8));
                  t.setBackground(glass(0x44FFFFFF, 0x1AFFFFFF, 20, 20, 20, 20, 0x66FFFFFF));
                  return t;
              }

              @Override
