              EditText settingField(String hint, String value) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setSingleLine(true);
                  e.setTextColor(Color.WHITE);
                  e.setHintTextColor(0x99FFFFFF);
                  e.setTextSize(15);
                  return e;
              }

              void willkommen() {
                  addBubble("Hallo! 👋 Ich bin Hausi. Schreib mir deine Aufgabe – ich erkenne das Fach und "
                          + "löse sie mit Ollama. Rechenaufgaben wie (3+4)*2 rechne ich sofort offline.", 0);
              }

              void scrollDown() {
                  scroll.post(() -> scroll.fullScroll(View.FOCUS_DOWN));
              }

              /** kind: 0 = Hausi, 1 = ich, 2 = Analyse-Chip */
              TextView addBubble(String text, int kind) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(kind == 2 ? 0xD9FFFFFF : Color.WHITE);
                  tv.setTextSize(kind == 2 ? 12 : 16);
                  tv.setLineSpacing(0, 1.12f);
                  tv.setTextIsSelectable(true);
                  tv.setMaxWidth((int) (getResources().getDisplayMetrics().widthPixels * 0.82f));
                  tv.setPadding(dp(15), dp(10), dp(15), dp(10));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(4), 0, dp(4));

                  if (kind == 1) {
                      tv.setBackground(glass(0xAA6AA8FF, 0x777B5CFF, 22, 22, 6, 22, 0x99FFFFFF));
                      lp.gravity = Gravity.END;
                  } else if (kind == 2) {
                      tv.setBackground(glass(0x28FFFFFF, 0x0DFFFFFF, 14, 14, 14, 14, 0x44FFFFFF));
                      lp.gravity = Gravity.END;
                  } else {
                      tv.setBackground(glass(0x48FFFFFF, 0x18FFFFFF, 22, 22, 22, 6, 0x77FFFFFF));
                      lp.gravity = Gravity.START;
                  }
                  chat.addView(tv, lp);

                  tv.setAlpha(0f);
                  tv.setTranslationY(dp(14));
                  tv.animate().alpha(1f).translationY(0f).setDuration(260).start();
                  scrollDown();
                  return tv;
              }

              JSONObject msg(String role, String content) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("role", role);
                      o.put("content", content);
                  } catch (Exception ignored) {
                  }
                  return o;
              }

              // ----------------- Senden -----------------
              void senden() {
                  if (busy) return;
                  final String text = input.getText().toString().trim();
                  if (text.isEmpty()) return;
                  input.setText("");

                  addBubble(text, 1);
                  final Analyse a = analysiere(text);
                  addBubble(a.bericht(), 2);

                  // Reine Rechenaufgabe? Dann sofort offline lösen.
                  String lokal = versucheRechnen(text);
                  if (lokal != null) {
                      addBubble("= " + lokal + "\n(offline berechnet)", 0);
                      return;
                  }

                  final String basis = urlIn.getText().toString().trim().replaceAll("/+$", "");
                  final String modell = modelIn.getText().toString().trim();
                  prefs.edit().putString("url", basis).putString("model", modell).apply();

                  final String angereichert = "Fach: " + a.fach + "\n"
                          + "Anweisung: " + a.hinweis + "\n"
                          + (a.bekannt.isEmpty() ? "" : "Wichtige Schlüsselwörter: " + join(a.bekannt, 12) + "\n")
                          + "\nAufgabe:\n" + text;
                  history.put(msg("user", angereichert));

                  final JSONArray nachrichten = new JSONArray();
                  nachrichten.put(msg("system", "Du bist Hausi, ein freundlicher Hausaufgabenhelfer für Schüler. "
                          + "Antworte immer auf Deutsch, klar, Schritt für Schritt und nicht zu lang."));
                  int start = Math.max(0, history.length() - 12);
                  for (int i = start; i < history.length(); i++) nachrichten.put(history.optJSONObject(i));

                  busy = true;
                  sendBtn.setAlpha(0.5f);
                  final TextView tippt = addBubble("Hausi denkt nach …", 0);
                  final ObjectAnimator puls = ObjectAnimator.ofFloat(tippt, "alpha", 1f, 0.35f);
                  puls.setDuration(700);
                  puls.setRepeatCount(ValueAnimator.INFINITE);
                  puls.setRepeatMode(ValueAnimator.REVERSE);
                  puls.setStartDelay(300);
                  puls.start();

                  new Thread(() -> {
                      String antwort;
                      boolean ok = true;
                      try {
                          antwort = frageOllama(basis, modell, nachrichten);
                      } catch (Exception e) {
                          ok = false;
                          antwort = "Verbindung zu Ollama fehlgeschlagen.\n\n"
                                  + "Prüfe in Termux:\n"
                                  + "1) ollama serve  (muss laufen)\n"
                                  + "2) ollama pull " + modell + "\n"
                                  + "3) Adresse: http://127.0.0.1:11434\n\n"
                                  + "Fehler: " + e.getMessage();
                      }
                      final String fertig = antwort;
                      final boolean erfolg = ok;
                      runOnUiThread(() -> {
                          puls.cancel();
                          tippt.setAlpha(1f);
                          tippt.setText(fertig);
                          if (erfolg) {
                              history.put(msg("assistant", fertig));
                          } else if (history.length() > 0) {
                              history.remove(history.length() - 1);
                          }
                          busy = false;
                          sendBtn.setAlpha(1f);
                          scrollDown();
                      });
                  }).start();
              }

              // ----------------- Ollama-Verbindung -----------------
              static String frageOllama(String basis, String modell, JSONArray nachrichten) throws Exception {
                  JSONObject body = new JSONObject();
                  body.put("model", modell);
                  body.put("messages", nachrichten);
                  body.put("stream", false);

                  HttpURLConnection c = (HttpURLConnection) new URL(basis + "/api/chat").openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(300000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  try (OutputStream os = c.getOutputStream()) {
                      os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                  }

                  int code = c.getResponseCode();
                  InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  StringBuilder sb = new StringBuilder();
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line);
                  }
                  if (code >= 400) throw new Exception("HTTP " + code + ": " + sb);
                  JSONObject antwort = new JSONObject(sb.toString());
                  return antwort.getJSONObject("message").optString("content", "(keine Antwort)").trim();
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Hausi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
