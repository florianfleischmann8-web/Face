                      <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108"
                          android:startColor="#0E1424" android:endColor="#05060D"/>
                  </aapt:attr>
              </path>
              <path android:pathData="M-4,34 a34,34 0 1,0 68,0 a34,34 0 1,0 -68,0 z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="radial" android:centerX="30" android:centerY="34" android:gradientRadius="36"
                          android:startColor="#88B6FF00" android:endColor="#00B6FF00"/>
                  </aapt:attr>
              </path>
              <path android:pathData="M42,80 a40,40 0 1,0 80,0 a40,40 0 1,0 -80,0 z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="radial" android:centerX="82" android:centerY="80" android:gradientRadius="42"
                          android:startColor="#776A5CFF" android:endColor="#006A5CFF"/>
                  </aapt:attr>
              </path>
          </vector>
          EOF_FILE

      - name: "Datei app/src/main/res/drawable/ic_fg.xml"
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF_FILE'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M54,24 L80,39 L80,69 L54,84 L28,69 L28,39 Z" android:strokeWidth="1.6">
                  <aapt:attr name="android:fillColor">
                      <gradient android:type="linear" android:startX="28" android:startY="24" android:endX="80" android:endY="84"
                          android:startColor="#44FFFFFF" android:endColor="#0DFFFFFF"/>
                  </aapt:attr>
                  <aapt:attr name="android:strokeColor">
                      <gradient android:type="linear" android:startX="28" android:startY="24" android:endX="80" android:endY="84"
                          android:startColor="#CCFFFFFF" android:endColor="#55B6FF00"/>
                  </aapt:attr>
              </path>
              <path android:pathData="M33,41 L54,29 L70,38" android:strokeColor="#88FFFFFF" android:strokeWidth="1.2"
                  android:strokeLineCap="round" android:fillColor="#00000000"/>
              <path android:pathData="M59,34 L44,57 L53,57 L49,76 L66,50 L56,50 Z">
                  <aapt:attr name="android:fillColor">
