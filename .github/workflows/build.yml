          @Composable
          fun SettingsScreen(
              st: Settings, perms: Perms, change: (Settings) -> Unit, onAsk: () -> Unit,
              onHc: (Boolean) -> Unit, onRestore: () -> Unit, onGpx: () -> Unit, onCsv: () -> Unit
          ) {
              val ctx = LocalContext.current
              val stepLen = st.height * 0.415 / 100.0
              Screen {
                  Appear(0) { Title("Mehr", "Darstellung, Profil, Sicherung & Export") }
                  Appear(1) {
                      Section("Darstellung") {
                          Segmented(listOf("Auto", "Hell", "Dunkel"), st.theme) { change(st.copy(theme = it)) }
                          SwitchRow("Animationen reduzieren", "Statischer Hintergrund – spart Akku", st.reduce) { change(st.copy(reduce = it)) }
                          SwitchRow("Haptisches Feedback", "Vibration bei Ziel, Tippen & Fake-Schritten", st.haptics) { change(st.copy(haptics = it)) }
                      }
                  }
                  Appear(2) {
                      Section("Ziel & Körper") {
                          StepperRow("Tagesziel", st.goal.fmt(), { change(st.copy(goal = st.goal - 500)) }, { change(st.copy(goal = st.goal + 500)) })
                          StepperRow("Körpergröße", "${st.height} cm", { change(st.copy(height = st.height - 1)) }, { change(st.copy(height = st.height + 1)) })
                          StepperRow("Gewicht", "${st.weight} kg", { change(st.copy(weight = st.weight - 1)) }, { change(st.copy(weight = st.weight + 1)) })
                          Txt(
                              "Schrittlänge Gehen ${stepLen.f2()} m · Laufen ${(st.height * 0.60 / 100.0).f2()} m. " +
                                  "Daraus werden Distanz und Kalorien berechnet.",
                              12, FontWeight.Normal, .5f
                          )
                      }
                  }
                  Appear(3) {
                      Section("Sicherung") {
                          SwitchRow("Health Connect", "Schritte systemweit sichern & synchronisieren", st.hc, onHc)
                          if (st.hc) {
                              Spacer(Modifier.height(4.dp))
                              GlassButton("Aus Health Connect wiederherstellen") { onRestore() }
                          }
                      }
                  }
                  Appear(4) {
                      Section("Export") {
                          Spacer(Modifier.height(4.dp))
                          GlassButton("Route als GPX speichern") { onGpx() }
                          Spacer(Modifier.height(10.dp))
                          GlassButton("Verlauf als CSV speichern") { onCsv() }
                      }
                  }
                  Appear(5) {
                      Section("Berechtigungen") {
                          PermRow("Aktivitätserkennung (Schritte)", perms.act)
                          PermRow("Standort (Route)", perms.loc)
                          PermRow("Benachrichtigungen", perms.notif)
                      }
                  }
                  Appear(6) { GlassButton("Berechtigungen anfragen") { onAsk() } }
                  Appear(7) {
                      GlassButton("App-Einstellungen öffnen") {
                          try {
                              ctx.startActivity(
                                  Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${ctx.packageName}"))
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          } catch (e: Exception) {
                          }
                      }
                  }
                  Appear(8) {
                      GlassButton("Akku-Optimierung anpassen") {
                          try {
                              ctx.startActivity(
                                  Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          } catch (e: Exception) {
                          }
                      }
                  }
                  Appear(9) { GlassButton("Route jetzt löschen") { Route.clear(ctx) } }
                  Appear(10) {
                      Txt(
                          "Stride zählt über den Schrittzähler-Chip deines Handys – dafür muss die App nicht laufen. " +
                              "Das Widget aktualisiert sich automatisch ca. alle 15 Minuten (nicht bei sehr niedrigem Akku) und beim Öffnen der App.",
                          12, FontWeight.Normal, .45f, modifier = Modifier.padding(horizontal = 6.dp)
                      )
                  }
              }
          }

