      # ------------------------------------------------------------------
      - name: Kotlin - Daten, Widget, Hintergrund-Sync, Health Connect, Export
        run: |
          cat > app/src/main/java/com/stride/app/Store.kt <<'EOF'
          package com.stride.app

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import java.io.File
          import java.time.LocalDate
          import java.util.concurrent.Executors
          import kotlin.math.*

          data class Settings(
              val goal: Int = 10000,
              val height: Int = 175,
              val weight: Int = 70,
              val reduce: Boolean = false,
              val haptics: Boolean = true,
              val theme: Int = 0, // 0 Auto, 1 Hell, 2 Dunkel
              val hc: Boolean = false
          )

          data class Day(
              val date: String, val total: Int, val fake: Int, val run: Int,
              val heightCm: Int = 175, val weightKg: Int = 70
          ) {
              val real: Int get() = max(0, total - fake)
              val walk: Int get() = max(0, real - run)
              // Schrittlaenge: Gehen = Groesse * 0,415 ; Laufen = Groesse * 0,60
              val walkKm: Double get() = walk * heightCm * 0.415 / 100000.0
              val runKm: Double get() = run * heightCm * 0.60 / 100000.0
              val km: Double get() = walkKm + runKm
              val kcal: Int get() = (walkKm * weightKg * 0.64 + runKm * weightKg * 1.0).roundToInt()
          }

          object Store {
              private fun sp(c: Context): SharedPreferences =
                  c.applicationContext.getSharedPreferences("stride", Context.MODE_PRIVATE)

              private fun key(d: String, k: String) = "d_${d}_$k"
              fun todayKey(): String = LocalDate.now().toString()

              /** Hardware-Schrittzaehler (laeuft im Sensor-Chip, auch wenn die App nicht laeuft) */
              @Synchronized
              fun sync(c: Context, counter: Float) {
                  val s = sp(c)
                  val last = s.getLong("last_counter", -1L)
                  val cur = counter.toLong()
                  val delta = if (last < 0) 0L else if (cur >= last) cur - last else cur // cur < last => Neustart
                  val e = s.edit().putLong("last_counter", cur)
                  if (delta > 0) {
                      val k = key(todayKey(), "total")
                      e.putInt(k, s.getInt(k, 0) + delta.toInt())
                  }
                  e.apply()
              }

              @Synchronized fun addFake(c: Context) = inc(c, "fake")
              @Synchronized fun addRun(c: Context) = inc(c, "run")

              private fun inc(c: Context, k: String) {
                  val s = sp(c)
                  val kk = key(todayKey(), k)
                  s.edit().putInt(kk, s.getInt(kk, 0) + 1).apply()
              }

              fun day(c: Context, d: String): Day {
                  val s = sp(c)
                  return Day(
                      d, s.getInt(key(d, "total"), 0), s.getInt(key(d, "fake"), 0), s.getInt(key(d, "run"), 0),
                      s.getInt("height", 175), s.getInt("weight", 70)
                  )
              }

              fun today(c: Context): Day = day(c, todayKey())

              /** Fuellt einen Tag aus einer Sicherung (nur wenn der Wert groesser ist). */
              @Synchronized
              fun fillDay(c: Context, d: String, total: Int): Boolean {
                  val s = sp(c)
                  val k = key(d, "total")
                  if (total > s.getInt(k, 0)) {
                      s.edit().putInt(k, total).apply()
                      return true
                  }
                  return false
              }

              fun settings(c: Context): Settings {
                  val s = sp(c)
                  return Settings(
                      s.getInt("goal", 10000), s.getInt("height", 175), s.getInt("weight", 70),
                      s.getBoolean("reduce", false), s.getBoolean("haptics", true),
                      s.getInt("theme", 0), s.getBoolean("hc", false)
                  )
              }

              fun saveSettings(c: Context, v: Settings) {
                  sp(c).edit()
                      .putInt("goal", v.goal.coerceIn(1000, 50000))
                      .putInt("height", v.height.coerceIn(120, 230))
                      .putInt("weight", v.weight.coerceIn(30, 200))
                      .putBoolean("reduce", v.reduce)
                      .putBoolean("haptics", v.haptics)
                      .putInt("theme", v.theme)
                      .putBoolean("hc", v.hc)
                      .apply()
              }

              fun goal(c: Context): Int = sp(c).getInt("goal", 10000)
              fun tracking(c: Context): Boolean = sp(c).getBoolean("tracking", false)
              fun setTracking(c: Context, on: Boolean) = sp(c).edit().putBoolean("tracking", on).apply()

              /** true genau einmal pro Tag, sobald das Tagesziel erreicht ist. */
              @Synchronized
              fun goalJustReached(c: Context): Boolean {
                  val s = sp(c)
                  val k = "goal_hit_${todayKey()}"
                  val d = today(c)
                  if (d.real > 0 && d.real >= goal(c) && !s.getBoolean(k, false)) {
                      s.edit().putBoolean(k, true).apply()
                      return true
                  }
                  return false
              }
          }

          data class Pt(val lat: Double, val lon: Double, val t: Long, val seg: Int, val run: Boolean)
          data class RouteStats(val distM: Double, val timeS: Double, val avgKmh: Double)

          /**
           * Lauftour der letzten Stunde.
           * Performance: Punkte liegen im Speicher (Cache), Schreibzugriffe laufen auf einem eigenen
           * Hintergrund-Thread und werden gebuendelt (max. alle 10 s) - nie auf dem Main-Thread.
           */
          object Route {
              private const val HOUR = 3_600_000L
              private val io = Executors.newSingleThreadExecutor { r -> Thread(r, "route-io").apply { isDaemon = true } }
              private var cache: MutableList<Pt>? = null
              private var lastWrite = 0L

              private fun file(c: Context) = File(c.applicationContext.filesDir, "route.json")

              private fun readFile(c: Context): MutableList<Pt> {
                  val f = file(c)
                  if (!f.exists()) return mutableListOf()
                  return try {
                      val a = JSONArray(f.readText())
                      val out = ArrayList<Pt>()
                      for (i in 0 until a.length()) {
                          val o = a.getJSONArray(i)
                          out.add(Pt(o.getDouble(0), o.getDouble(1), o.getLong(2), o.getInt(3), o.getInt(4) == 1))
                      }
                      out
                  } catch (e: Exception) {
                      mutableListOf()
                  }
              }

              private fun writeFile(c: Context, pts: List<Pt>) {
                  try {
                      val a = JSONArray()
                      pts.forEach { a.put(JSONArray().put(it.lat).put(it.lon).put(it.t).put(it.seg).put(if (it.run) 1 else 0)) }
                      file(c).writeText(a.toString())
                  } catch (e: Exception) {
                  }
              }

              private fun ensure(c: Context): MutableList<Pt> {
                  val cur = cache
                  if (cur != null) return cur
                  val l = readFile(c)
                  cache = l
                  return l
              }

              private fun prune(l: MutableList<Pt>) {
                  val cutoff = System.currentTimeMillis() - HOUR
                  l.removeAll { it.t < cutoff }
              }

              @Synchronized
              fun load(c: Context): List<Pt> {
                  val l = ensure(c)
                  prune(l)
                  return l.toList()
              }

              /** Asynchron + gebuendelt. */
              fun add(c: Context, p: Pt) {
                  io.execute {
                      synchronized(this) {
                          val l = ensure(c)
                          l.add(p)
                          prune(l)
                          val now = System.currentTimeMillis()
                          if (now - lastWrite > 10_000L) {
                              lastWrite = now
                              writeFile(c, l.toList())
                          }
                      }
                  }
              }

              /** Zu kurze Abschnitte (kein echtes Laufen) werden verworfen. */
              fun dropShortSegment(c: Context, seg: Int) {
                  io.execute {
                      synchronized(this) {
                          val l = ensure(c)
                          if (l.count { it.seg == seg } < 3) l.removeAll { it.seg == seg }
                          prune(l)
                          writeFile(c, l.toList())
                      }
                  }
              }

              fun clear(c: Context) {
                  io.execute {
                      synchronized(this) {
                          ensure(c).clear()
                          file(c).delete()
                      }
                  }
              }

              fun dist(a: Pt, b: Pt): Double {
                  val r = 6371000.0
                  val p1 = Math.toRadians(a.lat)
                  val p2 = Math.toRadians(b.lat)
                  val dp = p2 - p1
                  val dl = Math.toRadians(b.lon - a.lon)
                  val h = sin(dp / 2).pow(2) + cos(p1) * cos(p2) * sin(dl / 2).pow(2)
                  return 2 * r * asin(min(1.0, sqrt(h)))
              }

              fun stats(p: List<Pt>): RouteStats {
                  var d = 0.0
                  var t = 0.0
                  for (i in 1 until p.size) {
                      val a = p[i - 1]
                      val b = p[i]
                      if (a.seg != b.seg) continue
                      val dt = (b.t - a.t) / 1000.0
                      if (dt < 0.5 || dt > 30) continue
                      val dd = dist(a, b)
                      if (dd / dt > 8.0) continue
                      d += dd
                      t += dt
                  }
                  return RouteStats(d, t, if (t > 0) d / t * 3.6 else 0.0)
              }
          }
          EOF

          cat > app/src/main/java/com/stride/app/Background.kt <<'EOF'
          package com.stride.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import androidx.work.Constraints
          import androidx.work.CoroutineWorker
          import androidx.work.ExistingPeriodicWorkPolicy
          import androidx.work.OneTimeWorkRequestBuilder
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import androidx.work.WorkerParameters
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withTimeoutOrNull
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resume

          /** Liest EINMAL den Hardware-Zaehler (zaehlt im Sensor-Chip, die App muss dafuer nicht laufen). */
          object Counter {
              suspend fun read(c: Context): Float? = withTimeoutOrNull(6000L) {
                  suspendCancellableCoroutine<Float?> { cont ->
                      val sm = c.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                      val sensor = sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)
                      if (sensor == null) {
                          cont.resume(null)
                      } else {
                          val l = object : SensorEventListener {
                              override fun onSensorChanged(e: SensorEvent) {
                                  sm.unregisterListener(this)
                                  if (cont.isActive) cont.resume(e.values[0])
                              }
                              override fun onAccuracyChanged(x: Sensor?, a: Int) {}
                          }
                          sm.registerListener(l, sensor, SensorManager.SENSOR_DELAY_NORMAL)
                          cont.invokeOnCancellation { sm.unregisterListener(l) }
                      }
                  }
              }
          }

          class SyncWorker(c: Context, p: WorkerParameters) : CoroutineWorker(c, p) {
              override suspend fun doWork(): Result {
                  val ctx = applicationContext
                  val v = Counter.read(ctx)
                  if (v != null) Store.sync(ctx, v)
                  if (Store.settings(ctx).hc) HealthSync.push(ctx)
                  StepWidget.updateAll(ctx)
                  return Result.success()
              }
          }

          object Scheduler {
              fun schedule(c: Context) {
                  // Akku-schonend: nicht bei fast leerem Akku
                  val cons = Constraints.Builder().setRequiresBatteryNotLow(true).build()
                  val req = PeriodicWorkRequestBuilder<SyncWorker>(15, TimeUnit.MINUTES).setConstraints(cons).build()
                  WorkManager.getInstance(c.applicationContext)
                      .enqueueUniquePeriodicWork("stride_sync", ExistingPeriodicWorkPolicy.KEEP, req)
              }

              fun now(c: Context) {
                  WorkManager.getInstance(c.applicationContext).enqueue(OneTimeWorkRequestBuilder<SyncWorker>().build())
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  Scheduler.schedule(c)
                  Scheduler.now(c)
              }
          }
          EOF

          cat > app/src/main/java/com/stride/app/Extras.kt <<'EOF'
          package com.stride.app

          import android.content.Context
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.StepsRecord
          import androidx.health.connect.client.records.metadata.DataOrigin
          import androidx.health.connect.client.records.metadata.Metadata
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.util.Locale

          // ------------------------------------------------------------------ Haptik
          object Haptics {
              private var lastWarn = 0L

              @Suppress("DEPRECATION")
              private fun vib(c: Context): Vibrator? = try {
                  if (Build.VERSION.SDK_INT >= 31) {
                      (c.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      c.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
              } catch (e: Exception) {
                  null
              }

              /** Ziel erreicht: dreifaches, dezentes Pulsen */
              fun success(c: Context) {
                  if (!Store.settings(c).haptics) return
                  vib(c)?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 25, 80, 25, 80, 70), -1))
              }

              /** Fake-Schritt entlarvt: kurzer Tick (maximal alle 2 s) */
              fun warn(c: Context) {
                  if (!Store.settings(c).haptics) return
                  val n = System.currentTimeMillis()
                  if (n - lastWarn < 2000L) return
                  lastWarn = n
                  vib(c)?.vibrate(VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE))
              }
          }

          // ------------------------------------------------------------------ Health Connect
          object HealthSync {
              val permissions: Set<String> = setOf(
                  HealthPermission.getReadPermission(StepsRecord::class),
                  HealthPermission.getWritePermission(StepsRecord::class)
              )

              fun available(c: Context): Boolean =
                  HealthConnectClient.getSdkStatus(c) == HealthConnectClient.SDK_AVAILABLE

              /** Schreibt die echten Schritte der letzten 3 Tage (ein Datensatz pro Tag, wird aktualisiert statt dupliziert). */
              suspend fun push(c: Context): Boolean {
                  if (!available(c)) return false
                  return try {
                      val client = HealthConnectClient.getOrCreate(c)
                      if (!client.permissionController.getGrantedPermissions().containsAll(permissions)) return false
                      val zone = ZoneId.systemDefault()
                      val recs = ArrayList<StepsRecord>()
                      for (i in 0..2) {
                          val date = LocalDate.now().minusDays(i.toLong())
                          val day = Store.day(c, date.toString())
                          if (day.real <= 0) continue
                          val start = date.atStartOfDay(zone).toInstant()
                          val end = if (i == 0) Instant.now() else date.plusDays(1).atStartOfDay(zone).toInstant()
                          if (!end.isAfter(start)) continue
                          recs.add(
                              StepsRecord(
                                  count = day.real.toLong(),
                                  startTime = start,
                                  startZoneOffset = zone.rules.getOffset(start),
                                  endTime = end,
                                  endZoneOffset = zone.rules.getOffset(end),
                                  metadata = Metadata(clientRecordId = "stride-$date", clientRecordVersion = System.currentTimeMillis())
                              )
                          )
                      }
                      if (recs.isNotEmpty()) client.insertRecords(recs)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              /** Holt eigene Tagessummen der letzten 30 Tage zurueck (neues Handy / Neuinstallation). -1 = Fehler */
              suspend fun restore(c: Context): Int {
                  if (!available(c)) return -1
                  return try {
                      val client = HealthConnectClient.getOrCreate(c)
                      if (!client.permissionController.getGrantedPermissions().containsAll(permissions)) return -1
                      val zone = ZoneId.systemDefault()
                      val from = LocalDate.now().minusDays(30).atStartOfDay(zone).toInstant()
                      val resp = client.readRecords(
                          ReadRecordsRequest(
                              StepsRecord::class,
                              TimeRangeFilter.between(from, Instant.now()),
                              setOf(DataOrigin(c.packageName))
                          )
                      )
                      val perDay = resp.records
                          .groupBy { it.startTime.atZone(zone).toLocalDate() }
                          .mapValues { e -> e.value.sumOf { it.count } }
                      var n = 0
                      perDay.forEach { (d, cnt) -> if (Store.fillDay(c, d.toString(), cnt.toInt())) n++ }
                      n
                  } catch (e: Exception) {
                      -1
                  }
              }
          }

          // ------------------------------------------------------------------ Export
          object Export {
              fun gpx(pts: List<Pt>): String {
                  val sb = StringBuilder()
                  sb.append("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n")
                  sb.append("<gpx version=\"1.1\" creator=\"Stride\" xmlns=\"http://www.topografix.com/GPX/1/1\">\n")
                  sb.append("<trk><name>Stride Route</name>\n")
                  pts.groupBy { it.seg }.forEach { (_, l) ->
                      sb.append("<trkseg>\n")
                      l.forEach {
                          sb.append(
                              String.format(
                                  Locale.US, "<trkpt lat=\"%.6f\" lon=\"%.6f\"><time>%s</time></trkpt>\n",
                                  it.lat, it.lon, Instant.ofEpochMilli(it.t).toString()
                              )
                          )
                      }
                      sb.append("</trkseg>\n")
                  }
                  sb.append("</trk>\n</gpx>\n")
                  return sb.toString()
              }

              fun csv(c: Context): String {
                  val sb = StringBuilder("\uFEFF")
                  sb.append("Datum;Schritte gesamt;Echte Schritte;Fake-Schritte;Gehen;Laufen;Distanz km;Kalorien\n")
                  for (i in 29 downTo 0) {
                      val d = Store.day(c, LocalDate.now().minusDays(i.toLong()).toString())
                      sb.append("${d.date};${d.total};${d.real};${d.fake};${d.walk};${d.run};${d.km.f2()};${d.kcal}\n")
                  }
                  return sb.toString()
              }
          }
          EOF

