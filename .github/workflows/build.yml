          @Composable
          fun SettingsScreen(goal: Int, perms: Perms, onGoal: (Int) -> Unit, onAsk: () -> Unit) {
              val ctx = LocalContext.current
              Screen {
                  Appear(0) { Title("Mehr", "Ziel, Berechtigungen & Akku") }
                  Appear(1) {
                      Row(Modifier.fillMaxWidth().glass(28.dp).padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f)) {
                              Txt("TAGESZIEL", 11, FontWeight.SemiBold, .55f, spacing = 1f)
                              Txt(goal.fmt(), 28, FontWeight.Bold, spacing = -.5f)
                          }
                          Box(
                              Modifier.size(46.dp).bounceClick { onGoal(goal - 500) }.glass(23.dp),
                              contentAlignment = Alignment.Center
                          ) { Txt("−", 24, FontWeight.Medium) }
                          Spacer(Modifier.width(10.dp))
                          Box(
                              Modifier.size(46.dp).bounceClick { onGoal(goal + 500) }.glass(23.dp),
                              contentAlignment = Alignment.Center
                          ) { Txt("+", 24, FontWeight.Medium) }
                      }
                  }
                  Appear(2) {
                      Column(Modifier.fillMaxWidth().glass(28.dp).padding(18.dp)) {
                          Txt("BERECHTIGUNGEN", 11, FontWeight.SemiBold, .55f, spacing = 1f)
                          Spacer(Modifier.height(6.dp))
                          PermRow("Aktivitätserkennung (Schritte)", perms.act)
                          PermRow("Standort (Route)", perms.loc)
                          PermRow("Benachrichtigungen", perms.notif)
                      }
                  }
                  Appear(3) { GlassButton("Berechtigungen anfragen") { onAsk() } }
                  Appear(4) {
                      GlassButton("App-Einstellungen öffnen") {
                          try {
                              ctx.startActivity(
                                  Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${ctx.packageName}"))
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          } catch (e: Exception) {
                          }
                      }
                  }
                  Appear(5) {
                      GlassButton("Akku-Optimierung anpassen") {
                          try {
                              ctx.startActivity(
                                  Intent(android.provider.Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          } catch (e: Exception) {
                          }
                      }
                  }
                  Appear(6) { GlassButton("Route jetzt löschen") { Route.clear(ctx) } }
                  Appear(7) {
                      Txt(
                          "Stride zählt über den Schrittzähler-Chip deines Handys – dafür muss die App nicht laufen. " +
                              "Das Widget aktualisiert sich automatisch ca. alle 15 Minuten und beim Öffnen der App.",
                          12, FontWeight.Normal, .45f, modifier = Modifier.padding(horizontal = 6.dp)
                      )
                  }
              }
          }

          // ---------------------------------------------------------------- Tab-Leiste (Glas)
          @Composable
          fun TabBar(sel: Int, onSel: (Int) -> Unit, modifier: Modifier = Modifier) {
              val items = listOf(
                  "Heute" to Icons.Rounded.Home,
                  "Route" to Icons.Rounded.Place,
                  "Verlauf" to Icons.Rounded.BarChart,
                  "Mehr" to Icons.Rounded.Settings
              )
              Row(
                  modifier.padding(horizontal = 24.dp, vertical = 12.dp).fillMaxWidth()
                      .glass(34.dp, base = Color(0xCC0B0E17)).padding(6.dp),
                  horizontalArrangement = Arrangement.SpaceBetween
              ) {
                  items.forEachIndexed { i, (label, icon) ->
                      val a by animateFloatAsState(if (sel == i) 1f else 0f, tween(320, easing = FastOutSlowInEasing), label = "tab")
                      Box(
                          Modifier.weight(1f).bounceClick { onSel(i) }
                              .clip(RoundedCornerShape(26.dp))
                              .background(Color.White.copy(alpha = .14f * a))
                              .padding(vertical = 9.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Icon(
                                  icon, contentDescription = label,
                                  tint = lerp(Color.White.copy(alpha = .5f), Sky, a),
                                  modifier = Modifier.size(24.dp).scale(1f + .12f * a)
                              )
                              Txt(label, 11, FontWeight.SemiBold, .5f + .5f * a)
                          }
                      }
                  }
              }
          }
