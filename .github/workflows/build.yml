                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Txt("SCHRITTE", 12, FontWeight.SemiBold, .55f, spacing = 1.5f)
                          Txt(shown.fmt(), 50, FontWeight.Bold, spacing = -1f)
                          Txt("von ${goal.fmt()}", 14, FontWeight.Medium, .6f)
                      }
                  }
                  Spacer(Modifier.height(16.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(22.dp)) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.size(8.dp).background(Mint, CircleShape))
                          Spacer(Modifier.width(7.dp))
                          Txt("Tagesziel", 12, FontWeight.Medium, .7f)
                      }
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Box(Modifier.size(8.dp).background(Rose, CircleShape))
                          Spacer(Modifier.width(7.dp))
                          Txt("Laufen (Ziel 2.000)", 12, FontWeight.Medium, .7f)
                      }
                  }
              }
          }

          @Composable
          fun LivePill() {
              val mode = if (Live.running) Live.mode else "off"
              val flash = System.currentTimeMillis() - Live.fakeFlash < 2500
              val col by animateColorAsState(
                  when {
                      flash -> Rose
                      mode == "run" -> Amber
                      mode == "walk" -> Mint
                      mode == "idle" -> Sky
                      else -> Color.Gray
                  }, tween(400), label = "dot"
              )
              // Pulsieren nur, wenn die Live-Erkennung laeuft (sonst kein Animations-Loop)
              val pulse = if (mode == "off") 1f else {
                  val inf = rememberInfiniteTransition(label = "pulse")
                  val v by inf.animateFloat(
                      .6f, 1.25f,
                      infiniteRepeatable(tween(900, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "pulse"
                  )
                  v
              }
              val text = when {
                  flash -> "Fake-Schritt erkannt"
                  mode == "run" -> "Laufen · ${Live.cadence} Schritte/min"
                  mode == "walk" -> "Gehen · ${Live.cadence} Schritte/min"
                  mode == "idle" -> "Bereit – wartet auf Bewegung"
                  else -> "Live-Erkennung aus"
              }
              Row(
                  Modifier.fillMaxWidth().glass(24.dp).padding(horizontal = 18.dp, vertical = 14.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(10.dp).scale(pulse).background(col, CircleShape))
                  Spacer(Modifier.width(12.dp))
                  Txt(text, 15, FontWeight.Medium)
              }
          }

          @Composable
          fun SplitCard(d: Day) {
              val pal = LocalPal.current
              val tot = max(1, d.real)
              val rf by animateFloatAsState(d.run.toFloat() / tot, tween(900, easing = FastOutSlowInEasing), label = "rf")
              Column(Modifier.fillMaxWidth().glass(26.dp).padding(18.dp)) {
                  Txt("GEHEN & LAUFEN", 11, FontWeight.SemiBold, .55f, spacing = 1f)
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth().height(14.dp).clip(CircleShape).background(pal.fg.copy(alpha = .08f))) {
                      Box(Modifier.weight(max(.0001f, 1f - rf)).fillMaxHeight().background(Mint))
                      Box(Modifier.weight(max(.0001f, rf)).fillMaxHeight().background(Amber))
                  }
                  Spacer(Modifier.height(12.dp))
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Txt("Gehen  ${d.walk.fmt()}", 14, FontWeight.Medium, color = tone(Mint))
                      Txt("Laufen  ${d.run.fmt()}", 14, FontWeight.Medium, color = tone(Amber))
                  }
              }
          }

