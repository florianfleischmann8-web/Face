      - name: Kotlin - Erkennung (Fake/Echt, Gehen/Rennen) und Live-Service
        run: |
          cat > app/src/main/java/com/stride/app/Engine.kt <<'EOF'
          package com.stride.app

          import android.os.SystemClock
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          /** Live-Zustand, den die UI beobachtet. */
          object Live {
              var mode by mutableStateOf("idle")        // idle | walk | run
              var cadence by mutableIntStateOf(0)       // Schritte pro Minute
              var running by mutableStateOf(false)
              var fakeFlash by mutableLongStateOf(0L)
              var gps by mutableStateOf(false)
          }

          /**
           * Prueft jeden Hardware-Schritt gegen den Beschleunigungssensor:
           *  - zu wenig Bewegung        -> Fake (App/Emulator/Tippen auf dem Tisch)
           *  - unmenschlich schnell     -> Fake
           *  - unregelmaessiger Rhythmus-> Fake (Schuetteln)
           *  - extreme Amplitude        -> Fake (heftiges Schuetteln)
           * Danach Unterscheidung Gehen / Laufen ueber Kadenz + Aufprallstaerke.
           *
           * Akku: Der Beschleunigungssensor wird gebatcht geliefert (CPU schlaeft zwischendurch).
           * Deshalb werden Schritte erst ausgewertet, wenn Beschleunigungsdaten NACH dem Schritt vorliegen.
           * Alle Aufrufe kommen von EINEM Sensor-Thread.
           */
          class Detector(private val onReal: (Boolean) -> Unit, private val onFake: () -> Unit) {
              private class S(val t: Long, val m: Float)

              private val buf = ArrayDeque<S>()
              private val steps = ArrayDeque<Long>()
              private val pending = ArrayDeque<Long>()

              @Volatile
              var lastRealAt = 0L
                  private set

              fun onAccel(t: Long, x: Float, y: Float, z: Float) {
                  buf.addLast(S(t, sqrt(x * x + y * y + z * z)))
                  while (buf.isNotEmpty() && t - buf.first().t > 1500) buf.removeFirst()
                  while (pending.isNotEmpty() && t - pending.first() >= 120) evaluate(pending.removeFirst())
              }

              fun onStep(t: Long) {
                  pending.addLast(t)
                  while (pending.size > 60) pending.removeFirst()
              }

              private fun evaluate(t: Long) {
                  var mn = Float.MAX_VALUE
                  var mx = 0f
                  var n = 0
                  for (s in buf) {
                      val dt0 = t - s.t
                      if (dt0 >= 0 && dt0 <= 700) {
                          mn = min(mn, s.m)
                          mx = max(mx, s.m)
                          n++
                      }
                  }
                  val amp = if (n >= 3) mx - mn else 0f
                  var ok = amp >= 1.6f && amp <= 38f

                  if (steps.isNotEmpty() && t - steps.last() > 2500) steps.clear()
                  if (ok && steps.isNotEmpty()) {
                      val dt = t - steps.last()
                      if (dt < 230) {
                          ok = false
                      } else if (steps.size >= 5) {
                          val iv = (steps.toList().takeLast(6) + t).zipWithNext { a, b -> (b - a).toFloat() }
                          val mean = iv.average().toFloat()
                          val sd = sqrt(iv.map { (it - mean) * (it - mean) }.average()).toFloat()
                          if (sd > mean * 0.55f) ok = false
                      }
                  }

                  if (!ok) {
                      onFake()
                      return
                  }

                  steps.addLast(t)
                  while (steps.size > 12) steps.removeFirst()
                  lastRealAt = SystemClock.elapsedRealtime()

                  var run = false
                  if (steps.size >= 4) {
                      val last = steps.toList().takeLast(6)
                      val mean = (last.last() - last.first()).toFloat() / (last.size - 1)
                      val cad = 1000f / max(mean, 1f)
                      Live.cadence = (cad * 60).roundToInt()
                      run = cad >= 2.5f || (cad >= 2.2f && amp > 20f)
                  }
                  onReal(run)
              }
          }
          EOF

          cat > app/src/main/java/com/stride/app/TrackingService.kt <<'EOF'
          package com.stride.app

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock

          /**
           * Optionale "Live-Erkennung": Foreground-Service (mit Benachrichtigung).
           * - Sensor-Auswertung und GPS-Callbacks laufen auf einem eigenen Hintergrund-Thread (nicht Main).
           * - Beschleunigungssensor wird gebatcht (1 s) -> CPU kann zwischendurch schlafen.
           * - GPS laeuft NUR waehrend aktivem Gehen/Laufen. Punkte ohne Aktivitaet werden verworfen.
           * - Alles aelter als 60 Minuten wird geloescht.
           */
          class TrackingService : Service(), SensorEventListener, LocationListener {

              private lateinit var sm: SensorManager
              private lateinit var lm: LocationManager
              private lateinit var det: Detector
              private val sensorThread = HandlerThread("stride-sensors")
              private lateinit var sh: Handler
              private val handler = Handler(Looper.getMainLooper())
              private var seg = 1
              private var wasActive = false
              private var gpsOn = false
              private var idleSince = 0L

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  sm = getSystemService(SENSOR_SERVICE) as SensorManager
                  lm = getSystemService(LOCATION_SERVICE) as LocationManager
                  sensorThread.start()
                  sh = Handler(sensorThread.looper)
                  det = Detector(
                      onReal = { run ->
                          if (run) Store.addRun(this)
                          Live.mode = if (run) "run" else "walk"
                      },
                      onFake = {
                          Store.addFake(this)
                          Live.fakeFlash = System.currentTimeMillis()
                          Haptics.warn(this)
                      }
                  )
                  seg = (System.currentTimeMillis() / 1000L).toInt()
                  startForegroundCompat()
                  // Accelerometer: 50 Hz, aber in 1-s-Paketen geliefert (Batching spart Akku)
                  sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.let { sm.registerListener(this, it, 20_000, 1_000_000, sh) }
                  // Step-Detector sofort (selten, ueberholt das Accel-Paket => wird erst danach ausgewertet)
                  sm.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR)?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_FASTEST, sh) }
                  sm.getDefaultSensor(Sensor.TYPE_STEP_COUNTER)?.let { sm.registerListener(this, it, SensorManager.SENSOR_DELAY_NORMAL, 5_000_000, sh) }
                  Live.running = true
                  Live.mode = "idle"
                  handler.post(tick)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              private fun isActive(): Boolean {
                  val now = SystemClock.elapsedRealtime()
                  return det.lastRealAt > 0 && now - det.lastRealAt < 4000
              }

              private val tick = object : Runnable {
                  override fun run() {
                      val now = SystemClock.elapsedRealtime()
                      if (isActive()) {
                          if (!wasActive) {
                              seg++
                              wasActive = true
                          }
                          idleSince = 0L
                          if (!gpsOn) startGps()
                      } else {
                          if (wasActive) {
                              wasActive = false
                              Live.mode = "idle"
                              Live.cadence = 0
                              Route.dropShortSegment(this@TrackingService, seg)
                              idleSince = now
                          }
                          if (gpsOn && idleSince > 0 && now - idleSince > 20000L) stopGps()
                      }
                      handler.postDelayed(this, 1000L)
                  }
              }

              override fun onSensorChanged(e: SensorEvent) {
                  val t = e.timestamp / 1_000_000L
                  when (e.sensor.type) {
                      Sensor.TYPE_ACCELEROMETER -> det.onAccel(t, e.values[0], e.values[1], e.values[2])
                      Sensor.TYPE_STEP_DETECTOR -> det.onStep(t)
                      Sensor.TYPE_STEP_COUNTER -> {
                          Store.sync(this, e.values[0])
                          if (Store.goalJustReached(this)) Haptics.success(this)
                      }
                  }
              }

              override fun onAccuracyChanged(s: Sensor?, a: Int) {}

              @SuppressLint("MissingPermission")
              private fun startGps() {
                  try {
                      // Callbacks laufen auf dem Sensor-Thread, nicht auf dem Main-Thread
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 2000L, 2f, this, sensorThread.looper)
                      gpsOn = true
                      Live.gps = true
                  } catch (e: Exception) {
                  }
              }

              private fun stopGps() {
                  try {
                      lm.removeUpdates(this)
                  } catch (e: Exception) {
                  }
                  gpsOn = false
                  Live.gps = false
              }

              override fun onLocationChanged(l: Location) {
                  if (!isActive() || l.accuracy > 35f) return // kein aktives Laufen => Punkt wird verworfen
                  Route.add(this, Pt(l.latitude, l.longitude, System.currentTimeMillis(), seg, Live.mode == "run")) // async
              }

              @Deprecated("Deprecated in Java")
              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
              override fun onProviderEnabled(provider: String) {}
              override fun onProviderDisabled(provider: String) {}

              private fun startForegroundCompat() {
                  val ch = "stride_live"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(ch, "Live-Erkennung", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, ch)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle("Stride Live-Erkennung")
                      .setContentText("Erkennt Gehen, Laufen und Fake-Schritte")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION)
                  } else {
                      startForeground(1, n)
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  sm.unregisterListener(this)
                  stopGps()
                  Route.dropShortSegment(this, seg)
                  sensorThread.quitSafely()
                  Live.running = false
                  Live.mode = "idle"
                  Live.cadence = 0
                  super.onDestroy()
              }
          }
          EOF

