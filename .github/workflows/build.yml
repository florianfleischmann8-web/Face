                      </intent-filter>
                  </activity>
                  <service android:name=".MirrorService" android:exported="false" android:foregroundServiceType="mediaProjection" />
                  <service android:name=".ControlService" android:exported="true" android:label="PhoneLink Fernsteuerung"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility" />
                  </service>
