          cat > app/src/main/java/com/phonelink/ControlService.kt <<'EOF'
          package com.phonelink

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class ControlService : AccessibilityService() {
              companion object { @Volatile var inst: ControlService? = null }
              override fun onServiceConnected() { inst = this }
              override fun onDestroy() { inst = null; super.onDestroy() }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun gesture(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long) {
                  val p = Path().apply { moveTo(x1, y1); if (x1 != x2 || y1 != y2) lineTo(x2, y2) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, maxOf(dur, 1L))).build()
                  dispatchGesture(g, null, null)
              }
              private class P(var cx: Float, var cy: Float, var tx: Float, var ty: Float) {
                  var stroke: GestureDescription.StrokeDescription? = null
                  var ending = false
                  var started = false
              }
              private val ptrs = LinkedHashMap<Int, P>()
              private val main = Handler(Looper.getMainLooper())
              private var busy = false
              private var lastT = 0L

              fun touch(t: String, id: Int, x: Float, y: Float) {
                  main.post {
                      when (t) {
                          "d" -> ptrs[id] = P(x, y, x, y)
                          "m" -> ptrs[id]?.let { it.tx = x; it.ty = y }
                          "u" -> ptrs[id]?.let { it.tx = x; it.ty = y; it.ending = true }
                      }
                      pump()
                  }
              }

              private fun pump() {
                  if (busy) return
                  if (ptrs.values.none { !it.started || it.cx != it.tx || it.cy != it.ty || it.ending }) return
                  val now = SystemClock.uptimeMillis()
                  val dur = if (lastT == 0L) 30L else (now - lastT).coerceIn(20L, 80L)
                  lastT = now
                  val b = GestureDescription.Builder()
                  for (p in ptrs.values) {
                      val path = Path().apply { moveTo(p.cx, p.cy); if (p.tx != p.cx || p.ty != p.cy) lineTo(p.tx, p.ty) }
                      val cont = !p.ending
                      val s = p.stroke?.continueStroke(path, 0L, dur, cont) ?: GestureDescription.StrokeDescription(path, 0L, dur, cont)
                      p.stroke = s; p.cx = p.tx; p.cy = p.ty; p.started = true
                      b.addStroke(s)
                  }
                  busy = true
                  val ok = dispatchGesture(b.build(), object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) {
                          busy = false
                          ptrs.values.removeAll { it.ending }
                          if (ptrs.isEmpty()) lastT = 0L
                          pump()
                      }
                      override fun onCancelled(g: GestureDescription?) { busy = false; ptrs.clear(); lastT = 0L }
                  }, main)
                  if (!ok) { busy = false; ptrs.clear() }
              }

              fun key(n: String) {
                  performGlobalAction(when (n) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      "recents" -> GLOBAL_ACTION_RECENTS
                      else -> GLOBAL_ACTION_NOTIFICATIONS
                  })
              }
              fun setText(t: String) {
                  val n = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return
                  n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, Bundle().apply {
                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, t)
                  })
              }
          }
          EOF
          cat > app/src/main/java/com/phonelink/WebServer.kt <<'EOF'
          package com.phonelink

          import android.content.Context
          import android.util.Base64
          import java.io.DataInputStream
          import java.io.InputStream
          import java.io.OutputStream
          import java.security.MessageDigest
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.net.URLDecoder
          import kotlin.concurrent.thread

          object Shared {
              val pin = (100000..999999).random().toString()
              @Volatile var running = false
              @Volatile var w = 0
              @Volatile var h = 0
              @Volatile var frame: ByteArray? = null
              @Volatile var seq = 0L
          }

          class WebServer(private val ctx: Context) {
              private var ss: ServerSocket? = null

              fun start() {
                  ss = ServerSocket().apply { reuseAddress = true; bind(InetSocketAddress(8080)) }
                  thread(isDaemon = true) {
                      try { while (true) { val s = ss!!.accept(); s.tcpNoDelay = true; thread(isDaemon = true) { handle(s) } } } catch (e: Exception) {}
                  }
              }
              fun stop() { try { ss?.close() } catch (e: Exception) {} }

              private fun resp(o: OutputStream, code: Int, type: String, b: ByteArray) {
                  o.write("HTTP/1.1 $code OK\r\nContent-Type: $type\r\nContent-Length: ${b.size}\r\nCache-Control: no-store\r\nConnection: close\r\n\r\n".toByteArray())
                  o.write(b); o.flush()
              }

              private fun handle(sock: Socket) {
                  try {
                      sock.use {
                          val inp = it.getInputStream().bufferedReader(Charsets.ISO_8859_1)
                          val line = inp.readLine() ?: return
                          var wsKey: String? = null
                          while (true) { val h = inp.readLine(); if (h.isNullOrEmpty()) break; if (h.startsWith("Sec-WebSocket-Key:", true)) wsKey = h.substringAfter(":").trim() }
                          val target = line.split(" ").getOrElse(1) { "/" }
                          val path = target.substringBefore("?")
                          val q = HashMap<String, String>()
                          target.substringAfter("?", "").split("&").forEach { p ->
                              val kv = p.split("=", limit = 2)
                              if (kv.size == 2) q[kv[0]] = URLDecoder.decode(kv[1], "UTF-8")
                          }
                          val out = it.getOutputStream()
                          if (path == "/") { resp(out, 200, "text/html; charset=utf-8", ctx.assets.open("index.html").readBytes()); return }
                          if (q["k"] != Shared.pin) { resp(out, 403, "text/plain", "PIN falsch".toByteArray()); return }
                          val c = ControlService.inst
                          val W = Shared.w.toFloat(); val H = Shared.h.toFloat()
                          fun f(n: String) = q[n]?.toFloatOrNull() ?: 0f
                          when (path) {
                              "/stream" -> { stream(out); return }
                              "/ws" -> { ws(it.getInputStream(), out, wsKey); return }
                              "/info" -> { resp(out, 200, "application/json", "{\"w\":${Shared.w},\"h\":${Shared.h},\"ctl\":${c != null}}".toByteArray()); return }
                              "/tap" -> c?.gesture(f("x") * W, f("y") * H, f("x") * W, f("y") * H, 40)
                              "/long" -> c?.gesture(f("x") * W, f("y") * H, f("x") * W, f("y") * H, 700)
                              "/swipe" -> c?.gesture(f("x1") * W, f("y1") * H, f("x2") * W, f("y2") * H, q["d"]?.toLongOrNull() ?: 250)
                              "/key" -> c?.key(q["name"] ?: "")
                              "/text" -> c?.setText(q["t"] ?: "")
                          }
                          resp(out, 200, "text/plain", "ok".toByteArray())
                      }
                  } catch (e: Exception) {}
              }

              private fun ws(inp: InputStream, out: OutputStream, key: String?) {
                  if (key == null) return
                  val acc = Base64.encodeToString(MessageDigest.getInstance("SHA-1").digest((key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").toByteArray()), Base64.NO_WRAP)
                  out.write("HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: $acc\r\n\r\n".toByteArray())
                  out.flush()
                  val din = DataInputStream(inp)
                  while (Shared.running) {
                      val b0 = din.readUnsignedByte(); val b1 = din.readUnsignedByte()
                      var len = (b1 and 0x7F).toLong()
                      if (len == 126L) len = din.readUnsignedShort().toLong() else if (len == 127L) len = din.readLong()
                      if (len > 100000L) return
                      val mask = if ((b1 and 0x80) != 0) ByteArray(4).also { din.readFully(it) } else null
                      val buf = ByteArray(len.toInt()); din.readFully(buf)
                      if (mask != null) for (i in buf.indices) buf[i] = (buf[i].toInt() xor mask[i % 4].toInt()).toByte()
                      when (b0 and 0x0F) {
                          1 -> touchMsg(String(buf, Charsets.UTF_8))
                          8 -> return
                          9 -> synchronized(out) { out.write(byteArrayOf(0x8A.toByte(), 0)); out.flush() }
                      }
                  }
              }

              private fun touchMsg(m: String) {
                  val p = m.split(" ")
                  val c = ControlService.inst ?: return
                  try { c.touch(p[0], p[1].toInt(), p[2].toFloat() * Shared.w, p[3].toFloat() * Shared.h) } catch (e: Exception) {}
              }

              private fun stream(out: OutputStream) {
                  out.write("HTTP/1.1 200 OK\r\nContent-Type: multipart/x-mixed-replace; boundary=f\r\nCache-Control: no-store\r\nConnection: close\r\n\r\n".toByteArray())
                  var last = -1L
                  while (Shared.running) {
                      val f = Shared.frame; val s = Shared.seq
                      if (f != null && s != last) {
                          last = s
                          out.write("--f\r\nContent-Type: image/jpeg\r\nContent-Length: ${f.size}\r\n\r\n".toByteArray())
                          out.write(f); out.write("\r\n".toByteArray()); out.flush()
                      } else Thread.sleep(3)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/phonelink/MirrorService.kt <<'EOF'
          package com.phonelink

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import java.io.ByteArrayOutputStream

          @Suppress("DEPRECATION")
          class MirrorService : Service() {
              private var mp: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var ir: ImageReader? = null
              private var ht: HandlerThread? = null
              private var server: WebServer? = null

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, fl: Int, id: Int): Int {
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(NotificationChannel("pl", "PhoneLink", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "pl").setContentTitle("PhoneLink läuft")
                      .setContentText("Dein Handy ist im WLAN erreichbar").setSmallIcon(android.R.drawable.ic_menu_share).build()
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  val data = i?.getParcelableExtra<Intent>("data")
                  if (data == null) { stopSelf(); return START_NOT_STICKY }
                  mp = (getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager)
                      .getMediaProjection(i.getIntExtra("code", 0), data)
                  mp!!.registerCallback(object : MediaProjection.Callback() { override fun onStop() { stopSelf() } }, Handler(Looper.getMainLooper()))
                  val dm = DisplayMetrics()
                  (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  Shared.w = dm.widthPixels; Shared.h = dm.heightPixels
                  val w = (minOf(800, dm.widthPixels) / 2) * 2
                  val h = ((dm.heightPixels * w / dm.widthPixels) / 2) * 2
                  ht = HandlerThread("pl").also { it.start() }
                  ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                  vd = mp!!.createVirtualDisplay("pl", w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, ir!!.surface, null, null)
                  var last = 0L; var bmp: Bitmap? = null; val bo = ByteArrayOutputStream(150000)
                  ir!!.setOnImageAvailableListener({ r ->
                      val img = r.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          val now = SystemClock.uptimeMillis()
                          if (now - last >= 16) {
                              last = now
                              val p = img.planes[0]
                              val bw = p.rowStride / p.pixelStride; if (bmp == null || bmp!!.width != bw) bmp = Bitmap.createBitmap(bw, img.height, Bitmap.Config.ARGB_8888); val b = bmp!!
                              b.copyPixelsFromBuffer(p.buffer)
                              bo.reset()
                              (if (bw != img.width) Bitmap.createBitmap(b, 0, 0, img.width, img.height) else b).compress(Bitmap.CompressFormat.JPEG, 70, bo)
                              
                              Shared.frame = bo.toByteArray(); Shared.seq++
                          }
                      } finally { img.close() }
                  }, Handler(ht!!.looper))
                  Shared.running = true
                  server = WebServer(this).also { it.start() }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  Shared.running = false; Shared.frame = null
                  vd?.release(); ir?.close(); mp?.stop(); server?.stop(); ht?.quit()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/phonelink/MainActivity.kt <<'EOF'
          package com.phonelink

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import java.net.Inet4Address
          import java.net.NetworkInterface

          @Suppress("DEPRECATION")
          class MainActivity : Activity() {
              private lateinit var url: TextView
              private lateinit var b1: Button
              private lateinit var b2: Button
              private val gray = 0xFF86A0AE.toInt()
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun bg(c: Int, r: Int) = GradientDrawable().apply { setColor(c); cornerRadius = dp(r).toFloat() }
              private fun tv(t: String, sp: Float, c: Int, bold: Boolean = false) = TextView(this).apply {
                  text = t; textSize = sp; setTextColor(c); if (bold) typeface = Typeface.DEFAULT_BOLD
              }
              private fun btn(c: Int, f: () -> Unit) = Button(this).apply {
                  isAllCaps = false; textSize = 16f; setTextColor(Color.WHITE); background = bg(c, 18)
                  setOnClickListener { f() }
                  layoutParams = LinearLayout.LayoutParams(-1, dp(56)).apply { topMargin = dp(12) }
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  window.statusBarColor = 0xFF0D1B24.toInt(); window.navigationBarColor = 0xFF0D1B24.toInt()
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(22), dp(48), dp(22), dp(22)) }
                  col.addView(tv("PhoneLink", 32f, Color.WHITE, true))
                  col.addView(tv("Dein Handy im Browser deines iPads", 15f, gray))
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; background = bg(0xFF16293A.toInt(), 24)
                      setPadding(dp(20), dp(18), dp(20), dp(18))
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(24) }
                  }
                  card.addView(tv("Öffne am iPad in Safari", 13f, gray))
                  url = tv("", 15f, 0xFFFFB84D.toInt(), true).apply { typeface = Typeface.MONOSPACE }
                  card.addView(url)
                  card.addView(tv("PIN", 13f, gray).apply { setPadding(0, dp(14), 0, 0) })
                  card.addView(tv(Shared.pin, 34f, 0xFF5CE1C6.toInt(), true).apply { letterSpacing = 0.2f })
                  col.addView(card)
                  b1 = btn(0xFF3B6EF5.toInt()) { toggle() }
                  b2 = btn(0xFF22394D.toInt()) { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  col.addView(b1); col.addView(b2)
                  col.addView(tv("Für die Fernsteuerung: Einstellungen → Apps → PhoneLink → ⋮ → „Eingeschränkte Einstellungen zulassen“. Danach unter Bedienungshilfen → Installierte Apps → PhoneLink einschalten.", 13f, gray).apply { setPadding(0, dp(16), 0, 0) })
                  col.addView(tv("Von überall: Installiere Tailscale (gratis) auf Handy und iPad und melde beide mit demselben Konto an. Dann erscheint hier die „Überall“-Adresse.", 13f, gray).apply { setPadding(0, dp(12), 0, 0) })
                  setContentView(ScrollView(this).apply { setBackgroundColor(0xFF0D1B24.toInt()); addView(col) })
              }

              private fun toggle() {
                  if (Shared.running) { stopService(Intent(this, MirrorService::class.java)); b1.postDelayed({ refresh() }, 500) }
                  else startActivityForResult((getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager).createScreenCaptureIntent(), 42)
              }

              override fun onActivityResult(rq: Int, rc: Int, d: Intent?) {
                  if (rq == 42 && rc == RESULT_OK && d != null) {
                      startForegroundService(Intent(this, MirrorService::class.java).putExtra("code", rc).putExtra("data", d))
                      b1.postDelayed({ refresh() }, 700)
                  }
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() {
                  url.text = if (Shared.running) { val (lan, ts) = ips(); "WLAN: http://$lan:8080" + (if (ts != null) "\nÜberall: http://$ts:8080" else "") } else "Spiegelung ist aus"
                  b1.text = if (Shared.running) "Spiegelung stoppen" else "Spiegelung starten"
                  b2.text = if (ControlService.inst != null) "Fernsteuerung aktiv ✓" else "Fernsteuerung aktivieren"
              }

              private fun ips(): Pair<String, String?> {
                  var lan = "kein WLAN"; var ts: String? = null
                  try {
                      for (n in NetworkInterface.getNetworkInterfaces()) for (a in n.inetAddresses) if (!a.isLoopbackAddress && a is Inet4Address) {
                          val h = a.hostAddress ?: continue
                          if (h.startsWith("100.") && (h.split(".")[1].toIntOrNull() ?: 0) in 64..127) ts = h else if (a.isSiteLocalAddress) lan = h
                      }
                  } catch (e: Exception) {}
                  return Pair(lan, ts)
              }

              private fun ip(): String {
                  try {
                      for (n in NetworkInterface.getNetworkInterfaces()) for (a in n.inetAddresses)
                          if (!a.isLoopbackAddress && a is Inet4Address && a.isSiteLocalAddress) return a.hostAddress ?: ""
                  } catch (e: Exception) {}
                  return "kein WLAN"
              }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="theme-color" content="#0D1B24">
          <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='28' fill='%231E3A8A'/%3E%3Cpath d='M66 47a9 9 0 0 1 0 13M72 42a17 17 0 0 1 0 24' stroke='%23FFB84D' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Crect x='31' y='33' width='24' height='42' rx='5' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
          <title>PhoneLink</title>
          <style>
          :root{--bg:#0D1B24;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--ink:#EAF2F5;--mute:#9DB3BF;--amber:#FFB84D;--mint:#5CE1C6;--blue:#3B6EF5;--bad:#FF7A8A}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
          body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
          #pin,#txt{-webkit-user-select:text;user-select:text}
          .aur{position:fixed;inset:-20%;z-index:-1;filter:blur(80px) saturate(150%);opacity:.85}
          .aur i{position:absolute;border-radius:50%;animation:drift 20s ease-in-out infinite alternate}
          .aur i:nth-child(1){width:55vmax;height:55vmax;left:0;top:0;background:var(--blue)}
          .aur i:nth-child(2){width:45vmax;height:45vmax;right:0;bottom:0;background:var(--mint);animation-delay:-7s}
          .aur i:nth-child(3){width:36vmax;height:36vmax;left:38%;top:42%;background:var(--amber);opacity:.5;animation-delay:-12s}
          @keyframes drift{to{transform:translate(12vmax,-9vmax) scale(1.25)}}
          .glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);box-shadow:0 24px 70px rgba(0,0,0,.45)}
          #lock{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
          .card{width:min(460px,100%);padding:44px 36px 36px;border-radius:40px;text-align:center}
          .logo{width:108px;height:108px;margin-bottom:20px;filter:drop-shadow(0 18px 44px rgba(59,110,245,.7))}
          .logo path[class]{fill:none;stroke-width:4.4;stroke-linecap:round;animation:pulse 2.4s ease-in-out infinite}
          .a2{animation-delay:.25s!important}.a3{animation-delay:.5s!important}
          @keyframes pulse{0%,100%{opacity:.3}40%{opacity:1}}
          h1{margin:0 0 8px;font-size:40px;font-weight:800;letter-spacing:-.03em}
          .card p{margin:0 0 26px;color:var(--mute)}
          #pin{width:100%;padding:16px;border-radius:22px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ink);font:700 32px ui-rounded,system-ui;letter-spacing:.45em;text-align:center;outline:none}
          #pin:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(255,184,77,.2)}
          .go{width:100%;margin-top:14px;padding:17px;border:0;border-radius:22px;background:var(--amber);color:#2A1B00;font:800 18px ui-rounded,system-ui}
          .go:active{transform:scale(.98)}
          #err{min-height:22px;margin-top:14px;color:var(--bad);font-size:14px}
          #app{position:fixed;inset:0;display:none;touch-action:none}
          #scr{position:absolute;background:#05090c;box-shadow:0 0 0 1px var(--line),0 30px 120px rgba(0,0,0,.6);pointer-events:none;-webkit-user-drag:none}
          #chrome{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .3s}
          #chrome.show{opacity:1}#chrome>*{pointer-events:none}#chrome.show>*{pointer-events:auto}
          .chips{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px}
          .chip{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;font-size:13px;color:var(--mute)}
          #dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
          .dock{position:absolute;bottom:calc(54px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px;border-radius:36px}
          .btn{width:56px;height:56px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);display:grid;place-items:center;transition:transform .12s,background .12s}
          .btn:active,.btn.on{transform:scale(.9);background:rgba(255,184,77,.3);border-color:var(--amber)}
          .btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
          #grab{display:none;position:fixed;bottom:env(safe-area-inset-bottom);left:50%;transform:translateX(-50%);width:140px;height:40px;place-items:center;z-index:6}
          #grab i{width:70px;height:5px;border-radius:9px;background:rgba(255,255,255,.4)}
          .dot{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,77,.55),rgba(255,184,77,.12));border:2px solid rgba(255,255,255,.75);pointer-events:none;z-index:4;animation:dotin .15s ease-out}
          @keyframes dotin{from{transform:scale(.5);opacity:0}}
          .tbar{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));width:min(580px,92vw);display:flex;gap:10px;padding:10px;border-radius:28px;transform:translate(-50%,400%);transition:transform .3s;z-index:7}
          .tbar.on{transform:translate(-50%,0)}
          .tbar input{flex:1;min-width:0;padding:13px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:17px ui-rounded,system-ui;outline:none}
          .tbar button{padding:0 22px;border:0;border-radius:20px;background:var(--amber);color:#2A1B00;font:800 16px ui-rounded,system-ui}
          @media(prefers-reduced-motion:reduce){.aur i,.logo path[class]{animation:none}.tbar,#chrome{transition:none}}
          </style></head><body>
          <div class="aur"><i></i><i></i><i></i></div>
          <div id="lock"><div class="glass card">
            <svg class="logo" viewBox="0 0 108 108"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B24"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient></defs><rect width="108" height="108" rx="28" fill="url(#g)"/><path d="M36,33h14a5,5 0 0 1 5,5v32a5,5 0 0 1 -5,5h-14a5,5 0 0 1 -5,-5v-32a5,5 0 0 1 5,-5z" fill="none" stroke="#fff" stroke-width="3.6"/><circle cx="43" cy="54" r="3" fill="#fff"/><path class="a1" d="M66.36,47.64A9,9 0 0 1 66.36,60.36" stroke="#FFB84D"/><path class="a2" d="M72.02,41.98A17,17 0 0 1 72.02,66.02" stroke="#5CE1C6"/><path class="a3" d="M77.68,36.32A25,25 0 0 1 77.68,71.68" stroke="#7AA2FF"/></svg>
            <h1>PhoneLink</h1><p>Gib die 6-stellige PIN ein, die auf deinem Handy steht.</p>
            <input id="pin" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
            <button class="go" id="go">Mit Handy verbinden</button><div id="err"></div>
          </div></div>
          <div id="app"><img id="scr" alt="Handy-Bildschirm"></div>
          <div id="chrome">
            <div class="chips"><span class="chip glass"><i id="dot"></i><span id="live">Verbinde …</span></span><span class="chip glass" id="ctl">Nur Ansicht</span></div>
            <div class="dock glass">
              <button class="btn" data-k="back" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
              <button class="btn" data-k="home" aria-label="Home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
              <button class="btn" data-k="recents" aria-label="Letzte Apps"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3.5"/></svg></button>
              <button class="btn" data-k="notifications" aria-label="Mitteilungen"><svg viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 00-9 0v4L6 17zM10 20h4"/></svg></button>
              <button class="btn" id="kb" aria-label="Text eingeben"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
              <button class="btn" id="fs" aria-label="Vollbild"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            </div>
          </div>
          <div id="grab" aria-label="Menü"><i></i></div>
          <div class="tbar glass" id="tbar"><input id="txt" placeholder="Text für das markierte Eingabefeld" autocomplete="off"><button id="send">Senden</button></div>
          <script>
          const $=s=>document.querySelector(s);let K='',A=9/19.5,ht;
          try{K=localStorage.getItem('k')||''}catch(e){}
          $('#pin').value=K;
          const q=(p,o={})=>fetch(p+'?'+new URLSearchParams({k:K,...o}),{method:'POST'}).catch(()=>{});
          function live(on){$('#dot').style.background=on?'var(--mint)':'var(--bad)';$('#live').textContent=on?'Live':'Getrennt – verbinde neu …'}
          function stream(){$('#scr').src='/stream?k='+K+'&t='+Date.now()}
          $('#scr').onload=()=>live(true);
          $('#scr').onerror=()=>{live(false);setTimeout(stream,1500)};
          function fit(){const vw=innerWidth,vh=innerHeight;let h=vh,w=h*A;if(w>vw){w=vw;h=w/A}const s=$('#scr').style;s.width=w+'px';s.height=h+'px';s.left=(vw-w)/2+'px';s.top=(vh-h)/2+'px'}
          addEventListener('resize',fit);
          function showUI(){const c=$('#chrome');c.classList.add('show');clearTimeout(ht);ht=setTimeout(()=>{if(!$('#tbar').classList.contains('on'))c.classList.remove('show')},4000)}
          $('#grab').onclick=()=>{const c=$('#chrome');if(c.classList.contains('show')){c.classList.remove('show');clearTimeout(ht)}else showUI()};
          $('#chrome').addEventListener('pointerdown',showUI);
          async function info(first){
            try{const r=await fetch('/info?k='+K);if(!r.ok)throw 0;const i=await r.json();
              if(!i.w&&first){$('#err').textContent='Starte zuerst die Spiegelung auf dem Handy.';return false}
              if(i.w){A=i.w/i.h;fit()}
              $('#ctl').textContent=i.ctl?'Steuerung aktiv':'Nur Ansicht';$('#ctl').style.color=i.ctl?'var(--mint)':'var(--mute)';return true
            }catch(e){if(first)$('#err').textContent='PIN falsch oder Handy nicht erreichbar.';return false}
          }
          async function connect(){
            K=$('#pin').value.trim();$('#err').textContent='';
            if(!(await info(true)))return;
            try{localStorage.setItem('k',K)}catch(e){}
            $('#lock').style.display='none';$('#app').style.display='block';$('#grab').style.display='grid';
            fit();stream();openWS();showUI();setInterval(()=>info(false),3000)
          }
          $('#go').onclick=connect;$('#pin').onkeydown=e=>{if(e.key==='Enter')connect()};
          document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>q('/key',{name:b.dataset.k}));
          $('#kb').onclick=()=>{const t=$('#tbar');t.classList.toggle('on');$('#kb').classList.toggle('on');if(t.classList.contains('on'))$('#txt').focus();else showUI()};
          const sendTxt=()=>q('/text',{t:$('#txt').value});
          $('#send').onclick=sendTxt;$('#txt').onkeydown=e=>{if(e.key==='Enter')sendTxt()};
          $('#fs').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)};
          const st=$('#app');let ws,pend={},raf=0;const ids=new Map(),dots=new Map();
          function openWS(){ws=new WebSocket('ws://'+location.host+'/ws?k='+K);ws.onclose=()=>setTimeout(openWS,1500)}
          const send=m=>{if(ws&&ws.readyState===1)ws.send(m)};
          const cl=v=>Math.min(1,Math.max(0,v));
          const nrm=e=>{const r=$('#scr').getBoundingClientRect();return cl((e.clientX-r.left)/r.width).toFixed(4)+' '+cl((e.clientY-r.top)/r.height).toFixed(4)};
          const inRect=e=>{const r=$('#scr').getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom};
          function nid(){let i=0;const u=[...ids.values()];while(u.includes(i))i++;return i}
          function dot(e){let el=dots.get(e.pointerId);if(!el){el=document.createElement('i');el.className='dot';document.body.appendChild(el);dots.set(e.pointerId,el)}el.style.left=e.clientX+'px';el.style.top=e.clientY+'px'}
          st.addEventListener('pointerdown',e=>{if(!inRect(e))return;st.setPointerCapture(e.pointerId);const i=nid();ids.set(e.pointerId,i);send('d '+i+' '+nrm(e));dot(e)});
          st.addEventListener('pointermove',e=>{const i=ids.get(e.pointerId);if(i===undefined)return;pend[i]=nrm(e);dot(e);if(!raf)raf=requestAnimationFrame(()=>{raf=0;for(const k in pend)send('m '+k+' '+pend[k]);pend={}})});
          const up=e=>{const i=ids.get(e.pointerId);if(i===undefined)return;delete pend[i];send('u '+i+' '+nrm(e));ids.delete(e.pointerId);const el=dots.get(e.pointerId);if(el){el.remove();dots.delete(e.pointerId)}};
          st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
          document.addEventListener('gesturestart',e=>e.preventDefault());

          </script></body></html>
          EOF
      - name: APK bauen
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-APK
          path: app/build/outputs/apk/debug/*.apk
