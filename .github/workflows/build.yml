name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt erzeugen
        run: |
          mkdir -p app/src/main/java/com/example/mirror app/src/main/res/xml app/src/main/res/values app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenMirror"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.mirror'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.mirror'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Screen Mirror"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ScreenService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service
                      android:name=".ControlService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/mirror/MainActivity.java <<'EOF'
          package com.example.mirror;

          import android.app.Activity;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.net.Inet4Address;
          import java.net.InetAddress;
          import java.net.NetworkInterface;
          import java.util.Collections;

          public class MainActivity extends Activity {
              private static final int REQ = 1;
              private TextView info;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setGravity(Gravity.CENTER);
                  l.setPadding(48, 48, 48, 48);

                  info = new TextView(this);
                  info.setTextSize(20);
                  info.setGravity(Gravity.CENTER);

                  Button start = new Button(this);
                  start.setText("Spiegeln starten");
                  start.setOnClickListener(v -> {
                      MediaProjectionManager m =
                          (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                      startActivityForResult(m.createScreenCaptureIntent(), REQ);
                  });

                  Button stop = new Button(this);
                  stop.setText("Stoppen");
                  stop.setOnClickListener(v -> {
                      Intent i = new Intent(this, ScreenService.class);
                      i.setAction("STOP");
                      startService(i);
                  });

                  Button acc = new Button(this);
                  acc.setText("Steuerung aktivieren");
                  acc.setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));

                  l.addView(info);
                  l.addView(acc);
                  l.addView(start);
                  l.addView(stop);
                  setContentView(l);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 2);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  String ip = findIp();
                  if (ip == null) {
                      info.setText("Kein WLAN gefunden. Verbinde das Handy mit WLAN oder starte den Hotspot.");
                  } else {
                      info.setText("\u00d6ffne auf dem iPad in Safari:\n\nhttp://" + ip + ":8080"
                          + "\n\nSteuerung: " + (ControlService.instance != null ? "an" : "aus"));
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ && res == RESULT_OK && data != null) {
                      Intent i = new Intent(this, ScreenService.class);
                      i.putExtra("code", res);
                      i.putExtra("data", data);
                      startForegroundService(i);
                  }
              }

              private static String findIp() {
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          for (InetAddress a : Collections.list(ni.getInetAddresses())) {
                              if (!a.isLoopbackAddress() && a instanceof Inet4Address && a.isSiteLocalAddress()) {
                                  return a.getHostAddress();
                              }
                          }
                      }
                  } catch (Exception e) {
                  }
                  return null;
              }
          }
          EOF

          cat > app/src/main/java/com/example/mirror/ScreenService.java <<'EOF'
          package com.example.mirror;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.nio.ByteBuffer;

          public class ScreenService extends Service {
              private static final String HTML =
                  "<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'>"
                  + "<title>Mirror</title></head><body style='margin:0;background:#000'>"
                  + "<img src='/stream' style='width:100vw;height:100vh;object-fit:contain'></body></html>";

              private MediaProjection projection;
              private VirtualDisplay vd;
              private ImageReader reader;
              private HandlerThread ht;
              private ServerSocket server;
              private volatile boolean running = false;
              static volatile int screenW = 1080;
              static volatile int screenH = 2340;
              private byte[] pageBytes;
              private volatile byte[] frame;
              private volatile long frameNo = 0;
              private final Object lock = new Object();

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;
                  if ("STOP".equals(intent.getAction())) {
                      stopAll();
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (running) return START_NOT_STICKY;

                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(
                      new NotificationChannel("mirror", "Spiegeln", NotificationManager.IMPORTANCE_LOW));
                  Notification n = new Notification.Builder(this, "mirror")
                      .setContentTitle("Bildschirm wird gespiegelt")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build();
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);

                  try {
                      int code = intent.getIntExtra("code", 0);
                      Intent data = intent.getParcelableExtra("data");
                      MediaProjectionManager mpm =
                          (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                      projection = mpm.getMediaProjection(code, data);

                      ht = new HandlerThread("capture");
                      ht.start();
                      Handler h = new Handler(ht.getLooper());

                      projection.registerCallback(new MediaProjection.Callback() {
                          @Override
                          public void onStop() {
                              stopAll();
                          }
                      }, h);

                      DisplayMetrics dm = new DisplayMetrics();
                      ((WindowManager) getSystemService(WINDOW_SERVICE)).getDefaultDisplay().getRealMetrics(dm);
                      screenW = dm.widthPixels;
                      screenH = dm.heightPixels;
                      loadPage();
                      int w = (dm.widthPixels / 2) & ~1;
                      int hh = (dm.heightPixels / 2) & ~1;

                      reader = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2);
                      reader.setOnImageAvailableListener(r -> onFrame(r), h);
                      vd = projection.createVirtualDisplay("mirror", w, hh, dm.densityDpi / 2,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, h);

                      running = true;
                      new Thread(this::serve).start();
                  } catch (Exception e) {
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              private void onFrame(ImageReader r) {
                  Image img = null;
                  try {
                      img = r.acquireLatestImage();
                      if (img == null) return;
                      Image.Plane p = img.getPlanes()[0];
                      ByteBuffer buf = p.getBuffer();
                      int ps = p.getPixelStride();
                      int rs = p.getRowStride();
                      int w = img.getWidth();
                      int hgt = img.getHeight();
                      Bitmap bmp = Bitmap.createBitmap(rs / ps, hgt, Bitmap.Config.ARGB_8888);
                      bmp.copyPixelsFromBuffer(buf);
                      Bitmap crop = Bitmap.createBitmap(bmp, 0, 0, w, hgt);
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      crop.compress(Bitmap.CompressFormat.JPEG, 65, bos);
                      if (crop != bmp) crop.recycle();
                      bmp.recycle();
                      synchronized (lock) {
                          frame = bos.toByteArray();
                          frameNo++;
                          lock.notifyAll();
                      }
                  } catch (Exception e) {
                  } finally {
                      if (img != null) img.close();
                  }
              }

              private void serve() {
                  try {
                      server = new ServerSocket(8080);
                      while (running) {
                          Socket s = server.accept();
                          new Thread(() -> handle(s)).start();
                      }
                  } catch (Exception e) {
                  }
              }

              private void handle(Socket s) {
                  try {
                      s.setTcpNoDelay(true);
                      BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()));
                      String line = in.readLine();
                      if (line == null) return;
                      String l;
                      while ((l = in.readLine()) != null && !l.isEmpty()) {
                      }
                      OutputStream out = s.getOutputStream();
                      String path = line.split(" ")[1];
                      if (path.startsWith("/tap") || path.startsWith("/swipe") || path.startsWith("/key")) {
                          control(path);
                          out.write("HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nok".getBytes());
                          out.flush();
                      } else if (path.startsWith("/stream")) {
                          out.write(("HTTP/1.1 200 OK\r\n"
                              + "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n"
                              + "Cache-Control: no-cache\r\n"
                              + "Connection: close\r\n\r\n").getBytes());
                          long seen = 0;
                          while (running) {
                              byte[] f;
                              synchronized (lock) {
                                  while (running && frameNo == seen) lock.wait(1000);
                                  f = frame;
                                  seen = frameNo;
                              }
                              if (f == null) continue;
                              out.write(("--frame\r\nContent-Type: image/jpeg\r\nContent-Length: "
                                  + f.length + "\r\n\r\n").getBytes());
                              out.write(f);
                              out.write("\r\n".getBytes());
                              out.flush();
                          }
                      } else {
                          byte[] page = pageBytes != null ? pageBytes : HTML.getBytes("UTF-8");
                          out.write(("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\n"
                              + "Content-Length: " + page.length + "\r\nConnection: close\r\n\r\n").getBytes());
                          out.write(page);
                          out.flush();
                      }
                  } catch (Exception e) {
                  } finally {
                      try {
                          s.close();
                      } catch (Exception e) {
                      }
                  }
              }

              private void loadPage() {
                  try {
                      java.io.InputStream is = getAssets().open("index.html");
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] b = new byte[4096];
                      int n;
                      while ((n = is.read(b)) > 0) bo.write(b, 0, n);
                      is.close();
                      pageBytes = bo.toByteArray();
                  } catch (Exception e) {
                  }
              }

              private static String param(String path, String key) {
                  int qm = path.indexOf('?');
                  if (qm < 0) return null;
                  for (String kv : path.substring(qm + 1).split("&")) {
                      int e = kv.indexOf('=');
                      if (e > 0 && kv.substring(0, e).equals(key)) return kv.substring(e + 1);
                  }
                  return null;
              }

              private static float f(String path, String key) {
                  try {
                      return Float.parseFloat(param(path, key));
                  } catch (Exception e) {
                      return 0f;
                  }
              }

              private static float clamp(float v, int max) {
                  return Math.max(1f, Math.min(max - 1f, v));
              }

              private void control(String path) {
                  ControlService c = ControlService.instance;
                  if (c == null) return;
                  try {
                      if (path.startsWith("/tap")) {
                          float x = clamp(f(path, "x") * screenW, screenW);
                          float y = clamp(f(path, "y") * screenH, screenH);
                          c.swipe(x, y, x, y, (long) f(path, "ms"));
                      } else if (path.startsWith("/swipe")) {
                          c.swipe(clamp(f(path, "x1") * screenW, screenW), clamp(f(path, "y1") * screenH, screenH),
                              clamp(f(path, "x2") * screenW, screenW), clamp(f(path, "y2") * screenH, screenH),
                              (long) f(path, "ms"));
                      } else if (path.startsWith("/key")) {
                          c.key(param(path, "k"));
                      }
                  } catch (Exception e) {
                  }
              }

              private synchronized void stopAll() {
                  if (!running) return;
                  running = false;
                  try {
                      server.close();
                  } catch (Exception e) {
                  }
                  synchronized (lock) {
                      lock.notifyAll();
                  }
                  try {
                      if (vd != null) vd.release();
                  } catch (Exception e) {
                  }
                  try {
                      if (reader != null) reader.close();
                  } catch (Exception e) {
                  }
                  try {
                      if (projection != null) projection.stop();
                  } catch (Exception e) {
                  }
                  if (ht != null) ht.quitSafely();
                  stopForeground(true);
              }

              @Override
              public void onDestroy() {
                  stopAll();
                  super.onDestroy();
              }
          }
          EOF

      - name: Steuerung erzeugen
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="acc_desc">Erlaubt Fernsteuerung vom iPad aus</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/java/com/example/mirror/ControlService.java <<'EOF'
          package com.example.mirror;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class ControlService extends AccessibilityService {
              static volatile ControlService instance;

              @Override
              protected void onServiceConnected() {
                  instance = this;
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent e) {
              }

              @Override
              public void onInterrupt() {
              }

              @Override
              public boolean onUnbind(Intent i) {
                  instance = null;
                  return super.onUnbind(i);
              }

              void swipe(float x1, float y1, float x2, float y2, long ms) {
                  Path p = new Path();
                  p.moveTo(x1, y1);
                  if (x1 != x2 || y1 != y2) p.lineTo(x2, y2);
                  GestureDescription.StrokeDescription s =
                      new GestureDescription.StrokeDescription(p, 0, Math.max(ms, 1L));
                  dispatchGesture(new GestureDescription.Builder().addStroke(s).build(), null, null);
              }

              void key(String k) {
                  if (k == null) return;
                  if (k.equals("back")) performGlobalAction(GLOBAL_ACTION_BACK);
                  else if (k.equals("home")) performGlobalAction(GLOBAL_ACTION_HOME);
                  else if (k.equals("recents")) performGlobalAction(GLOBAL_ACTION_RECENTS);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
          <title>Mirror</title>
          <style>
          html,body{margin:0;height:100%;background:#000;overflow:hidden}
          body{display:flex;flex-direction:column;align-items:center;justify-content:center}
          img{max-width:100vw;max-height:calc(100vh - 64px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
          #bar{display:flex;gap:12px;height:64px;align-items:center}
          button{font-size:18px;padding:10px 22px;border-radius:12px;border:0;background:#333;color:#fff}
          </style>
          </head>
          <body>
          <img id="s" src="/stream" draggable="false">
          <div id="bar">
          <button data-k="back">Zurück</button>
          <button data-k="home">Home</button>
          <button data-k="recents">Übersicht</button>
          </div>
          <script>
          var img = document.getElementById('s'), d = null;
          function pos(e) {
            var r = img.getBoundingClientRect();
            return {x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height};
          }
          function send(u) { fetch(u).catch(function () {}); }
          img.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            img.setPointerCapture(e.pointerId);
            d = {p: pos(e), cx: e.clientX, cy: e.clientY, t: Date.now()};
          });
          img.addEventListener('pointerup', function (e) {
            if (!d) return;
            var p = pos(e);
            var dist = Math.hypot(e.clientX - d.cx, e.clientY - d.cy);
            var el = Date.now() - d.t;
            if (dist < 12) {
              send('/tap?x=' + d.p.x + '&y=' + d.p.y + '&ms=' + (el > 500 ? 700 : 50));
            } else {
              var ms = Math.min(Math.max(el, 100), 1000);
              send('/swipe?x1=' + d.p.x + '&y1=' + d.p.y + '&x2=' + p.x + '&y2=' + p.y + '&ms=' + ms);
            }
            d = null;
          });
          img.addEventListener('pointercancel', function () { d = null; });
          document.querySelectorAll('button').forEach(function (b) {
            b.onclick = function () { send('/key?k=' + b.dataset.k); };
          });
          </script>
          </body>
          </html>
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMirror-APK
          path: app/build/outputs/apk/debug/app-debug.apk
