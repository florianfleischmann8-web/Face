name: Build Lens APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Projekt erzeugen
        run: |
          flutter create --org com.lens --project-name lens_search --platforms android app
          cd app
          rm -rf test
          flutter pub add camera google_mlkit_image_labeling image url_launcher

      - name: Android konfigurieren (minSdk, Kamera-Rechte, Name)
        working-directory: app
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Lens"|' android/app/src/main/AndroidManifest.xml

      - name: Logo / App-Icon generieren
        working-directory: app
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import math
          from PIL import Image, ImageDraw, ImageFilter

          S = 1024

          def mix(c1, c2, mask):
              return Image.composite(Image.new('RGB', (S, S), c2),
                                     Image.new('RGB', (S, S), c1), mask)

          vert = Image.linear_gradient('L').resize((S, S))
          horiz = Image.linear_gradient('L').rotate(90).resize((S, S))

          bg = mix((10, 8, 28), (58, 22, 120), vert)
          ring_col = mix((53, 224, 255), (255, 79, 216), horiz)

          m = Image.new('L', (S, S), 0)
          d = ImageDraw.Draw(m)
          R, W = 290, 84
          d.arc([512 - R, 512 - R, 512 + R, 512 + R], start=40, end=320, fill=255, width=W)
          for ang in (40, 320):
              x = 512 + R * math.cos(math.radians(ang))
              y = 512 + R * math.sin(math.radians(ang))
              d.ellipse([x - W / 2, y - W / 2, x + W / 2, y + W / 2], fill=255)

          glow = m.filter(ImageFilter.GaussianBlur(46)).point(lambda v: int(v * 0.6))
          bg = Image.composite(Image.new('RGB', (S, S), (130, 90, 255)), bg, glow)
          bg = Image.composite(ring_col, bg, m)

          s = 130
          cx = cy = 512
          k = 0.2
          star = [(cx, cy - s), (cx + s * k, cy - s * k), (cx + s, cy), (cx + s * k, cy + s * k),
                  (cx, cy + s), (cx - s * k, cy + s * k), (cx - s, cy), (cx - s * k, cy - s * k)]
          ImageDraw.Draw(bg).polygon(star, fill=(255, 255, 255))

          mask = Image.new('L', (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S - 1, S - 1], radius=230, fill=255)
          icon = bg.convert('RGBA')
          icon.putalpha(mask)

          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, px in sizes.items():
              icon.resize((px, px), Image.LANCZOS).save(
                  f'android/app/src/main/res/mipmap-{name}/ic_launcher.png')
          PY

      - name: App-Code schreiben
        working-directory: app
        run: |
          cat > lib/main.dart <<'EOF'
          import 'dart:io';
          import 'dart:math' as math;
          import 'dart:ui' as ui;
          import 'package:camera/camera.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:google_mlkit_image_labeling/google_mlkit_image_labeling.dart';
          import 'package:image/image.dart' as img;
          import 'package:url_launcher/url_launcher.dart';

          const cCyan = Color(0xFF35E0FF);
          const cViolet = Color(0xFF8B5CFF);
          const cPink = Color(0xFFFF4FD8);
          const cBg = Color(0xFF07070F);

          Color wh(int a) => Color.fromARGB(a, 255, 255, 255);

          List<CameraDescription> cams = [];

          const Map<String, String> de = {
            'Shoe': 'Schuhe', 'Footwear': 'Schuhe', 'Sneakers': 'Sneaker', 'Sandal': 'Sandalen',
            'Boot': 'Stiefel', 'Laptop': 'Laptop', 'Computer': 'Computer', 'Netbook': 'Laptop',
            'Mobile phone': 'Smartphone', 'Phone': 'Smartphone', 'Smartphone': 'Smartphone',
            'Watch': 'Armbanduhr', 'Clock': 'Uhr', 'Chair': 'Stuhl', 'Table': 'Tisch',
            'Couch': 'Sofa', 'Bed': 'Bett', 'Bottle': 'Flasche', 'Water bottle': 'Trinkflasche',
            'Cup': 'Tasse', 'Mug': 'Tasse', 'Backpack': 'Rucksack', 'Bag': 'Tasche',
            'Handbag': 'Handtasche', 'Sunglasses': 'Sonnenbrille', 'Glasses': 'Brille',
            'Headphones': 'Kopfhörer', 'Camera': 'Kamera', 'Keyboard': 'Tastatur',
            'Computer keyboard': 'Tastatur', 'Computer mouse': 'Computermaus', 'Mouse': 'Computermaus',
            'Lamp': 'Lampe', 'Bicycle': 'Fahrrad', 'Car': 'Auto', 'Plant': 'Pflanze',
            'Houseplant': 'Zimmerpflanze', 'Flowerpot': 'Blumentopf', 'Book': 'Buch',
            'Jacket': 'Jacke', 'Jeans': 'Jeans', 'Dress': 'Kleid', 'Hat': 'Hut', 'Cap': 'Kappe',
            'Pen': 'Stift', 'Television': 'Fernseher', 'Monitor': 'Monitor', 'Toy': 'Spielzeug',
            'Guitar': 'Gitarre', 'Wheel': 'Rad', 'Tire': 'Reifen', 'Shirt': 'Shirt',
            'T-shirt': 'T-Shirt', 'Speaker': 'Lautsprecher', 'Tableware': 'Geschirr',
            'Vase': 'Vase', 'Pillow': 'Kissen', 'Fork': 'Gabel', 'Spoon': 'Löffel',
            'Knife': 'Messer', 'Wallet': 'Geldbeutel', 'Tablet computer': 'Tablet',
            'Tablet': 'Tablet', 'Drink': 'Getränk', 'Coffee cup': 'Kaffeetasse',
            'Pants': 'Hose', 'Trousers': 'Hose', 'Sock': 'Socken', 'Scarf': 'Schal',
            'Ring': 'Ring', 'Necklace': 'Halskette', 'Jewellery': 'Schmuck', 'Perfume': 'Parfüm',
            'Cosmetics': 'Kosmetik', 'Tool': 'Werkzeug', 'Drill': 'Bohrmaschine',
            'Candle': 'Kerze', 'Mirror': 'Spiegel', 'Umbrella': 'Regenschirm',
          };

          const Set<String> generic = {
            'Product', 'Material property', 'Font', 'Rectangle', 'Pattern', 'Circle', 'Line',
            'Text', 'Metal', 'Plastic', 'Textile', 'Glass', 'Wood', 'Gas', 'Electric blue',
            'Black', 'White', 'Red', 'Blue', 'Grey', 'Tints and shades', 'Automotive design',
            'Fashion accessory', 'Event', 'Technology', 'Gadget', 'Electronic device',
            'Parallel', 'Symmetry', 'Sleeve', 'Sky', 'Cloud', 'Entertainment', 'Art', 'Design',
            'Thumb', 'Finger', 'Hand', 'Skin', 'Flesh', 'Nail', 'Leg', 'Arm', 'Joint', 'Neck',
            'Fashion', 'Happy', 'Smile', 'Room', 'Building', 'Facade', 'Shadow', 'Aluminium',
          };

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              systemNavigationBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
              systemNavigationBarIconBrightness: Brightness.light,
            ));
            try {
              cams = await availableCameras();
            } catch (_) {
              cams = [];
            }
            runApp(const LensApp());
          }

          class LensApp extends StatelessWidget {
            const LensApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Lens',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: cBg,
                  colorScheme: const ColorScheme.dark(primary: cCyan, secondary: cViolet),
                ),
                home: const Home(),
              );
            }
          }

          // ---------- Glas-Bausteine ----------

          class Glass extends StatelessWidget {
            final Widget child;
            final double radius;
            final EdgeInsets padding;
            final double blur;
            const Glass({
              super.key,
              required this.child,
              this.radius = 24,
              this.padding = const EdgeInsets.all(14),
              this.blur = 26,
            });

            @override
            Widget build(BuildContext context) {
              return ClipRRect(
                borderRadius: BorderRadius.circular(radius),
                child: BackdropFilter(
                  filter: ui.ImageFilter.blur(sigmaX: blur, sigmaY: blur),
                  child: Container(
                    padding: padding,
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(radius),
                      gradient: LinearGradient(
                        begin: Alignment.topLeft,
                        end: Alignment.bottomRight,
                        colors: [wh(60), wh(16)],
                      ),
                      border: Border.all(color: wh(70), width: 1),
                    ),
                    child: child,
                  ),
                ),
              );
            }
          }

          class LogoMark extends StatelessWidget {
            final double size;
            const LogoMark({super.key, this.size = 28});
            @override
            Widget build(BuildContext context) =>
                CustomPaint(size: Size.square(size), painter: LogoPainter());
          }

          class LogoPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final c = size.center(Offset.zero);
              final r = size.width * 0.34;
              final rect = Rect.fromCircle(center: c, radius: r);
              final glow = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = size.width * 0.14
                ..strokeCap = StrokeCap.round
                ..maskFilter = MaskFilter.blur(BlurStyle.normal, size.width * 0.08)
                ..shader = const SweepGradient(colors: [cCyan, cViolet, cPink, cCyan]).createShader(rect);
              final ring = Paint()
                ..style = PaintingStyle.stroke
                ..strokeWidth = size.width * 0.11
                ..strokeCap = StrokeCap.round
                ..shader = const SweepGradient(colors: [cCyan, cViolet, cPink, cCyan]).createShader(rect);
              const start = 0.7;
              const sweep = math.pi * 2 - 1.4;
              canvas.drawArc(rect, start, sweep, false, glow);
              canvas.drawArc(rect, start, sweep, false, ring);
              final s = size.width * 0.15;
              final star = Path()
                ..moveTo(c.dx, c.dy - s)
                ..quadraticBezierTo(c.dx, c.dy, c.dx + s, c.dy)
                ..quadraticBezierTo(c.dx, c.dy, c.dx, c.dy + s)
                ..quadraticBezierTo(c.dx, c.dy, c.dx - s, c.dy)
                ..quadraticBezierTo(c.dx, c.dy, c.dx, c.dy - s)
                ..close();
              canvas.drawPath(star, Paint()..color = Colors.white);
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }

          // ---------- Kreis-Painter ----------

          class CirclePainter extends CustomPainter {
            final List<Offset> pts;
            final bool closed;
            final double t;
            CirclePainter(this.pts, this.closed, this.t);

            @override
            void paint(Canvas canvas, Size size) {
              if (pts.length < 2) return;
              final path = Path()..moveTo(pts.first.dx, pts.first.dy);
              for (var i = 1; i < pts.length - 1; i++) {
                final m = Offset((pts[i].dx + pts[i + 1].dx) / 2, (pts[i].dy + pts[i + 1].dy) / 2);
                path.quadraticBezierTo(pts[i].dx, pts[i].dy, m.dx, m.dy);
              }
              path.lineTo(pts.last.dx, pts.last.dy);
              if (closed) {
                path.close();
                final dim = Path.combine(PathOperation.difference, Path()..addRect(Offset.zero & size), path);
                canvas.drawPath(dim, Paint()..color = const Color(0x99000000));
              }
              var b = path.getBounds();
              if (b.width < 2 || b.height < 2) b = b.inflate(2);
              final shader = SweepGradient(
                colors: const [cCyan, cViolet, cPink, cCyan],
                transform: GradientRotation(t * math.pi * 2),
              ).createShader(b);
              canvas.drawPath(
                path,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 16
                  ..strokeCap = StrokeCap.round
                  ..strokeJoin = StrokeJoin.round
                  ..maskFilter = const MaskFilter.blur(BlurStyle.normal, 12)
                  ..shader = shader,
              );
              canvas.drawPath(
                path,
                Paint()
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = 5
                  ..strokeCap = StrokeCap.round
                  ..strokeJoin = StrokeJoin.round
                  ..shader = shader,
              );
            }

            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => true;
          }

          // ---------- Daten ----------

          class Result {
            final String cropPath;
            final List<ImageLabel> labels;
            final String? msg;
            Result(this.cropPath, this.labels, {this.msg});
          }

          class Shop {
            final String name;
            final IconData icon;
            final Color color;
            final String url;
            Shop(this.name, this.icon, this.color, this.url);
          }

          // ---------- Hauptscreen ----------

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> with SingleTickerProviderStateMixin {
            CameraController? ctrl;
            String? error;
            final List<Offset> pts = [];
            bool closed = false, busy = false, torch = false;
            Result? result;
            int sel = 0;
            int rid = 0;
            Size screen = Size.zero;
            late final AnimationController anim =
                AnimationController(vsync: this, duration: const Duration(seconds: 3))..repeat();

            @override
            void initState() {
              super.initState();
              _init();
            }

            @override
            void dispose() {
              anim.dispose();
              ctrl?.dispose();
              super.dispose();
            }

            Future<void> _init() async {
              setState(() => error = null);
              try {
                if (cams.isEmpty) cams = await availableCameras();
                if (cams.isEmpty) throw Exception('keine Kamera');
                final cam = cams.firstWhere(
                  (c) => c.lensDirection == CameraLensDirection.back,
                  orElse: () => cams.first,
                );
                final c = CameraController(cam, ResolutionPreset.veryHigh, enableAudio: false);
                await c.initialize();
                await c.setFlashMode(FlashMode.off);
                if (!mounted) {
                  c.dispose();
                  return;
                }
                setState(() => ctrl = c);
              } catch (e) {
                if (mounted) {
                  setState(() => error = 'Kein Zugriff auf die Kamera.\nBitte erlaube die Kamera in den Einstellungen.');
                }
              }
            }

            Future<void> _resume() async {
              try {
                await ctrl?.resumePreview();
              } catch (_) {}
            }

            Future<void> _toggleTorch() async {
              try {
                torch = !torch;
                await ctrl?.setFlashMode(torch ? FlashMode.torch : FlashMode.off);
              } catch (_) {
                torch = false;
              }
              if (mounted) setState(() {});
            }

            Future<void> _clear() async {
              setState(() {
                pts.clear();
                closed = false;
                result = null;
              });
              await _resume();
            }

            void _start(DragStartDetails d) {
              if (busy || ctrl == null) return;
              _resume();
              setState(() {
                pts
                  ..clear()
                  ..add(d.localPosition);
                closed = false;
                result = null;
              });
            }

            void _update(DragUpdateDetails d) {
              if (busy || closed || ctrl == null) return;
              setState(() => pts.add(d.localPosition));
            }

            void _end(DragEndDetails d) {
              if (busy || closed || ctrl == null) return;
              if (pts.length < 10) {
                setState(() => pts.clear());
                return;
              }
              setState(() => closed = true);
              _analyze();
            }

            Future<void> _analyze() async {
              setState(() => busy = true);
              try {
                final shot = await ctrl!.takePicture();
                try {
                  await ctrl!.pausePreview();
                } catch (_) {}
                final bytes = await File(shot.path).readAsBytes();
                var im = img.decodeImage(bytes);
                if (im == null) throw Exception('decode');
                im = img.bakeOrientation(im);

                final W = im.width.toDouble(), H = im.height.toDouble();
                final scale = math.max(screen.width / W, screen.height / H);
                final ox = (screen.width - W * scale) / 2;
                final oy = (screen.height - H * scale) / 2;

                double minX = double.infinity, minY = double.infinity;
                double maxX = -double.infinity, maxY = -double.infinity;
                for (final p in pts) {
                  minX = math.min(minX, p.dx);
                  minY = math.min(minY, p.dy);
                  maxX = math.max(maxX, p.dx);
                  maxY = math.max(maxY, p.dy);
                }
                final padX = (maxX - minX) * 0.08, padY = (maxY - minY) * 0.08;
                int x0 = ((minX - padX - ox) / scale).floor().clamp(0, im.width - 1);
                int y0 = ((minY - padY - oy) / scale).floor().clamp(0, im.height - 1);
                int x1 = ((maxX + padX - ox) / scale).ceil().clamp(1, im.width);
                int y1 = ((maxY + padY - oy) / scale).ceil().clamp(1, im.height);
                final cw = x1 - x0, ch = y1 - y0;
                if (cw < 24 || ch < 24) {
                  setState(() => result = Result('', [], msg: 'Zu klein. Kreise das Objekt größer ein.'));
                  return;
                }
                final crop = img.copyCrop(im, x: x0, y: y0, width: cw, height: ch);
                final path = '${File(shot.path).parent.path}/crop_${DateTime.now().millisecondsSinceEpoch}.jpg';
                await File(path).writeAsBytes(img.encodeJpg(crop, quality: 90));

                final labeler = ImageLabeler(options: ImageLabelerOptions(confidenceThreshold: 0.4));
                final all = await labeler.processImage(InputImage.fromFilePath(path));
                await labeler.close();

                all.sort((a, b) => b.confidence.compareTo(a.confidence));
                var labs = all.where((l) => !generic.contains(l.label)).toList();
                if (labs.isEmpty) labs = all;
                if (labs.length > 6) labs = labs.sublist(0, 6);

                HapticFeedback.mediumImpact();
                setState(() {
                  sel = 0;
                  rid++;
                  result = Result(path, labs);
                });
              } catch (e) {
                final err = e.toString();
                setState(() => result = Result('', [], msg: 'Fehler: ${err.length > 140 ? err.substring(0, 140) : err}'));
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

            // ----- UI -----

            Widget _preview() {
              final c = ctrl!;
              final ps = c.value.previewSize!;
              return SizedBox.expand(
                child: ClipRect(
                  child: FittedBox(
                    fit: BoxFit.cover,
                    child: SizedBox(width: ps.height, height: ps.width, child: CameraPreview(c)),
                  ),
                ),
              );
            }

            Widget _loadingOrError() {
              return Container(
                decoration: const BoxDecoration(
                  gradient: LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF0B0A22), Color(0xFF2A1060)],
                  ),
                ),
                child: Center(
                  child: Padding(
                    padding: const EdgeInsets.all(28),
                    child: Glass(
                      radius: 32,
                      padding: const EdgeInsets.all(28),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const LogoMark(size: 96),
                          const SizedBox(height: 14),
                          const Text('Lens',
                              style: TextStyle(fontSize: 30, fontWeight: FontWeight.w800, letterSpacing: -0.5)),
                          const SizedBox(height: 10),
                          if (error == null)
                            const Padding(
                              padding: EdgeInsets.only(top: 6),
                              child: SizedBox(
                                  width: 26,
                                  height: 26,
                                  child: CircularProgressIndicator(strokeWidth: 3, color: cCyan)),
                            )
                          else ...[
                            Text(error!, textAlign: TextAlign.center, style: TextStyle(color: wh(190))),
                            const SizedBox(height: 18),
                            FilledButton(
                              onPressed: _init,
                              style: FilledButton.styleFrom(backgroundColor: cViolet),
                              child: const Text('Erneut versuchen'),
                            ),
                          ],
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }

            Widget _topBar() {
              return Positioned(
                top: MediaQuery.of(context).padding.top + 12,
                left: 16,
                right: 16,
                child: Row(
                  children: [
                    Glass(
                      radius: 30,
                      padding: const EdgeInsets.fromLTRB(10, 8, 18, 8),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const LogoMark(size: 30),
                          const SizedBox(width: 8),
                          const Text('Lens',
                              style: TextStyle(fontSize: 18, fontWeight: FontWeight.w800, letterSpacing: -0.3)),
                        ],
                      ),
                    ),
                    const Spacer(),
                    GestureDetector(
                      onTap: _toggleTorch,
                      child: Glass(
                        radius: 30,
                        padding: const EdgeInsets.all(12),
                        child: Icon(torch ? Icons.flashlight_on : Icons.flashlight_off,
                            size: 22, color: torch ? cCyan : Colors.white),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _pill(Widget child) => Glass(
                  radius: 30,
                  padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 14),
                  child: child,
                );

            Widget _bottom() {
              final bottom = MediaQuery.of(context).padding.bottom + 18;
              Widget child;
              if (busy) {
                child = _pill(Row(
                  mainAxisSize: MainAxisSize.min,
                  children: const [
                    SizedBox(
                        width: 18,
                        height: 18,
                        child: CircularProgressIndicator(strokeWidth: 2.5, color: cCyan)),
                    SizedBox(width: 12),
                    Text('Erkenne …', style: TextStyle(fontWeight: FontWeight.w600)),
                  ],
                ));
              } else if (result != null) {
                child = TweenAnimationBuilder<double>(
                  key: ValueKey(rid),
                  tween: Tween(begin: 0, end: 1),
                  duration: const Duration(milliseconds: 380),
                  curve: Curves.easeOutCubic,
                  builder: (_, v, w) => Transform.translate(
                    offset: Offset(0, (1 - v) * 70),
                    child: Opacity(opacity: v, child: w),
                  ),
                  child: _sheet(result!),
                );
              } else if (pts.isEmpty) {
                child = IgnorePointer(
                  child: _pill(Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.gesture, size: 20, color: cCyan),
                      const SizedBox(width: 10),
                      Text('Kreise etwas ein, um es zu finden',
                          style: TextStyle(fontWeight: FontWeight.w600, color: wh(230))),
                    ],
                  )),
                );
              } else {
                child = const SizedBox.shrink();
              }
              return Positioned(
                left: 16,
                right: 16,
                bottom: bottom,
                child: Center(child: child),
              );
            }

            Widget _sheet(Result r) {
              final labs = r.labels;
              if (labs.isEmpty) {
                return Glass(
                  radius: 28,
                  child: Row(
                    children: [
                      const Icon(Icons.search_off, color: cPink),
                      const SizedBox(width: 12),
                      Expanded(
                        child: Text(r.msg ?? 'Nichts erkannt. Kreise das Objekt enger ein.',
                            style: const TextStyle(fontWeight: FontWeight.w600)),
                      ),
                      IconButton(onPressed: _clear, icon: const Icon(Icons.close)),
                    ],
                  ),
                );
              }
              final cur = labs[sel.clamp(0, labs.length - 1)];
              final name = de[cur.label] ?? cur.label;
              final q = Uri.encodeQueryComponent(name);
              final shops = [
                Shop('Google Shopping', Icons.shopping_bag_outlined, cCyan,
                    'https://www.google.com/search?tbm=shop&q=$q'),
                Shop('Amazon', Icons.shopping_cart_outlined, const Color(0xFFFFB84D),
                    'https://www.amazon.de/s?k=$q'),
                Shop('idealo', Icons.sell_outlined, cViolet,
                    'https://www.idealo.de/preisvergleich/MainSearchProductCategory.html?q=$q'),
                Shop('eBay', Icons.storefront_outlined, const Color(0xFF6EE7A0),
                    'https://www.ebay.de/sch/i.html?_nkw=$q'),
                Shop('Kleinanzeigen', Icons.handshake_outlined, const Color(0xFF9BE15D),
                    'https://www.kleinanzeigen.de/s-suchanfrage.html?keywords=$q'),
                Shop('Otto', Icons.local_mall_outlined, cPink,
                    'https://www.otto.de/suchen/$q/'),
              ];
              return Glass(
                radius: 32,
                padding: const EdgeInsets.all(16),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        ClipRRect(
                          borderRadius: BorderRadius.circular(18),
                          child: Image.file(File(r.cropPath), width: 64, height: 64, fit: BoxFit.cover),
                        ),
                        const SizedBox(width: 14),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(name,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                  style: const TextStyle(
                                      fontSize: 24, fontWeight: FontWeight.w800, letterSpacing: -0.4)),
                              const SizedBox(height: 2),
                              Text('${(cur.confidence * 100).round()} % Treffer',
                                  style: TextStyle(color: wh(170), fontSize: 13)),
                            ],
                          ),
                        ),
                        IconButton(onPressed: _clear, icon: const Icon(Icons.close)),
                      ],
                    ),
                    if (labs.length > 1) ...[
                      const SizedBox(height: 12),
                      Wrap(
                        spacing: 8,
                        runSpacing: 8,
                        children: [
                          for (var i = 0; i < labs.length; i++)
                            GestureDetector(
                              onTap: () => setState(() => sel = i),
                              child: AnimatedContainer(
                                duration: const Duration(milliseconds: 200),
                                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 7),
                                decoration: BoxDecoration(
                                  borderRadius: BorderRadius.circular(20),
                                  gradient: i == sel
                                      ? const LinearGradient(colors: [cCyan, cViolet])
                                      : null,
                                  color: i == sel ? null : wh(24),
                                  border: Border.all(color: wh(i == sel ? 0 : 60)),
                                ),
                                child: Text(
                                  de[labs[i].label] ?? labs[i].label,
                                  style: TextStyle(
                                    fontSize: 13,
                                    fontWeight: FontWeight.w600,
                                    color: i == sel ? Colors.black : Colors.white,
                                  ),
                                ),
                              ),
                            ),
                        ],
                      ),
                    ],
                    const SizedBox(height: 16),
                    Text('HIER KAUFEN',
                        style: TextStyle(
                            letterSpacing: 1.6, fontSize: 11, color: wh(150), fontWeight: FontWeight.w700)),
                    const SizedBox(height: 10),
                    LayoutBuilder(builder: (context, b) {
                      final w = (b.maxWidth - 10) / 2;
                      return Wrap(
                        spacing: 10,
                        runSpacing: 10,
                        children: [for (final s in shops) SizedBox(width: w, child: _shopBtn(s))],
                      );
                    }),
                  ],
                ),
              );
            }

            Widget _shopBtn(Shop s) {
              return Material(
                color: Colors.transparent,
                child: InkWell(
                  borderRadius: BorderRadius.circular(16),
                  onTap: () async {
                    try {
                      await launchUrl(Uri.parse(s.url), mode: LaunchMode.externalApplication);
                    } catch (_) {}
                  },
                  child: Container(
                    padding: const EdgeInsets.symmetric(vertical: 13, horizontal: 12),
                    decoration: BoxDecoration(
                      borderRadius: BorderRadius.circular(16),
                      color: wh(22),
                      border: Border.all(color: wh(60)),
                    ),
                    child: Row(
                      children: [
                        Icon(s.icon, size: 18, color: s.color),
                        const SizedBox(width: 8),
                        Expanded(
                          child: Text(s.name,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                              style: const TextStyle(fontSize: 13.5, fontWeight: FontWeight.w600)),
                        ),
                        Icon(Icons.arrow_outward, size: 14, color: wh(140)),
                      ],
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: cBg,
                body: LayoutBuilder(builder: (context, box) {
                  screen = Size(box.maxWidth, box.maxHeight);
                  final ready = ctrl != null && ctrl!.value.isInitialized;
                  return Stack(
                    children: [
                      if (ready) _preview() else _loadingOrError(),
                      if (ready)
                        Positioned.fill(
                          child: GestureDetector(
                            behavior: HitTestBehavior.opaque,
                            onPanStart: _start,
                            onPanUpdate: _update,
                            onPanEnd: _end,
                            child: AnimatedBuilder(
                              animation: anim,
                              builder: (_, __) => CustomPaint(
                                painter: CirclePainter(List.of(pts), closed, anim.value),
                              ),
                            ),
                          ),
                        ),
                      if (ready) _topBar(),
                      if (ready) _bottom(),
                    ],
                  );
                }),
              );
            }
          }
          EOF

      - name: Lint abschalten (Lint-Absturz umgehen)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.contains('lintVital') || t.name.startsWith('lintAnalyze')) {
                t.enabled = false
              }
            }
          }
          EOF

      - name: APK bauen
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Lens-APK
          path: app/build/app/outputs/flutter-apk/*.apk
