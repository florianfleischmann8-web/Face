name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projekt schreiben
        run: |
          mkdir -p app/src/main/java/com/example/scan3d

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Scan3D"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.scan3d"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.scan3d"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Scan3D"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/scan3d/MainActivity.kt <<'EOF'
          package com.example.scan3d

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.detectTransformGestures
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.interaction.collectIsPressedAsState
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import kotlinx.coroutines.*
          import kotlin.math.*

          const val M = 192
          val PIf = PI.toFloat()

          class ScanView(val w: Int, val h: Int, val mask: BooleanArray, val px: IntArray, val bmp: Bitmap)
          class Model(val n: Int, val p: FloatArray, val nr: FloatArray, val c: IntArray)
          data class Preset(val name: String, val n: Int, val tol: Int)

          val PRESETS = listOf(
              Preset("Allgemein", 60, 1), Preset("Kopf", 72, 1), Preset("Körper", 64, 1),
              Preset("Flasche", 64, 0), Preset("Tisch", 64, 1)
          )

          // ---------- Bildverarbeitung (reiner Algorithmus) ----------
          fun loadView(ctx: Context, uri: Uri): ScanView? {
              try {
                  val cr = ctx.contentResolver
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  cr.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, o) }
                  var s = 1
                  while (max(o.outWidth, o.outHeight) / s > 1200) s *= 2
                  val src = cr.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it, null, BitmapFactory.Options().apply { inSampleSize = s })
                  } ?: return null
                  val deg = cr.openInputStream(uri)?.use {
                      when (android.media.ExifInterface(it).getAttributeInt(android.media.ExifInterface.TAG_ORIENTATION, 1)) {
                          6 -> 90f; 3 -> 180f; 8 -> 270f; else -> 0f
                      }
                  } ?: 0f
                  val mat = android.graphics.Matrix().apply { postRotate(deg) }
                  val rot = Bitmap.createBitmap(src, 0, 0, src.width, src.height, mat, true)
                  val sc = M.toFloat() / max(rot.width, rot.height)
                  val bmp = Bitmap.createScaledBitmap(rot, max(1, (rot.width * sc).toInt()), max(1, (rot.height * sc).toInt()), true)
                  return segment(bmp)
              } catch (e: Exception) { return null }
          }

          fun segment(bmp: Bitmap): ScanView {
              val w = bmp.width; val h = bmp.height
              val px = IntArray(w * h); bmp.getPixels(px, 0, w, 0, 0, w, h)
              var r0 = 0L; var g0 = 0L; var b0 = 0L; var c = 0L
              for (y in 0 until h) for (x in 0 until w) if (x < 5 || y < 5 || x >= w - 5 || y >= h - 5) {
                  val p = px[y * w + x]
                  r0 += (p shr 16) and 255; g0 += (p shr 8) and 255; b0 += p and 255; c++
              }
              val br = r0 / c.toFloat(); val bg = g0 / c.toFloat(); val bb = b0 / c.toFloat()
              val q = IntArray(w * h); val hist = IntArray(256)
              for (i in px.indices) {
                  val p = px[i]
                  val dr = ((p shr 16) and 255) - br; val dg = ((p shr 8) and 255) - bg; val db = (p and 255) - bb
                  q[i] = (sqrt(dr * dr + dg * dg + db * db) / 441f * 255f).toInt().coerceIn(0, 255)
                  hist[q[i]]++
              }
              var sum = 0.0; for (i in 0..255) sum += i * hist[i]
              var sB = 0.0; var wB = 0; var best = -1.0; var th = 20
              for (i in 0..255) {
                  wB += hist[i]; if (wB == 0) continue
                  val wF = q.size - wB; if (wF == 0) break
                  sB += i * hist[i]
                  val mB = sB / wB; val mF = (sum - sB) / wF
                  val v = wB.toDouble() * wF * (mB - mF) * (mB - mF)
                  if (v > best) { best = v; th = i }
              }
              th = max(th, 12)
              var mask = BooleanArray(w * h) { q[it] > th }
              repeat(2) { mask = smooth(mask, w, h) }
              return ScanView(w, h, mask, px, bmp)
          }

          fun smooth(m: BooleanArray, w: Int, h: Int): BooleanArray {
              val o = BooleanArray(m.size)
              for (y in 0 until h) for (x in 0 until w) {
                  var c = 0
                  for (dy in -1..1) for (dx in -1..1) {
                      val xx = x + dx; val yy = y + dy
                      if (xx in 0 until w && yy in 0 until h && m[yy * w + xx]) c++
                  }
                  o[y * w + x] = c >= 5
              }
              return o
          }

          // Visual Hull: Voxel bleibt nur, wenn er in (fast) allen Silhouetten liegt
          fun carve(vs: List<ScanView>, n: Int, tol: Int, flip: Boolean): Model {
              val k = vs.size
              var gMin = 1e9f; var gMax = -1e9f; var maxW = 0f; var cxs = 0f; var cnt = 0
              for (v in vs) {
                  var x0 = v.w; var x1 = -1; var y0 = v.h; var y1 = -1
                  for (y in 0 until v.h) for (x in 0 until v.w) if (v.mask[y * v.w + x]) {
                      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y
                  }
                  if (x1 < 0) continue
                  cxs += (x0 + x1 + 1) / 2f; cnt++
                  gMin = min(gMin, y0.toFloat()); gMax = max(gMax, (y1 + 1).toFloat())
                  maxW = max(maxW, (x1 - x0 + 1).toFloat())
              }
              if (cnt == 0) return Model(n, FloatArray(0), FloatArray(0), IntArray(0))
              val cx = cxs / cnt; val cy = (gMin + gMax) / 2f
              val half = max(gMax - gMin, maxW) / 2f * 1.08f
              val sgn = if (flip) -1f else 1f
              val cs = FloatArray(k) { cos(sgn * 2f * PIf * it / k) }
              val sn = FloatArray(k) { sin(sgn * 2f * PIf * it / k) }
              val occ = BooleanArray(n * n * n)
              for (xi in 0 until n) {
                  val x = (xi + 0.5f) / n * 2 - 1
                  for (yi in 0 until n) {
                      val y = (yi + 0.5f) / n * 2 - 1
                      for (zi in 0 until n) {
                          val z = (zi + 0.5f) / n * 2 - 1
                          var bad = 0
                          for (i in 0 until k) {
                              val v = vs[i]
                              val px = floor(cx + (x * cs[i] + z * sn[i]) * half).toInt()
                              val py = floor(cy - y * half).toInt()
                              if (px < 0 || py < 0 || px >= v.w || py >= v.h || !v.mask[py * v.w + px]) {
                                  bad++; if (bad > tol) break
                              }
                          }
                          occ[(xi * n + yi) * n + zi] = bad <= tol
                      }
                  }
              }
              fun o(x: Int, y: Int, z: Int) = x in 0 until n && y in 0 until n && z in 0 until n && occ[(x * n + y) * n + z]
              val dirs = arrayOf(intArrayOf(1, 0, 0), intArrayOf(-1, 0, 0), intArrayOf(0, 1, 0),
                  intArrayOf(0, -1, 0), intArrayOf(0, 0, 1), intArrayOf(0, 0, -1))
              val pl = ArrayList<Float>(); val nl = ArrayList<Float>(); val cl = ArrayList<Int>()
              for (xi in 0 until n) for (yi in 0 until n) for (zi in 0 until n) {
                  if (!occ[(xi * n + yi) * n + zi]) continue
                  var nx = 0f; var ny = 0f; var nz = 0f
                  for (d in dirs) if (!o(xi + d[0], yi + d[1], zi + d[2])) { nx += d[0]; ny += d[1]; nz += d[2] }
                  if (nx == 0f && ny == 0f && nz == 0f) continue
                  val l = sqrt(nx * nx + ny * ny + nz * nz); nx /= l; ny /= l; nz /= l
                  val x = (xi + 0.5f) / n * 2 - 1; val y = (yi + 0.5f) / n * 2 - 1; val z = (zi + 0.5f) / n * 2 - 1
                  var bd = -2f; var bi = 0
                  for (i in 0 until k) { val d = -sn[i] * nx + cs[i] * nz; if (d > bd) { bd = d; bi = i } }
                  val v = vs[bi]
                  val px = floor(cx + (x * cs[bi] + z * sn[bi]) * half).toInt().coerceIn(0, v.w - 1)
                  val py = floor(cy - y * half).toInt().coerceIn(0, v.h - 1)
                  pl.add(x); pl.add(y); pl.add(z); nl.add(nx); nl.add(ny); nl.add(nz)
                  cl.add(v.px[py * v.w + px])
              }
              return Model(n, pl.toFloatArray(), nl.toFloatArray(), cl.toIntArray())
          }

          // ---------- UI ----------
          fun Modifier.glass(r: Dp = 28.dp, a: Float = 0.12f): Modifier {
              val sh = RoundedCornerShape(r)
              return this.clip(sh)
                  .background(Brush.verticalGradient(listOf(Color.White.copy(a + 0.10f), Color.White.copy(a * 0.5f))))
                  .border(1.dp, Brush.linearGradient(listOf(Color.White.copy(0.75f), Color.White.copy(0.05f), Color.White.copy(0.35f))), sh)
          }

          @Composable
          fun T(s: String, size: TextUnit, w: FontWeight = FontWeight.Normal, a: Float = 1f) =
              Text(s, color = Color.White.copy(a), fontSize = size, fontWeight = w)

          @Composable
          fun Backdrop() {
              val t by rememberInfiniteTransition(label = "bg").animateFloat(
                  0f, 6.2832f, infiniteRepeatable(tween(16000, easing = LinearEasing)), label = "p")
              Canvas(Modifier.fillMaxSize()) {
                  drawRect(Brush.verticalGradient(listOf(Color(0xFF070B1A), Color(0xFF140A2E))))
                  val w = size.width; val h = size.height
                  fun blob(c: Color, fx: Float, fy: Float, ph: Float, r: Float) {
                      val ctr = Offset(w * (fx + 0.12f * sin(t + ph)), h * (fy + 0.08f * cos(t * 1.3f + ph)))
                      drawCircle(Brush.radialGradient(listOf(c, Color.Transparent), ctr, r), r, ctr)
                  }
                  blob(Color(0xCC2DD4FF), .2f, .2f, 0f, w * .7f)
                  blob(Color(0xCCB26BFF), .85f, .45f, 2f, w * .8f)
                  blob(Color(0xCCFF4F9A), .3f, .85f, 4f, w * .7f)
              }
          }

          @Composable
          fun GlassButton(text: String, modifier: Modifier = Modifier, enabled: Boolean = true, accent: Boolean = false, onClick: () -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val sc by animateFloatAsState(if (pressed) 0.93f else 1f, spring(dampingRatio = 0.4f, stiffness = 500f), label = "s")
              Box(
                  modifier
                      .graphicsLayer { scaleX = sc; scaleY = sc; alpha = if (enabled) 1f else 0.4f }
                      .glass(26.dp, if (accent) 0.22f else 0.12f)
                      .then(if (accent) Modifier.background(Brush.linearGradient(listOf(Color(0x5538E8FF), Color(0x55B06CFF)))) else Modifier)
                      .clickable(interactionSource = src, indication = null, enabled = enabled, onClick = onClick)
                      .padding(vertical = 17.dp, horizontal = 18.dp),
                  contentAlignment = Alignment.Center
              ) { T(text, 16.sp, FontWeight.SemiBold) }
          }

          @Composable
          fun Chip(text: String, sel: Boolean, onClick: () -> Unit) {
              val a by animateFloatAsState(if (sel) 0.34f else 0.08f, spring(stiffness = 300f), label = "c")
              Box(Modifier.glass(20.dp, a).clickable(onClick = onClick).padding(horizontal = 16.dp, vertical = 10.dp)) {
                  T(text, 14.sp, FontWeight.SemiBold)
              }
          }

          @Composable
          fun Pulse(text: String) {
              val a by rememberInfiniteTransition(label = "pl").animateFloat(
                  0.35f, 1f, infiniteRepeatable(tween(800), RepeatMode.Reverse), label = "a")
              T(text, 16.sp, FontWeight.Medium, a)
          }

          @Composable
          fun Viewer(m: Model, modifier: Modifier) {
              var yaw by remember { mutableFloatStateOf(0.6f) }
              var pitch by remember { mutableFloatStateOf(0.25f) }
              var zoom by remember { mutableFloatStateOf(1f) }
              var last by remember { mutableLongStateOf(0L) }
              val appear = remember { Animatable(0f) }
              LaunchedEffect(m) { appear.snapTo(0f); appear.animateTo(1f, spring(0.5f, 60f)) }
              LaunchedEffect(Unit) {
                  while (true) withFrameNanos { if (System.nanoTime() - last > 1_500_000_000L) yaw += 0.007f }
              }
              Canvas(modifier.pointerInput(Unit) {
                  detectTransformGestures { _, pan, z, _ ->
                      yaw += pan.x * 0.009f
                      pitch = (pitch + pan.y * 0.009f).coerceIn(-1.4f, 1.4f)
                      zoom = (zoom * z).coerceIn(0.4f, 4f)
                      last = System.nanoTime()
                  }
              }) {
                  val cnt = m.c.size
                  if (cnt == 0) return@Canvas
                  val s = min(size.width, size.height) * 0.46f * zoom * appear.value
                  val cyw = cos(yaw); val syw = sin(yaw); val cp = cos(pitch); val sp = sin(pitch)
                  val sx = FloatArray(cnt); val sy = FloatArray(cnt); val keys = LongArray(cnt)
                  for (i in 0 until cnt) {
                      val x = m.p[3 * i]; val y = m.p[3 * i + 1]; val z = m.p[3 * i + 2]
                      val x1 = x * cyw + z * syw; val z1 = -x * syw + z * cyw
                      val y1 = y * cp - z1 * sp; val z2 = y * sp + z1 * cp
                      sx[i] = size.width / 2 + x1 * s; sy[i] = size.height / 2 - y1 * s
                      keys[i] = (((z2 + 2f) * 10000f).toInt().toLong() shl 20) or i.toLong()
                  }
                  keys.sort()
                  val rad = s * (2f / m.n) * 0.72f
                  for (key in keys) {
                      val i = (key and 0xFFFFF).toInt()
                      val nx = m.nr[3 * i]; val ny = m.nr[3 * i + 1]; val nz = m.nr[3 * i + 2]
                      val nx1 = nx * cyw + nz * syw; val nz1 = -nx * syw + nz * cyw
                      val ny1 = ny * cp - nz1 * sp; val nz2 = ny * sp + nz1 * cp
                      val dif = max(0f, -0.4f * nx1 + 0.6f * ny1 + 0.7f * nz2)
                      val light = 0.4f + 0.75f * dif
                      val c = m.c[i]
                      drawCircle(
                          Color(
                              (((c shr 16) and 255) / 255f * light).coerceIn(0f, 1f),
                              (((c shr 8) and 255) / 255f * light).coerceIn(0f, 1f),
                              ((c and 255) / 255f * light).coerceIn(0f, 1f)
                          ), rad, Offset(sx[i], sy[i])
                      )
                  }
              }
          }

          @Composable
          fun App() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var views by remember { mutableStateOf(listOf<ScanView>()) }
              var model by remember { mutableStateOf<Model?>(null) }
              var busy by remember { mutableStateOf<String?>(null) }
              var preset by remember { mutableIntStateOf(0) }
              var flip by remember { mutableStateOf(false) }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetMultipleContents()) { uris ->
                  if (uris.isNotEmpty()) {
                      busy = "Fotos werden analysiert…"; model = null
                      scope.launch {
                          views = withContext(Dispatchers.Default) { uris.take(36).mapNotNull { loadView(ctx, it) } }
                          busy = null
                      }
                  }
              }
              fun generate() {
                  if (views.size < 3) return
                  busy = "Voxel-Hülle wird berechnet…"
                  scope.launch {
                      model = withContext(Dispatchers.Default) { carve(views, PRESETS[preset].n, PRESETS[preset].tol, flip) }
                      busy = null
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  Backdrop()
                  Column(Modifier.fillMaxSize().systemBarsPadding().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Column {
                          T("Scan3D", 36.sp, FontWeight.Bold)
                          T("Foto → 3D · reiner Algorithmus, keine KI", 13.sp, a = 0.6f)
                      }
                      LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          itemsIndexed(PRESETS) { i, p -> Chip(p.name, i == preset) { preset = i } }
                          item { Chip("↺ Richtung", flip) { flip = !flip } }
                      }
                      Box(Modifier.weight(1f).fillMaxWidth().glass(34.dp), contentAlignment = Alignment.Center) {
                          val b = busy; val mm = model
                          when {
                              b != null -> Pulse(b)
                              mm != null && mm.c.isNotEmpty() -> Viewer(mm, Modifier.fillMaxSize())
                              else -> Box(Modifier.padding(28.dp)) {
                                  T(
                                      if (views.isEmpty()) "Wähle 12–24 Fotos rund um das Objekt (in Drehreihenfolge, einfarbiger Hintergrund)."
                                      else "${views.size} Fotos bereit – tippe auf „3D erzeugen“.", 15.sp, a = 0.75f
                                  )
                              }
                          }
                      }
                      AnimatedVisibility(
                          views.isNotEmpty(),
                          enter = fadeIn(spring()) + slideInVertically(spring(dampingRatio = 0.6f, stiffness = 300f)) { it / 2 }
                      ) {
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              itemsIndexed(views) { _, v ->
                                  val sh = RoundedCornerShape(18.dp)
                                  Image(
                                      v.bmp.asImageBitmap(), null, contentScale = ContentScale.Crop,
                                      modifier = Modifier.size(62.dp).clip(sh).border(1.dp, Color.White.copy(0.3f), sh)
                                  )
                              }
                          }
                      }
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          GlassButton("Fotos wählen", Modifier.weight(1f)) { picker.launch("image/*") }
                          GlassButton("3D erzeugen", Modifier.weight(1f), enabled = views.size >= 3 && busy == null, accent = true) { generate() }
                      }
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent { App() }
              }
          }
          EOF

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Scan3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
