          @Composable
          fun LiveCard(on: Boolean, onToggle: (Boolean) -> Unit) {
              Row(Modifier.fillMaxWidth().glass(26.dp).padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f)) {
                      Txt("Live-Erkennung", 17, FontWeight.SemiBold)
                      Spacer(Modifier.height(4.dp))
                      Txt(
                          "Erkennt Gehen/Laufen, filtert Fake-Schritte und zeichnet die Route der letzten Stunde auf. " +
                              "Das reine Zählen funktioniert immer – auch ohne.",
                          13, FontWeight.Normal, .6f
                      )
                  }
                  Spacer(Modifier.width(12.dp))
                  Switch(checked = on, onCheckedChange = onToggle, colors = switchColors())
