          @Composable
          fun RouteCanvas(pts: List<Pt>, prog: Float, dot: Color, modifier: Modifier) {
              Canvas(modifier) {
                  if (pts.size < 2) return@Canvas
                  val lat0 = pts.map { it.lat }.average()
                  val kx = cos(Math.toRadians(lat0))
                  val xs = pts.map { it.lon * kx }
                  val ys = pts.map { -it.lat }
                  val minX = xs.min()
                  val maxX = xs.max()
                  val minY = ys.min()
                  val maxY = ys.max()
                  val pad = 28.dp.toPx()
                  val sx = max(maxX - minX, 1e-7)
                  val sy = max(maxY - minY, 1e-7)
                  val scale = min((size.width - 2 * pad) / sx, (size.height - 2 * pad) / sy)
                  val ox = (size.width - sx * scale) / 2
                  val oy = (size.height - sy * scale) / 2
                  fun pos(i: Int) = Offset((ox + (xs[i] - minX) * scale).toFloat(), (oy + (ys[i] - minY) * scale).toFloat())
                  val now = System.currentTimeMillis()
                  val n = ((pts.size - 1) * prog).toInt()
                  for (i in 1..n) {
                      if (pts[i].seg != pts[i - 1].seg) continue
                      val age = ((now - pts[i].t) / 3_600_000f).coerceIn(0f, 1f)
                      val col = if (pts[i].run) Amber else Sky
                      drawLine(col.copy(alpha = 1f - .65f * age), pos(i - 1), pos(i), strokeWidth = 5.dp.toPx(), cap = StrokeCap.Round)
                  }
                  drawCircle(Sky.copy(alpha = .35f), 15.dp.toPx(), pos(n))
                  drawCircle(dot, 6.dp.toPx(), pos(n))
              }
          }

          @Composable
          fun RouteScreen(route: List<Pt>) {
              val pal = LocalPal.current
              val prog = remember { Animatable(0f) }
              LaunchedEffect(Unit) { prog.animateTo(1f, tween(1500, easing = FastOutSlowInEasing)) }
              val rs = remember(route) { Route.stats(route) }
              val mm = (rs.timeS / 60).toInt()
              val ss = (rs.timeS % 60).toInt()
              Screen {
                  Appear(0) { Title("Route", "Letzte 60 Minuten · nur aktives Gehen & Laufen") }
                  Appear(1) {
                      Box(Modifier.fillMaxWidth().height(380.dp).glass(36.dp), contentAlignment = Alignment.Center) {
                          if (route.size < 2) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.padding(28.dp)) {
                                  Txt("Noch keine Route", 20, FontWeight.SemiBold)
                                  Spacer(Modifier.height(8.dp))
                                  Txt(
                                      "Aktiviere die Live-Erkennung und geh los. Pausen und Punkte ohne aktives Laufen werden automatisch gelöscht.",
                                      14, FontWeight.Normal, .6f, align = TextAlign.Center
                                  )
                              }
                          } else {
                              RouteCanvas(route, prog.value, pal.fg, Modifier.fillMaxSize())
                          }
                      }
                  }
                  Appear(2) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                          Stat("Ø Tempo", if (rs.timeS > 0) rs.avgKmh.f1() else "–", "km/h", Sky, Modifier.weight(1f))
                          Stat("Distanz", (rs.distM / 1000).f2(), "km", Mint, Modifier.weight(1f))
                      }
                  }
                  Appear(3) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                          Stat("Aktiv", String.format(Locale.GERMAN, "%d:%02d", mm, ss), "min", Amber, Modifier.weight(1f))
                          Stat("Punkte", "${route.size}", "GPS", Grape, Modifier.weight(1f))
                      }
                  }
                  Appear(4) {
                      Txt(
                          "Blau = Gehen, Orange = Laufen. Ältere Teile verblassen und werden nach 60 Minuten gelöscht. " +
                              "Export als GPX unter „Mehr“.",
                          12, FontWeight.Normal, .45f, modifier = Modifier.padding(horizontal = 6.dp)
                      )
                  }
              }
          }

          @Composable
          fun History(days: List<Day>, goal: Int) {
              var go by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { go = true }
              val mx = max(goal, days.maxOf { it.real }).toFloat()
              val avg = days.sumOf { it.real } / max(1, days.size)
              val best = days.maxOf { it.real }
              Screen {
                  Appear(0) { Title("Verlauf", "Die letzten 7 Tage · nur echte Schritte") }
                  Appear(1) {
                      Row(
                          Modifier.fillMaxWidth().height(290.dp).glass(32.dp).padding(horizontal = 14.dp, vertical = 18.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.Bottom
                      ) {
                          days.forEachIndexed { i, x ->
                              val target = if (go) x.real / mx else 0f
                              val f by animateFloatAsState(
                                  target, tween(900, delayMillis = i * 80, easing = FastOutSlowInEasing), label = "bar"
                              )
                              val reached = x.real >= goal
                              Column(Modifier.weight(1f), horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Bottom) {
                                  Txt(if (x.real >= 1000) (x.real / 1000.0).f1() + "k" else "${x.real}", 11, FontWeight.SemiBold, .75f)
                                  Spacer(Modifier.height(6.dp))
                                  Box(
                                      Modifier.fillMaxWidth(.78f).height((170f * f).dp)
                                          .clip(RoundedCornerShape(topStart = 12.dp, topEnd = 12.dp, bottomStart = 4.dp, bottomEnd = 4.dp))
                                          .background(Brush.verticalGradient(if (reached) listOf(Sky, Mint) else listOf(Azure, Grape)))
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Txt(
                                      LocalDate.parse(x.date).dayOfWeek.getDisplayName(JTextStyle.SHORT, Locale.GERMAN),
                                      12, if (i == days.lastIndex) FontWeight.Bold else FontWeight.Medium,
                                      if (i == days.lastIndex) 1f else .55f
                                  )
                              }
                          }
                      }
                  }
                  Appear(2) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                          Stat("Ø pro Tag", avg.fmt(), "Schritte", Sky, Modifier.weight(1f))
                          Stat("Bester Tag", best.fmt(), "Schritte", Mint, Modifier.weight(1f))
                      }
                  }
                  Appear(3) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(14.dp)) {
                          Stat("Gesamt km", days.sumOf { it.km }.f1(), "km", Amber, Modifier.weight(1f))
                          Stat("Fake gesamt", days.sumOf { it.fake }.fmt(), "erkannt", Rose, Modifier.weight(1f))
                      }
                  }
              }
          }

