# Speichere diese Datei als .github/workflows/build.yml in einem GitHub-Repository.
# Danach: Actions -> "Fristo APK bauen" -> Run workflow. Die fertige APK liegt unter "Artifacts".
name: Fristo APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: App-Code schreiben (index.html und Logo-Generator)
        run: |
          mkdir -p app/www && cd app
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#f2f2f4"><title>Fristo</title>
          <style>
          :root{--bg:#f2f2f4;--tx:#0e0e10;--tx2:#74747c;--gl:rgba(255,255,255,.6);--gl2:rgba(255,255,255,.88);--bd:rgba(255,255,255,.9);--ln:rgba(0,0,0,.07);--ink:#0e0e10;--on:#fff;--sh:0 8px 30px rgba(0,0,0,.07);--b1:#ffffff;--b2:#dcdce2}
          @media(prefers-color-scheme:dark){:root{--bg:#0b0b0d;--tx:#f4f4f6;--tx2:#8e8e96;--gl:rgba(38,38,44,.6);--gl2:rgba(44,44,50,.9);--bd:rgba(255,255,255,.1);--ln:rgba(255,255,255,.09);--ink:#f4f4f6;--on:#0e0e10;--sh:0 8px 30px rgba(0,0,0,.45);--b1:#26262c;--b2:#18181c}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0)}
          .blob{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none}
          .b1{width:320px;height:320px;background:var(--b1);top:-90px;right:-100px}
          .b2{width:300px;height:300px;background:var(--b2);bottom:40px;left:-110px}
          main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 18px 130px}
          .page{display:none}.page.on{display:block;animation:in .4s cubic-bezier(.2,.8,.2,1)}
          @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
          h1{font-size:32px;letter-spacing:-.9px;margin:4px 0 2px;font-weight:700}
          h2{font-size:18px;letter-spacing:-.3px;margin:26px 0 12px;font-weight:650}
          .sub{color:var(--tx2);font-size:15px;margin:0 0 18px}
          .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
          .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.4px}
          .brand svg{width:34px;height:34px}
          .glass{background:var(--gl);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.4)}
          .card{padding:20px}
          .big{font-size:46px;font-weight:700;letter-spacing:-1.8px;line-height:1.05;margin:4px 0}
          .mut{color:var(--tx2);font-size:14px}
          .btn{appearance:none;border:1px solid var(--bd);background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--tx);font:inherit;font-weight:620;padding:12px 18px;border-radius:999px;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
          .btn:active{transform:scale(.95)}
          .btn.pri{background:var(--ink);color:var(--on);border-color:transparent}
          .btn.full{width:100%;display:block;margin-top:10px;padding:15px}
          .btn.sm{padding:8px 14px;font-size:14px}
          .btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1;padding:12px 8px}
          .row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
          .row+.row{border-top:1px solid var(--ln)}.row:active{background:var(--ln)}
          .list{padding:0;overflow:hidden}
          .ico{width:42px;height:42px;border-radius:14px;background:var(--gl2);display:grid;place-items:center;font-weight:700;flex:none;box-shadow:inset 0 0 0 1px var(--ln)}
          .grow{flex:1;min-width:0}.grow b{display:block;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow span{color:var(--tx2);font-size:14px}
          .pill{font-size:13px;font-weight:650;padding:5px 11px;border-radius:999px;white-space:nowrap;background:var(--ln)}
          .pill.hot{background:var(--ink);color:var(--on)}
          .chips{display:flex;gap:8px;flex-wrap:wrap}
          .chip{border:1px solid var(--ln);background:transparent;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
          .chip.on{background:var(--ink);color:var(--on);border-color:transparent}
          .seg{display:inline-flex;background:var(--ln);border-radius:999px;padding:4px;margin-bottom:16px}
          .seg button{border:0;background:transparent;font:inherit;font-weight:620;font-size:14px;padding:8px 18px;border-radius:999px;color:var(--tx2);cursor:pointer;transition:all .3s}
          .seg button.on{background:var(--gl2);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.1)}
          .bar{height:8px;border-radius:4px;background:var(--ln);margin:6px 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
          .lockbox{position:relative;overflow:hidden}.lockbox .inner{filter:blur(7px);opacity:.55;pointer-events:none}
          .lockbox .lk{position:absolute;inset:0;display:grid;place-items:center}.lockbox .lk span{background:var(--gl2);border:1px solid var(--bd);padding:9px 16px;border-radius:999px;font-weight:650;font-size:14px}
          .plan{padding:22px;margin-bottom:14px;position:relative}.plan.feat{outline:1.5px solid var(--ink)}
          .plan h3{margin:0;font-size:22px;letter-spacing:-.4px}
          .plan .pr{font-size:36px;font-weight:700;letter-spacing:-1.4px;margin:8px 0 2px}.plan .pr small{font-size:15px;font-weight:500;color:var(--tx2);letter-spacing:0}
          .plan ul{list-style:none;padding:0;margin:14px 0 6px}.plan li{padding:6px 0 6px 26px;position:relative;font-size:15px}
          .plan li::before{content:"✓";position:absolute;left:0;font-weight:800}.plan li.no{color:var(--tx2)}.plan li.no::before{content:"–"}
          nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:20;width:min(420px,calc(100% - 28px));margin-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;padding:6px;border-radius:999px}
          nav button{flex:1;border:0;background:transparent;font:inherit;font-size:12px;font-weight:620;color:var(--tx2);padding:11px 0;border-radius:999px;cursor:pointer;transition:all .3s}
          nav button.on{background:var(--gl2);color:var(--tx);box-shadow:0 2px 12px rgba(0,0,0,.1)}
          .fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:19;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;display:none}.fab.show{display:block}
          .veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}.veil.on{opacity:1;pointer-events:auto}
          .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;border-radius:34px 34px 0 0;padding:12px 22px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--gl2);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--bd);border-bottom:0;box-shadow:0 -20px 60px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.25,1);max-height:90vh;overflow-y:auto}.sheet.on{transform:none}
          .grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 16px}
          .sheet h3{margin:0 0 4px;font-size:24px;letter-spacing:-.5px}
          label{display:block;font-size:13px;font-weight:620;color:var(--tx2);margin:14px 0 6px}
          input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--ln);border:1px solid transparent;border-radius:16px;padding:13px 15px;outline:none}
          input:focus,select:focus,textarea:focus{border-color:var(--ink)}
          .kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln)}.kv span{color:var(--tx2)}
          .letter{white-space:pre-wrap;font-size:14px;background:var(--ln);border-radius:18px;padding:16px;margin-top:14px;line-height:1.5}
          .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-160%);z-index:60;background:var(--gl2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);box-shadow:var(--sh);padding:12px 20px;border-radius:999px;font-weight:620;font-size:14px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);max-width:92vw;text-align:center}.toast.on{transform:translate(-50%,0)}
          .empty{text-align:center;color:var(--tx2);padding:30px 16px}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
          </style></head><body>
          <div class="blob b1"></div><div class="blob b2"></div>
          <main><section class="page on" id="p-home"></section><section class="page" id="p-list"></section><section class="page" id="p-war"></section><section class="page" id="p-plans"></section></main>
          <button class="btn pri fab" id="fab" data-a="add" aria-label="Hinzufügen">+</button>
          <nav class="glass"><button data-a="tab" data-v="home" class="on">Übersicht</button><button data-a="tab" data-v="list">Verträge</button><button data-a="tab" data-v="war">Garantien</button><button data-a="tab" data-v="plans">Pläne</button></nav>
          <div class="veil" id="veil" data-a="close"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
          <script>
          const $=s=>document.querySelector(s),cap=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
          const eur=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});
          const LOGO='<svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34343a"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient><linearGradient id="lr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9b9c2"/></linearGradient></defs><rect width="100" height="100" rx="23" fill="url(#lg)"/><path d="M50 22A28 28 0 1 1 22 50" fill="none" stroke="url(#lr)" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="50" r="7" fill="#fff"/></svg>';
          /* ===== Stripe (später aktivieren) =====
             1) Backend mit Stripe Checkout Session bauen (POST /create-checkout-session -> {url})
             2) backendUrl eintragen ODER fertige Stripe Payment Links in links eintragen
             3) Nur der publishable Key gehört in die App, niemals der Secret Key. */
          const STRIPE={publishableKey:'pk_test_HIER_EINTRAGEN',backendUrl:'',links:{pro_m:'',pro_y:'',ultra_m:'',ultra_y:''}};
          async function checkout(plan){const key=plan+(S.yearly?'_y':'_m');
           if(STRIPE.links[key]){openWeb(STRIPE.links[key]);return}
           if(STRIPE.backendUrl){try{const r=await fetch(STRIPE.backendUrl+'/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan,interval:S.yearly?'year':'month',key:STRIPE.publishableKey})});const j=await r.json();if(j.url){openWeb(j.url);return}}catch(e){}toast('Zahlung gerade nicht erreichbar');return}
           S.plan=plan;save();close();render();toast(PN[plan]+' im Demo-Modus aktiv. Stripe ist noch nicht verbunden.')}
          /* Später: Plan per Backend prüfen, z. B. GET backendUrl/subscription-status */
          const D=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
          const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
          const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
          const fmt=d=>d.toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});
          const PN={free:'Free',pro:'Pro',ultra:'Ultra'},rank={free:0,pro:1,ultra:2},LIMIT=3;
          const PROV=[
          {k:'netflix',n:'Netflix',c:'Streaming',s:'nflx://',w:'https://www.netflix.com/youraccount',x:'https://www.netflix.com/cancelplan'},
          {k:'spotify',n:'Spotify',c:'Streaming',s:'spotify://',w:'https://www.spotify.com/account/overview/',x:'https://www.spotify.com/account/subscription/'},
          {k:'prime',n:'Amazon Prime',c:'Streaming',s:'aiv://',w:'https://www.amazon.de/gp/primecentral',x:'https://www.amazon.de/gp/primecentral'},
          {k:'disney',n:'Disney+',c:'Streaming',s:'disneyplus://',w:'https://www.disneyplus.com/account',x:'https://www.disneyplus.com/account/subscription'},
          {k:'youtube',n:'YouTube Premium',c:'Streaming',s:'youtube://',w:'https://www.youtube.com/paid_memberships',x:'https://www.youtube.com/paid_memberships'},
          {k:'dazn',n:'DAZN',c:'Streaming',s:'dazn://',w:'https://www.dazn.com/de-DE/myaccount',x:'https://www.dazn.com/de-DE/myaccount'},
          {k:'vodafone',n:'Vodafone',c:'Internet & Mobil',s:'',w:'https://www.vodafone.de/meinvodafone/',x:'https://www.vodafone.de/hilfe/kuendigung.html'},
          {k:'telekom',n:'Telekom',c:'Internet & Mobil',s:'',w:'https://kundencenter.telekom.de',x:'https://kundencenter.telekom.de'},
          {k:'o2',n:'O2',c:'Internet & Mobil',s:'',w:'https://www.o2online.de/mein-o2/',x:'https://www.o2online.de/mein-o2/'},
          {k:'1und1',n:'1&1',c:'Internet & Mobil',s:'',w:'https://control-center.1und1.de',x:'https://control-center.1und1.de'},
          {k:'fitx',n:'FitX',c:'Fitness',s:'',w:'https://www.fitx.de/mein-fitx',x:'https://www.fitx.de/mein-fitx'},
          {k:'mcfit',n:'McFit',c:'Fitness',s:'',w:'https://www.mcfit.com/de/mein-mcfit/',x:'https://www.mcfit.com/de/mein-mcfit/'},
          {k:'usc',n:'Urban Sports Club',c:'Fitness',s:'',w:'https://urbansportsclub.com',x:'https://urbansportsclub.com'}];
          const CATS=['Streaming','Internet & Mobil','Fitness','Versicherung','Strom & Gas','Sonstiges'];
          const KEY='fristo.v1';
          let S=Object.assign({plan:'free',yearly:true,contracts:[],warranties:[],nid:1},JSON.parse(localStorage.getItem(KEY)||'{}'));
          const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
          let tab='home',cyc='m',selR=[5],perm='unknown',nativeOK=false;
          const mon=c=>c.y?c.c/12:c.c;
          const deadline=c=>addDays(D(c.end),-c.notice);
          const dl=c=>Math.round((deadline(c)-today())/864e5);
          const prov=c=>{if(c.pk&&c.pk!=='x')return PROV.find(p=>p.k===c.pk);if(c.url){const web=/^https?:/.test(c.url);return{s:web?'':c.url,w:web?c.url:'',x:''}}return null};
          const pill=d=>d<0?'<span class="pill hot">Frist vorbei</span>':`<span class="pill ${d<=7?'hot':''}">${d===0?'heute':'in '+d+' Tagen'}</span>`;
          const row=c=>`<div class="row" data-a="detail" data-v="${c.id}"><div class="ico">${c.n.slice(0,1).toUpperCase()}</div><div class="grow"><b>${c.n}</b><span>${eur(c.c)} / ${c.y?'Jahr':'Monat'} · ${c.cat}</span></div>${pill(dl(c))}</div>`;
          const lockBox=(h,min,msg)=>`<div class="glass card lockbox" data-a="paywall" data-v="${min}"><div class="inner">${h}</div><div class="lk"><span>${msg||PN[min]+' freischalten'}</span></div></div>`;
          function openWeb(u){const AL=cap('AppLauncher');if(AL)AL.openUrl({url:u}).catch(()=>{});else window.open(u,'_blank')}
          async function openApp(p){const AL=cap('AppLauncher');if(p.s&&AL){try{const r=await AL.openUrl({url:p.s});if(r&&r.completed)return}catch(e){}}if(p.w)openWeb(p.w);else toast('Kein Link hinterlegt')}

          function render(){
           const C=S.contracts,tot=C.reduce((s,c)=>s+mon(c),0),next=[...C].sort((a,b)=>dl(a)-dl(b)).filter(c=>dl(c)>=0)[0];
           const np=nativeOK&&perm!=='granted'?`<div class="glass card" style="margin-bottom:14px"><b>Erinnerungen aktivieren</b><p class="mut" style="margin:4px 0 0">Fristo meldet sich vor jeder Kündigungsfrist.</p><button class="btn pri full" data-a="perm">Benachrichtigungen erlauben</button></div>`:'';
           const cats=CATS.map(k=>[k,C.filter(c=>c.cat===k).reduce((s,c)=>s+mon(c),0)]).filter(x=>x[1]>0);
           const ana=`<h2>Kosten nach Kategorie</h2>`+(rank[S.plan]>=1?`<div class="glass card">${cats.map(([k,v])=>`<div style="display:flex;justify-content:space-between"><span>${k}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${Math.round(v/tot*100)}%"></i></div>`).join('')||'<span class="mut">Noch keine Daten.</span>'}</div>`:lockBox('<div style="display:flex;justify-content:space-between"><span>Streaming</span><b>00,00 €</b></div><div class="bar"><i style="width:60%"></i></div><div style="display:flex;justify-content:space-between"><span>Internet</span><b>00,00 €</b></div><div class="bar"><i style="width:35%"></i></div>','pro'));
           let nx='';if(next){const p=prov(next);nx=`<h2>Als Nächstes</h2><div class="glass card"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:20px">${next.n}</b>${pill(dl(next))}</div><p class="mut" style="margin:6px 0 0">Kündigen möglich bis ${fmt(deadline(next))}</p><div class="btns">${p&&(p.s||p.w)?`<button class="btn pri" data-a="app" data-v="${next.id}">App öffnen</button>`:''}${p&&p.x?`<button class="btn" data-a="cancel" data-v="${next.id}">Kündigen</button>`:''}<button class="btn" data-a="detail" data-v="${next.id}">Details</button></div></div>`}
           $('#p-home').innerHTML=`<div class="top"><div class="brand">${LOGO}Fristo</div><button class="btn sm" data-a="tab" data-v="plans">${PN[S.plan]}</button></div>${np}
           <div class="glass card"><div class="mut">Du zahlst pro Monat</div><div class="big">${eur(tot)}</div><div class="mut">${C.length} ${C.length===1?'Vertrag':'Verträge'} · ${eur(tot*12)} im Jahr</div></div>
           ${C.length?nx+ana:`<div class="glass card empty" style="margin-top:14px"><b style="color:var(--tx)">Noch keine Verträge</b><p style="margin:6px 0 0">Füge deinen ersten echten Vertrag hinzu. Fristo erinnert dich rechtzeitig vor der Kündigungsfrist.</p><button class="btn pri full" data-a="add">Vertrag hinzufügen</button></div>`}`;
           $('#p-list').innerHTML=`<h1>Verträge</h1><p class="sub">${C.length}${S.plan==='free'?' von '+LIMIT:''} Verträge</p>${C.length?`<div class="glass list">${[...C].sort((a,b)=>dl(a)-dl(b)).map(row).join('')}</div>`:'<div class="glass card empty">Tippe auf +, um einen Vertrag hinzuzufügen.</div>'}`;
           const W=S.warranties,wd=w=>Math.round((addDays(D(w.buy),Math.round(w.m*30.4375))-today())/864e5);
           $('#p-war').innerHTML=`<h1>Garantien</h1><p class="sub">Kaufdatum eintragen. Fristo erinnert dich vor Ablauf der Garantie.</p>`+(rank[S.plan]>=1?(W.length?`<div class="glass list">${W.map(w=>`<div class="row" data-a="wdetail" data-v="${w.id}"><div class="ico">${w.n.slice(0,1).toUpperCase()}</div><div class="grow"><b>${w.n}</b><span>${w.m} Monate${w.p?' · '+eur(w.p):''}</span></div>${wd(w)<0?'<span class="pill">abgelaufen</span>':pill(wd(w))}</div>`).join('')}</div>`:'<div class="glass card empty">Noch keine Geräte. Tippe auf +.</div>'):lockBox('<b style="font-size:20px">Garantie-Tresor</b><p class="mut">Waschmaschine, Laptop, Handy: alle Garantien an einem Ort mit Erinnerung vor Ablauf.</p>','pro','Mit Pro freischalten'));
           const P=k=>S.yearly?{pro:'2,99',ultra:'5,99'}[k]:{pro:'3,99',ultra:'7,99'}[k];
           const cta=k=>S.plan===k?'<button class="btn full" disabled style="opacity:.5">Aktueller Plan</button>':`<button class="btn ${k==='pro'?'pri':''} full" data-a="plan" data-v="${k}">${k==='free'?'Zu Free wechseln':PN[k]+' wählen'}</button>`;
           $('#p-plans').innerHTML=`<h1>Pläne</h1><p class="sub">Starte kostenlos. Upgrade, wenn es sich lohnt.</p>
           <div class="seg"><button class="${!S.yearly?'on':''}" data-a="bill" data-v="m">Monatlich</button><button class="${S.yearly?'on':''}" data-a="bill" data-v="y">Jährlich −25 %</button></div>
           <div class="glass plan"><h3>Free</h3><div class="pr">0 €</div><ul><li>${LIMIT} Verträge</li><li>1 Erinnerung pro Vertrag</li><li>Direkt zur App oder Kündigungsseite</li><li class="no">Garantie-Tresor</li><li class="no">Kündigungsschreiben</li></ul>${cta('free')}</div>
           <div class="glass plan feat"><h3>Pro</h3><div class="pr">${P('pro')} €<small> / Monat</small></div><ul><li>Unbegrenzt Verträge</li><li>Mehrere Erinnerungen pro Vertrag</li><li>Garantie-Tresor mit Erinnerung</li><li>Kündigungsschreiben in 1 Tipp</li><li>Kostenanalyse nach Kategorie</li></ul>${cta('pro')}</div>
           <div class="glass plan"><h3>Ultra</h3><div class="pr">${P('ultra')} €<small> / Monat</small></div><ul><li>Alles aus Pro</li><li>Kündigung per E-Mail vorbereiten</li><li>Backup und Wiederherstellung</li><li>Familien-Sharing (bald)</li></ul>${cta('ultra')}</div>
           ${rank[S.plan]>=2?'<div class="glass card"><b>Daten</b><div class="btns"><button class="btn" data-a="bk">Backup kopieren</button><button class="btn" data-a="rs">Einspielen</button></div></div>':''}
           <p class="mut" style="text-align:center;margin-top:12px">Jederzeit kündbar. Zahlung über Stripe, sobald verbunden.</p>`;
           document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab));
           document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
           $('#fab').classList.toggle('show',tab==='list'||tab==='home'||tab==='war');
          }
          function sheet(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('on');$('#veil').classList.add('on')}
          function close(){$('#sheet').classList.remove('on');$('#veil').classList.remove('on')}
          let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
          function paywall(min){const n=PN[min]||'Pro';sheet(`<h3>${n} freischalten</h3><p class="sub">Mehr Verträge, mehrere Erinnerungen, Garantie-Tresor und Kündigungsschreiben.</p><button class="btn pri full" data-a="plan" data-v="${min||'pro'}">${n} wählen</button><button class="btn full" data-a="plansgo">Pläne vergleichen</button>`)}
          const remChips=()=>[30,14,7,5].map(d=>`<button class="chip ${selR.includes(d)?'on':''}" data-a="rem" data-v="${d}">${d} Tage vorher</button>`).join('');
          function addSheet(){
           if(tab==='war')return wAdd();
           if(S.plan==='free'&&S.contracts.length>=LIMIT)return paywall('pro');
           cyc='m';selR=[5];
           sheet(`<h3>Vertrag hinzufügen</h3><p class="sub">Nur echte Verträge, die du wirklich hast.</p>
           <label>Anbieter</label><select id="f-p" data-ch="prov"><option value="x">Anderer Anbieter</option>${PROV.map(p=>`<option value="${p.k}">${p.n}</option>`).join('')}</select>
           <label>Name</label><input id="f-n" placeholder="z. B. Stadtwerke Strom">
           <label>Kategorie</label><select id="f-c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
           <label>Betrag in Euro</label><input id="f-b" type="number" inputmode="decimal" placeholder="9,99">
           <label>Zahlung</label><div class="seg" style="margin:0"><button class="on" data-a="cyc" data-v="m">Monatlich</button><button data-a="cyc" data-v="y">Jährlich</button></div>
           <label>Vertragsende</label><input id="f-d" type="date">
           <label>Kündigungsfrist</label><select id="f-k"><option value="0">Keine</option><option value="14">2 Wochen</option><option value="30" selected>1 Monat</option><option value="90">3 Monate</option></select>
           <label>Erinnerung vor der Frist</label><div class="chips" id="f-r">${remChips()}</div>
           <div id="f-u"><label>App- oder Webadresse (optional)</label><input id="f-l" placeholder="https://..."></div>
           <button class="btn pri full" data-a="save">Vertrag speichern</button>`)}
          function wAdd(){if(rank[S.plan]<1)return paywall('pro');
           sheet(`<h3>Gerät hinzufügen</h3><p class="sub">Erinnerung 30 Tage vor Garantie-Ende.</p><label>Gerät</label><input id="w-n" placeholder="z. B. Waschmaschine">
           <label>Kaufdatum</label><input id="w-d" type="date"><label>Garantie in Monaten</label><input id="w-m" type="number" value="24"><label>Preis in Euro (optional)</label><input id="w-p" type="number" inputmode="decimal">
           <button class="btn pri full" data-a="wsave">Speichern</button>`)}
          function detail(id){const c=S.contracts.find(x=>x.id==id);if(!c)return;const d=dl(c),p=prov(c);
           sheet(`<h3>${c.n}</h3>${pill(d)}<div class="kv" style="margin-top:12px"><span>Kosten</span><b>${eur(c.c)} / ${c.y?'Jahr':'Monat'}</b></div><div class="kv"><span>Vertragsende</span><b>${fmt(D(c.end))}</b></div><div class="kv"><span>Kündigen bis</span><b>${fmt(deadline(c))}</b></div><div class="kv"><span>Erinnerung</span><b>${c.rem.map(r=>r+' T').join(', ')}</b></div><div id="ex"></div>
           ${p&&(p.s||p.w)?`<button class="btn pri full" data-a="app" data-v="${c.id}">App öffnen</button>`:''}${p&&p.x?`<button class="btn full" data-a="cancel" data-v="${c.id}">Kündigungsseite öffnen</button>`:''}
           <button class="btn full" data-a="letter" data-v="${c.id}">Kündigungsschreiben erstellen</button><button class="btn full" data-a="del" data-v="${c.id}">Vertrag löschen</button>`)}
          const A={tab(v){tab=v;render();scrollTo({top:0,behavior:'smooth'})},bill(v){S.yearly=v==='y';save();render()},add:addSheet,close,paywall,plansgo(){close();A.tab('plans')},
           cyc(v,el){cyc=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
           rem(v,el){v=+v;if(selR.includes(v)){selR=selR.filter(x=>x!==v)}else{if(S.plan==='free'&&selR.length>=1){paywall('pro');return}selR.push(v)}$('#f-r').innerHTML=remChips()},
           plan(v){if(v==='free'){S.plan='free';save();render();toast('Du bist im Free-Plan');return}checkout(v)},
           perm:askPerm,
           save(){const n=$('#f-n').value.trim(),b=parseFloat($('#f-b').value.replace(',','.')),e=$('#f-d').value,pk=$('#f-p').value;
            if(!n||!(b>0)){toast('Bitte Name und Betrag eingeben');return}if(!e||D(e)<today()){toast('Bitte ein Vertragsende in der Zukunft wählen');return}
            S.contracts.push({id:S.nid++,n,pk,cat:$('#f-c').value,c:b,y:cyc==='y'?1:0,end:e,notice:+$('#f-k').value,rem:[...selR],url:$('#f-l').value.trim()});
            save();close();render();sync();toast(n+' gespeichert')},
           wsave(){const n=$('#w-n').value.trim(),b=$('#w-d').value,m=+$('#w-m').value;if(!n||!b||!(m>0)){toast('Bitte alle Felder ausfüllen');return}
            S.warranties.push({id:S.nid++,n,buy:b,m,p:parseFloat($('#w-p').value)||0});save();close();render();sync();toast(n+' gespeichert')},
           detail,wdetail(v){const w=S.warranties.find(x=>x.id==v);if(!w)return;sheet(`<h3>${w.n}</h3><div class="kv" style="margin-top:12px"><span>Gekauft</span><b>${fmt(D(w.buy))}</b></div><div class="kv"><span>Garantie</span><b>${w.m} Monate</b></div><div class="kv"><span>Läuft ab</span><b>${fmt(addDays(D(w.buy),Math.round(w.m*30.4375)))}</b></div><button class="btn full" data-a="wdel" data-v="${w.id}">Gerät löschen</button>`)},
           wdel(v){S.warranties=S.warranties.filter(x=>x.id!=v);save();close();render();sync()},
           app(v){const c=S.contracts.find(x=>x.id==v),p=c&&prov(c);if(p)openApp(p)},
           cancel(v){const c=S.contracts.find(x=>x.id==v),p=c&&prov(c);if(p&&p.x)openWeb(p.x)},
           del(v){S.contracts=S.contracts.filter(x=>x.id!=v);save();close();render();sync();toast('Vertrag gelöscht')},
           letter(v){const c=S.contracts.find(x=>x.id==v);if(rank[S.plan]<1)return paywall('pro');
            const t=`Sehr geehrte Damen und Herren,\n\nhiermit kündige ich meinen Vertrag (${c.n}, Kundennummer: [bitte ergänzen]) ordentlich und fristgerecht zum ${fmt(D(c.end))}, hilfsweise zum nächstmöglichen Zeitpunkt.\n\nBitte bestätigen Sie mir die Kündigung schriftlich unter Angabe des Beendigungsdatums.\n\nMit freundlichen Grüßen\n[Dein Name]`;
            window._ltr=t;$('#ex').innerHTML=`<div class="letter">${t}</div><div class="btns"><button class="btn" data-a="copy">Kopieren</button><button class="btn" data-a="mail">Per E-Mail</button></div>`},
           copy(){try{navigator.clipboard.writeText(window._ltr)}catch(e){}toast('Kopiert')},
           mail(){if(rank[S.plan]<2)return paywall('ultra');openWeb('mailto:?subject='+encodeURIComponent('Kündigung')+'&body='+encodeURIComponent(window._ltr))},
           bk(){try{navigator.clipboard.writeText(JSON.stringify(S))}catch(e){}toast('Backup kopiert')},
           rs(){sheet(`<h3>Backup einspielen</h3><p class="sub">Füge den kopierten Backup-Text ein.</p><textarea id="bk-t" rows="6"></textarea><button class="btn pri full" data-a="rsgo">Einspielen</button>`)},
           rsgo(){try{const j=JSON.parse($('#bk-t').value);if(!Array.isArray(j.contracts))throw 0;S=Object.assign(S,j);save();close();render();sync();toast('Backup eingespielt')}catch(e){toast('Das ist kein gültiges Backup')}}};
          document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||a.disabled)return;(A[a.dataset.a]||(()=>{}))(a.dataset.v,a)});
          document.addEventListener('change',e=>{if(e.target.dataset.ch==='prov'){const p=PROV.find(x=>x.k===e.target.value);if(p){$('#f-n').value=p.n;$('#f-c').value=p.c;$('#f-u').style.display='none'}else{$('#f-u').style.display='block'}}});
          /* ===== Benachrichtigungen ===== */
          async function askPerm(){const LN=cap('LocalNotifications');if(!LN)return;try{const r=await LN.requestPermissions();perm=r.display}catch(e){}render();sync()}
          async function sync(){const LN=cap('LocalNotifications');if(!LN||perm!=='granted')return;
           try{const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications});
           const now=Date.now(),list=[];let id=1;
           const at=(d)=>{const x=new Date(d);x.setHours(9,0,0,0);return x};
           S.contracts.forEach(c=>{[...c.rem,0].forEach(r=>{const w=at(addDays(deadline(c),-r));if(w.getTime()>now)list.push({id:id++,title:r===0?'Heute endet die Kündigungsfrist':'Kündigungsfrist in '+r+' Tagen',body:c.n+': Jetzt prüfen, ob du kündigen willst.',schedule:{at:w}})})});
           S.warranties.forEach(w=>{const end=addDays(D(w.buy),Math.round(w.m*30.4375)),when=at(addDays(end,-30));if(when.getTime()>now)list.push({id:id++,title:'Garantie läuft bald ab',body:w.n+': Noch 30 Tage Garantie. Jetzt auf Mängel prüfen.',schedule:{at:when}})});
           if(list.length)await LN.schedule({notifications:list})}catch(e){}}
          (async()=>{const LN=cap('LocalNotifications');nativeOK=!!LN;if(LN){try{const r=await LN.checkPermissions();perm=r.display}catch(e){}}render();sync()})();
          render();
          </script></body></html>
          EOF
          cat > icons.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          fs.mkdirSync('assets', { recursive: true });
          const defs = '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34343a"/><stop offset="1" stop-color="#0a0a0c"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b9c2"/></linearGradient></defs>';
          const mark = '<path d="M50 22A28 28 0 1 1 22 50" fill="none" stroke="url(#r)" stroke-width="8" stroke-linecap="round"/><circle cx="50" cy="50" r="7" fill="#fff"/>';
          const wrap = (inner) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + defs + inner + '</svg>';
          const small = '<g transform="translate(50 50) scale(0.8) translate(-50 -50)">' + mark + '</g>';
          const out = async (name, svg) => sharp(Buffer.from(svg)).resize(1024, 1024).png().toFile('assets/' + name);
          (async () => {
            await out('icon-only.png', wrap('<rect width="100" height="100" fill="url(#g)"/>' + mark));
            await out('icon-background.png', wrap('<rect width="100" height="100" fill="url(#g)"/>'));
            await out('icon-foreground.png', wrap(small));
            console.log('Icons erstellt');
          })();
          EOF

      - name: Capacitor installieren
        working-directory: app
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app-launcher@6 @capacitor/assets sharp
          npx cap init Fristo de.fristo.app --web-dir www
          npx cap add android

      - name: Logo und App-Icons erzeugen
        working-directory: app
        run: |
          node icons.js
          npx capacitor-assets generate --android

      - name: Benachrichtigungs-Berechtigung eintragen
        working-directory: app
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: APK bauen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fristo-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
