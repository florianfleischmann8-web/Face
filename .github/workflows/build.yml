          // ---------------------------------------------------------------- Ringe
          @Composable
          fun Rings(outer: Float, inner: Float, modifier: Modifier = Modifier) {
              val o by animateFloatAsState(outer.coerceIn(0f, 1f), spring(dampingRatio = .75f, stiffness = 30f), label = "o")
              val i by animateFloatAsState(inner.coerceIn(0f, 1f), spring(dampingRatio = .75f, stiffness = 30f), label = "i")
              Canvas(modifier) {
                  val w = size.minDimension
                  val st = w * 0.085f
                  fun ring(inset: Float, p: Float, a: Color, b: Color) {
                      val dia = w - inset * 2 - st
                      val tl = Offset(inset + st / 2, inset + st / 2)
                      drawArc(
                          color = a.copy(alpha = .16f), startAngle = 0f, sweepAngle = 360f, useCenter = false,
                          topLeft = tl, size = Size(dia, dia), style = Stroke(st, cap = StrokeCap.Round)
                      )
                      if (p > 0.003f) {
                          val br = Brush.sweepGradient(0f to a, max(p, .02f) to b, 1f to b, center = center)
                          rotate(-90f) {
                              drawArc(
                                  brush = br, startAngle = 0f, sweepAngle = 360f * min(p, 1f), useCenter = false,
                                  topLeft = tl, size = Size(dia, dia), style = Stroke(st, cap = StrokeCap.Round)
                              )
                          }
                      }
                  }
                  ring(0f, o, Mint, Sky)
                  ring(st * 1.35f, i, Rose, Amber)
              }
          }

          @Composable
          fun RingCard(d: Day, goal: Int) {
