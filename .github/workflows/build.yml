              <path
                  android:pathData="M54,30 A24,24 0 1,1 54,78 A24,24 0 1,1 54,30"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:fillColor="#00000000">
                  <aapt:attr name="android:strokeColor">
                      <gradient
                          android:startX="30" android:startY="30"
                          android:endX="78" android:endY="78"
                          android:type="linear">
                          <item android:offset="0" android:color="#30D158" />
                          <item android:offset="0.5" android:color="#64D2FF" />
                          <item android:offset="1" android:color="#BF5AF2" />
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:fillColor="#FFFFFF" android:pathData="M43,60 a5,8 0 1,0 10,0 a5,8 0 1,0 -10,0" />
              <path android:fillColor="#FFFFFF" android:pathData="M55,48 a5,8 0 1,0 10,0 a5,8 0 1,0 -10,0" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_stat.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,12m-6,0a6,6 0 1,0 12,0a6,6 0 1,0 -12,0" />
          </vector>
          EOF

          # ---------- Widget (Glas-Design) ----------
          cat > app/src/main/res/drawable/widget_glass.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <gradient android:startColor="#B31E2A4A" android:endColor="#B30A0E1B" android:angle="315" />
