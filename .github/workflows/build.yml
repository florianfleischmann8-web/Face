          cat > app/src/main/java/de/fernbedienung/Remotes.kt <<'EOF_5'
          package de.fernbedienung

          import android.annotation.SuppressLint
          import android.content.SharedPreferences
          import android.util.Base64
          import okhttp3.*
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.security.SecureRandom
          import java.security.cert.X509Certificate
          import java.util.concurrent.TimeUnit
          import javax.net.ssl.SSLContext
          import javax.net.ssl.X509TrustManager

          enum class Key { POWER, VOL_UP, VOL_DOWN, MUTE, CH_UP, CH_DOWN, UP, DOWN, LEFT, RIGHT, OK, BACK, HOME, MENU, PLAY }

          interface NetRemote {
              fun send(key: Key)
              fun close()
          }

          /** TVs nutzen im LAN selbstsignierte Zertifikate, daher wird hier nicht geprueft (nur lokale Geraete!). */
          @SuppressLint("CustomX509TrustManager", "TrustAllX509TrustManager")
          fun unsafeClient(pingSeconds: Long = 20): OkHttpClient {
              val tm = object : X509TrustManager {
                  override fun checkClientTrusted(c: Array<X509Certificate>, a: String) {}
                  override fun checkServerTrusted(c: Array<X509Certificate>, a: String) {}
                  override fun getAcceptedIssuers(): Array<X509Certificate> = arrayOf()
              }
              val ctx = SSLContext.getInstance("TLS")
              ctx.init(null, arrayOf(tm), SecureRandom())
              return OkHttpClient.Builder()
                  .sslSocketFactory(ctx.socketFactory, tm)
                  .hostnameVerifier { _, _ -> true }
                  .connectTimeout(4, TimeUnit.SECONDS)
                  .readTimeout(0, TimeUnit.SECONDS)
                  .pingInterval(pingSeconds, TimeUnit.SECONDS)
                  .build()
          }

          /** Magic Packet. Muss ausserhalb des Main-Threads laufen. */
          fun wakeOnLan(mac: String): Boolean {
              val hex = mac.replace(Regex("[^0-9A-Fa-f]"), "")
              if (hex.length != 12) return false
              val m = ByteArray(6) { hex.substring(it * 2, it * 2 + 2).toInt(16).toByte() }
              val data = ByteArray(6) { 0xFF.toByte() } + ByteArray(96) { m[it % 6] }
              DatagramSocket().use { s ->
                  s.broadcast = true
                  s.send(DatagramPacket(data, data.size, InetAddress.getByName("255.255.255.255"), 9))
              }
              return true
          }

          // ---------------------------------------------------------------- Samsung (Tizen)
          class SamsungRemote(
              private val ip: String,
              private val prefs: SharedPreferences,
              private val info: (String) -> Unit
          ) : NetRemote {
              private val client = unsafeClient()
              private var ws: WebSocket? = null
              @Volatile private var ready = false
              private val pending = ArrayList<String>()
              private val name = Base64.encodeToString("Handy".toByteArray(), Base64.NO_WRAP)

              init { connect(true) }

              private fun connect(secure: Boolean) {
                  val token = prefs.getString("sam_$ip", null)
                  val base = "/api/v2/channels/samsung.remote.control?name=$name"
                  val url = if (secure) "wss://$ip:8002$base" + (token?.let { "&token=$it" } ?: "")
                            else "ws://$ip:8001$base"
                  ws = client.newWebSocket(Request.Builder().url(url).build(), object : WebSocketListener() {
                      override fun onMessage(webSocket: WebSocket, text: String) {
                          try {
                              val j = JSONObject(text)
                              when (j.optString("event")) {
                                  "ms.channel.connect" -> {
                                      j.optJSONObject("data")?.optString("token")?.takeIf { it.isNotEmpty() }
                                          ?.let { prefs.edit().putString("sam_$ip", it).apply() }
                                      ready = true
                                      info("Samsung verbunden")
                                      synchronized(pending) { pending.forEach { webSocket.send(it) }; pending.clear() }
                                  }
                                  "ms.channel.timeOut", "ms.error" -> info("Samsung: Am TV 'Zulassen' waehlen und neu versuchen")
                              }
                          } catch (_: Exception) {}
                      }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          ready = false; ws = null
                          if (secure) connect(false) else info("Samsung: Verbindung fehlgeschlagen (${t.message})")
                      }
                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) { ready = false; ws = null }
                  })
              }

              override fun send(key: Key) {
                  val code = when (key) {
                      Key.POWER -> "KEY_POWER"; Key.VOL_UP -> "KEY_VOLUP"; Key.VOL_DOWN -> "KEY_VOLDOWN"
                      Key.MUTE -> "KEY_MUTE"; Key.CH_UP -> "KEY_CHUP"; Key.CH_DOWN -> "KEY_CHDOWN"
                      Key.UP -> "KEY_UP"; Key.DOWN -> "KEY_DOWN"; Key.LEFT -> "KEY_LEFT"; Key.RIGHT -> "KEY_RIGHT"
                      Key.OK -> "KEY_ENTER"; Key.BACK -> "KEY_RETURN"; Key.HOME -> "KEY_HOME"
                      Key.MENU -> "KEY_MENU"; Key.PLAY -> "KEY_PLAY"
                  }
                  val msg = JSONObject().put("method", "ms.remote.control").put(
                      "params", JSONObject().put("Cmd", "Click").put("DataOfCmd", code)
                          .put("Option", "false").put("TypeOfRemote", "SendRemoteKey")
                  ).toString()
                  if (ready) ws?.send(msg) else {
                      synchronized(pending) { if (pending.size < 5) pending.add(msg) }
                      if (ws == null) connect(true)
                  }
              }

              override fun close() { ws?.close(1000, null); ws = null }
          }

          // ---------------------------------------------------------------- LG webOS
          class LgRemote(
              private val ip: String,
              private val prefs: SharedPreferences,
              private val info: (String) -> Unit
          ) : NetRemote {
              private val client = unsafeClient()
              // Der Tasten-Kanal bekommt kein Ping, sonst trennt ihn der TV manchmal.
              private val pointerClient = unsafeClient(0)
              private var ws: WebSocket? = null
              private var pointer: WebSocket? = null
              @Volatile private var ready = false
              @Volatile private var pointerOpen = false
              @Volatile private var pointerRequested = false
              private val queued = ArrayList<String>()
              private var muted = false
              private var playing = true
              private var n = 0

              init { connect(true) }

              private fun registerJson(): String {
                  val perms = JSONArray(listOf(
                      "LAUNCH", "LAUNCH_WEBAPP", "APP_TO_APP", "CLOSE", "TEST_OPEN", "TEST_PROTECTED",
                      "CONTROL_AUDIO", "CONTROL_DISPLAY", "CONTROL_INPUT_JOYSTICK", "CONTROL_INPUT_MEDIA_RECORDING",
                      "CONTROL_INPUT_MEDIA_PLAYBACK", "CONTROL_INPUT_TV", "CONTROL_POWER", "CONTROL_TV_SCREEN",
                      "CONTROL_TV_STANBY", "CONTROL_BLUETOOTH", "CONTROL_INPUT_TEXT", "CONTROL_MOUSE_AND_KEYBOARD",
                      "READ_APP_STATUS", "READ_CURRENT_CHANNEL", "READ_INPUT_DEVICE_LIST", "READ_NETWORK_STATE",
                      "READ_RUNNING_APPS", "READ_TV_CHANNEL_LIST", "READ_POWER_STATE", "READ_COUNTRY_INFO",
                      "READ_SETTINGS", "READ_INSTALLED_APPS", "READ_LGE_SDX", "READ_NOTIFICATIONS",
                      "READ_UPDATE_INFO", "SEARCH", "WRITE_SETTINGS", "WRITE_NOTIFICATION_ALERT",
                      "WRITE_NOTIFICATION_TOAST", "UPDATE_FROM_REMOTE_APP"
                  ))
                  // Ohne Signatur: Der TV zeigt den Koppeln-Dialog und gewaehrt die hier genannten Rechte.
                  val manifest = JSONObject().put("manifestVersion", 1).put("appVersion", "1.1").put("permissions", perms)
                  val payload = JSONObject().put("forcePairing", false).put("pairingType", "PROMPT").put("manifest", manifest)
                  prefs.getString("lg2_$ip", null)?.let { payload.put("client-key", it) }
                  return JSONObject().put("type", "register").put("id", "register_0").put("payload", payload).toString()
              }

              private fun resetPointer() {
                  pointerOpen = false; pointerRequested = false
                  try { pointer?.cancel() } catch (_: Exception) {}
                  pointer = null
              }

              private fun requestPointer() {
                  if (pointerRequested || !ready) return
                  pointerRequested = true
                  ws?.send(JSONObject().put("id", "ptr").put("type", "request")
                      .put("uri", "ssap://com.webos.service.networkinput/getPointerInputSocket").toString())
              }

              private fun openPointer(path: String) {
                  pointer = pointerClient.newWebSocket(Request.Builder().url(path).build(), object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          pointerOpen = true
                          synchronized(queued) { queued.forEach { webSocket.send(it) }; queued.clear() }
                      }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          pointerOpen = false; pointerRequested = false; pointer = null
                          info("LG: Tasten-Kanal Fehler (${t.message})")
                      }
                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                          pointerOpen = false; pointerRequested = false; pointer = null
                      }
                  })
              }

              private fun connect(secure: Boolean) {
                  val url = if (secure) "wss://$ip:3001" else "ws://$ip:3000"
                  ws = client.newWebSocket(Request.Builder().url(url).build(), object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          info("LG: Am TV die Verbindung bestaetigen")
                          webSocket.send(registerJson())
                      }
                      override fun onMessage(webSocket: WebSocket, text: String) {
                          try {
                              val j = JSONObject(text)
                              when (j.optString("type")) {
                                  "registered" -> {
                                      j.optJSONObject("payload")?.optString("client-key")?.takeIf { it.isNotEmpty() }
                                          ?.let { prefs.edit().putString("lg2_$ip", it).apply() }
                                      ready = true
                                      info("LG verbunden")
                                      requestPointer()
                                  }
                                  "response" -> if (j.optString("id") == "ptr") {
                                      val path = j.optJSONObject("payload")?.optString("socketPath")
                                      if (!path.isNullOrEmpty()) openPointer(path)
                                      else { pointerRequested = false; info("LG: Tasten-Kanal abgelehnt, bitte neu koppeln") }
                                  }
                                  "error" -> {
                                      if (j.optString("id") == "ptr") pointerRequested = false
                                      info("LG: " + j.optString("error"))
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          ready = false; ws = null; resetPointer()
                          if (secure) connect(false) else info("LG: Verbindung fehlgeschlagen (${t.message})")
                      }
                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) { ready = false; ws = null; resetPointer() }
                  })
              }

              override fun send(key: Key) {
                  if (ws == null) { connect(true); return }
                  if (!ready) return
                  fun req(uri: String, payload: JSONObject = JSONObject()) {
                      ws?.send(JSONObject().put("id", "r${n++}").put("type", "request").put("uri", uri).put("payload", payload).toString())
                  }
                  fun btn(name: String) {
                      val msg = "type:button\nname:$name\n\n"
                      if (pointerOpen && pointer != null) {
                          if (pointer?.send(msg) != true) resetPointer()
                      } else {
                          synchronized(queued) { if (queued.size < 5) queued.add(msg) }
                          requestPointer()
                      }
                  }
                  when (key) {
                      Key.POWER -> req("ssap://system/turnOff")
                      Key.VOL_UP -> req("ssap://audio/volumeUp")
                      Key.VOL_DOWN -> req("ssap://audio/volumeDown")
                      Key.MUTE -> { muted = !muted; req("ssap://audio/setMute", JSONObject().put("mute", muted)) }
                      Key.CH_UP -> req("ssap://tv/channelUp")
                      Key.CH_DOWN -> req("ssap://tv/channelDown")
                      Key.UP -> btn("UP"); Key.DOWN -> btn("DOWN"); Key.LEFT -> btn("LEFT"); Key.RIGHT -> btn("RIGHT")
                      Key.OK -> btn("ENTER"); Key.BACK -> btn("BACK"); Key.MENU -> btn("MENU")
                      Key.HOME -> req("ssap://system.launcher/launch", JSONObject().put("id", "com.webos.app.home"))
                      Key.PLAY -> { playing = !playing; req(if (playing) "ssap://media.controls/play" else "ssap://media.controls/pause") }
                  }
              }

              override fun close() { resetPointer(); ws?.close(1000, null); ws = null }
          }

          // ---------------------------------------------------------------- Roku (HTTP ECP)
          class RokuRemote(private val ip: String, private val info: (String) -> Unit) : NetRemote {
              private val client = OkHttpClient.Builder().connectTimeout(3, TimeUnit.SECONDS).build()
              init { info("Roku bereit") }

              override fun send(key: Key) {
                  val k = when (key) {
                      Key.POWER -> "Power"; Key.VOL_UP -> "VolumeUp"; Key.VOL_DOWN -> "VolumeDown"; Key.MUTE -> "VolumeMute"
                      Key.CH_UP -> "ChannelUp"; Key.CH_DOWN -> "ChannelDown"
                      Key.UP -> "Up"; Key.DOWN -> "Down"; Key.LEFT -> "Left"; Key.RIGHT -> "Right"
                      Key.OK -> "Select"; Key.BACK -> "Back"; Key.HOME -> "Home"; Key.MENU -> "Info"; Key.PLAY -> "Play"
                  }
                  val req = Request.Builder().url("http://$ip:8060/keypress/$k").post(ByteArray(0).toRequestBody()).build()
                  client.newCall(req).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) { info("Roku: ${e.message}") }
                      override fun onResponse(call: Call, response: Response) { response.close() }
                  })
              }

              override fun close() {}
          }
          EOF_5
          cat > app/src/main/java/de/fernbedienung/Bt.kt <<'EOF_6'
          package de.fernbedienung

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context

          /**
           * Das Handy gibt sich per Bluetooth als "Consumer-Control"-Fernbedienung (HID) aus.
           * Funktioniert mit Geraeten, die Bluetooth-Fernbedienungen/Tastaturen akzeptieren
           * (Android/Google TV, Fire TV, Apple TV, manche Beamer).
           */
          @SuppressLint("MissingPermission")
          class BtHid(private val ctx: Context, private val info: (String) -> Unit) {
              private var hid: BluetoothHidDevice? = null
              private var host: BluetoothDevice? = null
              private val adapter: BluetoothAdapter? =
                  (ctx.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter

              companion object {
                  private val DESC = intArrayOf(
                      0x05, 0x0C, 0x09, 0x01, 0xA1, 0x01, 0x85, 0x01,
                      0x15, 0x00, 0x26, 0xFF, 0x03, 0x19, 0x00, 0x2A, 0xFF, 0x03,
                      0x75, 0x10, 0x95, 0x01, 0x81, 0x00, 0xC0
                  ).map { it.toByte() }.toByteArray()

                  fun usage(k: Key): Int = when (k) {
                      Key.POWER -> 0x30; Key.VOL_UP -> 0xE9; Key.VOL_DOWN -> 0xEA; Key.MUTE -> 0xE2
                      Key.CH_UP -> 0x9C; Key.CH_DOWN -> 0x9D
                      Key.UP -> 0x42; Key.DOWN -> 0x43; Key.LEFT -> 0x44; Key.RIGHT -> 0x45; Key.OK -> 0x41
                      Key.BACK -> 0x224; Key.HOME -> 0x223; Key.MENU -> 0x40; Key.PLAY -> 0xCD
                  }
              }

              fun start(device: BluetoothDevice) {
                  host = device
                  val ad = adapter ?: run { info("Kein Bluetooth"); return }
                  if (device.bondState != BluetoothDevice.BOND_BONDED) {
                      device.createBond()
                      info("Erst koppeln: Anfrage bestaetigen (am TV ggf. auch), dann das Geraet erneut antippen.")
                      return
                  }
                  info("Bluetooth: verbinde ...")
                  ad.getProfileProxy(ctx, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          val h = proxy as BluetoothHidDevice
                          hid = h
                          val sdp = BluetoothHidDeviceAppSdpSettings(
                              "Handy Fernbedienung", "Remote", "DIY", BluetoothHidDevice.SUBCLASS1_COMBO, DESC
                          )
                          h.registerApp(sdp, null, null, ctx.mainExecutor, object : BluetoothHidDevice.Callback() {
                              override fun onAppStatusChanged(pluggedDevice: BluetoothDevice?, registered: Boolean) {
                                  if (registered) h.connect(device) else info("HID-Registrierung fehlgeschlagen")
                              }
                              override fun onConnectionStateChanged(d: BluetoothDevice, state: Int) {
                                  if (d.address != device.address) return
                                  info(when (state) {
                                      BluetoothProfile.STATE_CONNECTED -> "Bluetooth verbunden"
                                      BluetoothProfile.STATE_CONNECTING -> "Bluetooth: verbinde ..."
                                      else -> "Getrennt. Das Geraet muss das Handy als Tastatur/Fernbedienung akzeptieren."
                                  })
                              }
                          })
                      }
                      override fun onServiceDisconnected(profile: Int) { hid = null }
                  }, BluetoothProfile.HID_DEVICE)
              }

              fun press(k: Key) {
                  val h = hid ?: return
                  val d = host ?: return
                  val u = usage(k)
                  h.sendReport(d, 1, byteArrayOf((u and 0xFF).toByte(), (u shr 8).toByte()))
                  h.sendReport(d, 1, byteArrayOf(0, 0))
              }

              fun stop() {
                  try { hid?.unregisterApp() } catch (_: Exception) {}
                  try { adapter?.closeProfileProxy(BluetoothProfile.HID_DEVICE, hid) } catch (_: Exception) {}
                  hid = null
              }
          }
          EOF_6
